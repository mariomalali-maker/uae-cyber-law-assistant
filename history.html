<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>History | Cyber Assistant</title>
  <link rel="stylesheet" href="styles/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body class="page-body">
  <nav class="top-nav">
 <a href="index.html">🏠 Home</a>
    <a class="active">💬 Chat</a>
    <a href="history.html">📁 History</a>
    <a href="quiz.html">🎯 Quiz</a>
    <a href="detector.html">🛡️ Detector</a>
     <a href="saeed.game.html">Saeeds Cyber Game - Kids Version </a>
  </nav>

  <main class="center-layout">
    <section class="history-card floating">
      <h2>Chat History</h2>
      <p class="chat-sub">
        Only stored in your browser (local device). You can delete it anytime.
      </p>
      <div id="history-list" class="history-list"></div>
      <button id="clear-history-btn" class="btn danger full-width">
        Delete all history
      </button>
    </section>
  </main>

  <footer class="footer">
    Created by Mariam – 2025
  </footer>

  <script>
    const list = document.getElementById('history-list');
    const clearBtn = document.getElementById('clear-history-btn');

    function loadHistory() {
      list.innerHTML = "";
      const data = JSON.parse(localStorage.getItem('cyber_history') || '[]');
      if (!data.length) {
        list.innerHTML = "<p class='empty'>No saved chats yet.</p>";
        return;
      }
      data.forEach((conv, idx) => {
        const div = document.createElement('div');
        div.className = 'history-item';
        const preview = conv.messages.find(m => m.role === 'user')?.content || 'Conversation';
        div.innerHTML = `
          <div class="history-meta">
            <strong>Chat #${idx + 1}</strong>
            <span>${new Date(conv.time).toLocaleString()}</span>
          </div>
          <p class="history-preview">${preview}</p>
        `;
        list.appendChild(div);
      });
    }

    clearBtn.addEventListener('click', () => {
      if (confirm('Delete all saved chats?')) {
        localStorage.removeItem('cyber_history');
        loadHistory();
      }
    });

    loadHistory();
  </script>
</body>
</html>
