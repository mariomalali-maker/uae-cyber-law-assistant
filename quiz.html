<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎯 Cyber Quiz | Mariam</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin:0;
      background:radial-gradient(circle at top, #0f172a, #020617);
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      color:white; text-align:center;
    }

    nav {
      display:flex; gap:10px; align-items:center;
      padding:10px; background:#111827; position:sticky; top:0;
      z-index:10; border-bottom:1px solid #1e293b;
    }
    nav a {
      text-decoration:none; color:#e5e7eb; padding:6px 12px;
      border-radius:8px; font-size:14px;
    }
    nav a.active { background:#334155; }

    #langBtn {
      margin-left:auto; background:#2563eb; border:none;
      padding:6px 10px; border-radius:6px; color:white;
      cursor:pointer; font-size:14px;
    }

    #progressBar { width:100%; height:8px; background:#1e293b; border-radius:4px; margin:20px 0;}
    #progress { height:8px; width:0%; background:#22c55e; border-radius:4px; transition:0.3s; }

    #quizBox { 
      width:90%; max-width:450px; margin:auto; padding:20px;
      background:#1b2538; border-radius:20px;
      box-shadow:0 15px 40px rgba(0,0,0,.6);
      animation: float 3s infinite ease-in-out;
    }

    @keyframes float {
      0% {transform:translateY(0);} 50%{transform:translateY(-8px);}100%{transform:translateY(0);}
    }

    .opt {
      display:block; width:100%; padding:14px; margin:8px 0;
      border:none; border-radius:10px; background:#243b55;
      font-size:16px; cursor:pointer; transition:.2s;
    }
    .opt:hover { background:#3b4b6a; }

    .correct { background:#22c55e!important; color:white; }
    .wrong { background:#e11d48!important; color:white; }

    #nextBtn {
      margin:20px auto; display:none;
      background:#3b82f6; padding:10px 20px; border:none;
      border-radius:10px; color:white; cursor:pointer;
    }

    #timer { font-size:18px; margin:10px; color:#38bdf8; font-weight:600; }

    .lang-ar { direction:rtl; text-align:right; }
    footer { margin:25px 0; opacity:.6; font-size:12px; }
  </style>
</head>

<body id="body">

<nav>
  <a href="index.html">🏠</a>
  <a href="chat.html">💬 Chat</a>
  <a href="history.html">📁 History</a>
  <a href="quiz.html" class="active">🎯 Quiz</a>
  <a href="scam.html">🛡 Detector</a>
  <a href="saeed.game.html">Saeeds Kids Game</a>
  <button id="langBtn">🇬🇧 EN</button>
</nav>

<h1 id="title">🎯 Cyber Safety Quiz</h1>
<p id="sub">10 questions • Kahoot style</p>

<div id="progressBar"><div id="progress"></div></div>
<div id="timer">15</div>

<div id="quizBox"></div>

<button id="nextBtn">Next ➜</button>

<div id="confetti"></div>

<footer>Created by Mariam — 2025</footer>
<script src="scripts/quiz.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.3.2/dist/confetti.browser.min.js"></script>
</body>
</html>
