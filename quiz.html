<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> Cyber Security Challenge - Test Your Self| By Mariam</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin:0;
      background:radial-gradient(circle at top, #0d1628, #020617);
      font-family:'Poppins',sans-serif;
      color:white;
      text-align:center;
    }

    nav {
      display:flex; gap:10px; align-items:center;
      padding:10px; background:#0b1220; border-bottom:1px solid #1e293b;
      position:sticky; top:0;
    }
    nav a {
      text-decoration:none;color:#d1d5db;padding:8px 14px;font-size:14px;
      border-radius:8px;
    }
    nav a.active {background:#1e293b;}

    #welcomeScreen {
      padding:60px 20px;
      display:flex;flex-direction:column;align-items:center;
    }
    #welcomeScreen img {
      width:150px;animation:float 3s infinite ease-in-out;
    }

    @keyframes float {
      0%{transform:translateY(0);}50%{transform:translateY(-8px);}100%{transform:translateY(0);}
    }

    #startBtn {
      margin-top:25px;
      background:linear-gradient(135deg,#22c55e,#06b6d4);
      color:#020617;font-weight:600;
      padding:14px 28px;border-radius:30px;
      font-size:18px;border:none;cursor:pointer;
      animation:pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}
    }

    #quizBox {
      display:none;
      margin:60px auto;
      width:90%;max-width:450px;
      background:#131f33;padding:28px;
      border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.6);
    }

    .opt {
      display:block;width:100%;padding:12px;margin:10px 0;
      background:#1e293b;border:none;border-radius:10px;
      color:white;font-size:16px;
      cursor:pointer;transition:.2s;
    }
    .opt:hover{background:#334155;}

    .correct{background:#22c55e!important;}
    .wrong{background:#e11d48!important;}

    #timer{font-size:18px;color:#38bdf8;font-weight:600;margin-bottom:10px;}
    #progressBar{height:8px;background:#1e293b;border-radius:4px;margin:12px 0;}
    #progress{height:8px;width:0;background:#22c55e;border-radius:4px;}

    #nextBtn {
      padding:10px 20px;background:#3b82f6;border:none;
      border-radius:10px;color:white;margin-top:12px;cursor:pointer;
      display:none;
    }

    #endScreen {
      display:none;margin-top:80px;
    }
  </style>
</head>

<body>

<nav>
  <a href="index.html">🏠</a>
  <a href="chat.html">💬</a>
  <a href="quiz.html" class="active">🎯</a>
  <a href="scam.html">🛡</a>
  <a href="saeed.game.html">🛡</a>
</nav>

<!-- ⭐ START PAGE ⭐ -->
<div id="welcomeScreen">
  <img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png">
  <h1>🎯 Cyber Security Challenge</h1>
  <p style="max-width:340px;opacity:.8;">
    Test your cyber safety skills with realistic scenarios used in the UAE 🚨  
  </p>
  <button id="startBtn">🚀 Start The Challenge</button>
</div>

<!-- ⭐ QUIZ PAGE ⭐ -->
<div id="quizBox">
  <h2 id="qText"></h2>
  <div id="timer"></div>
  <div id="progressBar"><div id="progress"></div></div>
  <div id="options"></div>
  <button id="nextBtn">Next ➜</button>
</div>

<!-- ⭐ END PAGE ⭐ -->
<div id="endScreen">
  <h2>🎉 Finished!</h2>
  <p id="scoreText"></p>
  <button onclick="location.reload()">🔁 Try Again</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti"></script>
<script src="scripts/quiz.js"></script>

</body>
</html>
