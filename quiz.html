<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cyber Quiz | Cyber Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: white;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #1f2937;
    }
    nav a {
      text-decoration: none;
      color: #e5e7eb;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 8px;
    }
    nav a.active, nav a:hover {
      background: #334155;
    }

    .lang-switch {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }
    .lang-switch button {
      background: #1e293b;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .lang-switch .active {
      background: #3b82f6;
    }

    #pageBody {
      max-width: 450px;
      margin: auto;
      padding: 24px 12px;
      text-align: center;
    }

    #progressBarFull {
      width: 100%;
      background: #1e293b;
      height: 6px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    #progress {
      width: 0%;
      height: 6px;
      background: linear-gradient(to right, #22c55e, #0ea5e9);
      border-radius: 4px;
      transition: width 0.4s;
    }

    .quiz-option {
      width: 100%;
      background: #1e293b;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      color: white;
      transition: 0.2s;
    }
    .quiz-option:hover { background: #334155; transform: scale(1.02); }
    .quiz-option.correct { background: #22c55e !important; }
    .quiz-option.wrong { background: #dc2626 !important; }

    #next {
      display: none;
      margin: 20px auto;
      background: #3b82f6;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    #timer {
      margin: 18px 0;
      font-size: 18px;
      font-weight: 600;
      color: #38bdf8;
    }

    #content h3 {
      font-size: 20px;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .lang-ar {
      direction: rtl;
      text-align: right;
    }

    footer {
      margin-top: 30px;
      opacity: 0.6;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">🏠 Home</a>
  <a href="chat.html">💬 Chat</a>
  <a href="history.html">📁 History</a>
  <a href="quiz.html" class="active">🎯 Quiz</a>
  <a href="scam.html">🛡 Scam Detector</a>
   <a href="saeed.game.html">Saeeds Kids Game </a>

  <div class="lang-switch">
    <button id="enBtn" class="active">EN 🇬🇧</button>
    <button id="arBtn">AR 🇦🇪</button>
  </div>
</nav>

<div id="pageBody">
  <h2 id="title">🎯 Cyber Safety Quiz</h2>
  <p id="subText">Quick questions • Test yourself</p>

  <div id="progressBarFull"><div id="progress"></div></div>

  <div id="timer">⏳ 10s</div>

  <div id="content"></div>
  <button id="next">Next ➜</button>
</div>

<footer>Created by Mariam – 2025</footer>

<!-- Link Script -->
<script src="scripts/quiz.js"></script>
</body>
</html>
