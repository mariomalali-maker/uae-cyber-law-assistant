<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>🎯 Cyber Security Quiz | Mariam</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet"/>
  <style>
    body{
      margin:0;background:radial-gradient(circle at top,#0e1628,#000);
      font-family:'Poppins',sans-serif;color:white;text-align:center;
    }
    nav{
      display:flex;gap:12px;padding:10px;background:#09101f;
      border-bottom:1px solid #1f2937;position:sticky;top:0;
    }
    nav a{color:#d1d5db;text-decoration:none;padding:6px 10px;border-radius:6px;font-size:14px;}
    nav a.active{background:#1f2937;}

    #welcome{padding:60px 20px;}
    #welcome img{width:150px;margin-bottom:20px;animation:float 3s infinite ease-in-out;}
    @keyframes float{0%{transform:translateY(0);}50%{transform:translateY(-10px);}100%{transform:translateY(0);}}

    .main-btn{
      background:linear-gradient(135deg,#22c55e,#06b6d4);
      border:none;padding:15px 30px;border-radius:40px;color:#001;font-weight:600;
      font-size:18px;margin:10px;cursor:pointer;animation:pulse 2s infinite;
    }
    @keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}

    #quiz{
      display:none;width:90%;max-width:450px;margin:40px auto;
      background:#142037;padding:25px;border-radius:18px;
      box-shadow:0 10px 40px rgba(0,0,0,.5);
      animation:float 3s infinite ease-in-out;
    }
    .opt{
      display:block;width:100%;padding:14px;margin:10px 0;border:none;
      background:#1e293b;border-radius:10px;color:white;font-size:16px;
      cursor:pointer;transition:.2s;
    }
    .opt:hover{background:#344256;}
    .correct{background:#22c55e!important;color:#000!important;}
    .wrong{background:#b91c1c!important;}

    #timer{font-weight:600;font-size:18px;color:#38bdf8;margin-bottom:10px;}
    #progressBar{width:100%;height:8px;background:#1e293b;border-radius:4px;}
    #progress{width:0;height:8px;background:#22c55e;border-radius:4px;transition:0.4s;}

    #next{display:none;margin-top:12px;background:#3b82f6;border:none;color:white;padding:10px 20px;border-radius:10px;cursor:pointer;}
    #end{display:none;margin:70px auto;}
    footer{margin:40px 0;opacity:.6;font-size:12px;}
  </style>
</head>

<body>

<nav>
<a href="index.html">🏠 Home</a>
<a href="chat.html">💬 Chat</a>
<a href="history.html">📁 History</a>
<a href="quiz.html">🧠 Cyber Quiz</a>
<a href="scam.html">⚠️ Scam Detector</a>
<a href="saeed.game.html" class="active">🎮 Saeed's Game</a>
</nav>

<div id="welcome">
  <img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png"/>
  <h1 id="w-title">🎯 Cyber Security Quiz</h1>
  <p id="w-desc">Test your cyber safety awareness with real UAE situations.</p>

  <h3>Choose Language / اختار اللغة</h3>
  <button class="main-btn" onclick="setLang('EN')">🇬🇧 English</button>
  <button class="main-btn" onclick="setLang('AR')">🇦🇪 العربية</button>

  <button id="startBtn" class="main-btn" style="display:none;">🚀 Start</button>
</div>

<div id="quiz">
  <h2 id="q"></h2>
  <div id="timer">⏳ 15s</div>
  <div id="progressBar"><div id="progress"></div></div>
  <div id="options"></div>
  <button id="next">Next ➜</button>
</div>

<div id="end">
  <h2 id="endHead"></h2>
  <h3 id="score"></h3>
  <button class="main-btn" onclick="location.reload()">🔁 Restart</button>
</div>

<footer>Created by Mariam — 2025</footer>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti"></script>
<script src="scripts/quiz.js"></script>
</body>
</html>
