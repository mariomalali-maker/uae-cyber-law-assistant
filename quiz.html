<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #16213e 50%, #0f0f23 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Welcome Screen */
        #welcome-screen {
            text-align: center;
            animation: fadeIn 1s ease-in;
        }

        .game-title {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(45deg, #a855f7, #ec4899, #a855f7);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradient 3s ease infinite;
            margin-bottom: 10px;
        }

        .game-subtitle {
            font-size: 1.2rem;
            color: #a78bfa;
            margin-bottom: 40px;
        }

        .arabic-text {
            font-family: 'Arial', sans-serif;
            direction: rtl;
            font-size: 1.5rem;
            color: #c4b5fd;
            margin-bottom: 20px;
        }

        .input-container {
            margin: 30px 0;
        }

        #player-name {
            padding: 15px 25px;
            font-size: 1.2rem;
            border: 3px solid #a855f7;
            border-radius: 50px;
            background: rgba(168, 85, 247, 0.1);
            color: #fff;
            text-align: center;
            width: 300px;
            outline: none;
            transition: all 0.3s ease;
        }

        #player-name:focus {
            border-color: #ec4899;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
            transform: scale(1.05);
        }

        .start-btn {
            padding: 15px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #a855f7, #ec4899);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4);
            margin-top: 20px;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.6);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        /* Countdown Screen */
        #countdown-screen {
            display: none;
            text-align: center;
        }

        .countdown-number {
            font-size: 15rem;
            font-weight: bold;
            color: #ec4899;
            animation: pulse 1s ease-in-out;
            text-shadow: 0 0 50px rgba(236, 72, 153, 0.8);
        }

        .go-text {
            font-size: 10rem;
            color: #a855f7;
            animation: scaleIn 0.5s ease-out;
        }

        /* Quiz Screen */
        #quiz-screen {
            display: none;
            width: 100%;
            max-width: 900px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px 25px;
            background: rgba(168, 85, 247, 0.1);
            border-radius: 15px;
            border: 2px solid rgba(168, 85, 247, 0.3);
        }

        .timer-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timer-bar {
            width: 150px;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            overflow: hidden;
        }

        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            transition: width 0.1s linear;
        }

        .timer-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ec4899;
            min-width: 50px;
        }

        .question-counter {
            font-size: 1.2rem;
            color: #c4b5fd;
        }

        .question-card {
            background: rgba(168, 85, 247, 0.15);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px solid rgba(168, 85, 247, 0.3);
            animation: slideIn 0.5s ease-out;
        }

        .question-text {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .question-arabic {
            font-family: 'Arial', sans-serif;
            direction: rtl;
            font-size: 1.3rem;
            color: #c4b5fd;
            margin-top: 15px;
            line-height: 1.8;
        }

        .answers-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .answer-card {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(236, 72, 153, 0.1));
            border: 3px solid rgba(168, 85, 247, 0.4);
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            animation: fadeInUp 0.5s ease-out;
        }

        .answer-card:hover {
            transform: translateY(-5px);
            border-color: #ec4899;
            box-shadow: 0 10px 30px rgba(168, 85, 247, 0.4);
        }

        .answer-card.correct {
            background: linear-gradient(135deg, #10b981, #059669);
            border-color: #10b981;
            transform: scale(1.02);
        }

        .answer-card.wrong {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-color: #ef4444;
            transform: scale(1.02);
        }

        .answer-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .answer-text {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .answer-arabic {
            font-family: 'Arial', sans-serif;
            direction: rtl;
            font-size: 1rem;
            color: #c4b5fd;
        }

            text-align: center;
            animation: fadeIn 1s ease-in;
        }

        .score-display {

            font-weight: bold;
            color: #a855f7;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.8);
            margin: 30px 0;
        }

        .score-label {
            font-size: 1.5rem;
            color: #c4b5fd;
        }

        .result-message {
            font-size: 1.5rem;
            margin: 20px 0;
            color: #ffffff;
        }

        /* Leaderboard */
        .leaderboard {

            border: 2px solid rgba(168, 85, 247, 0.3);

            color: #a855f7;

        }

        .player-name {
            font-size: 1.1rem;
            color: #ffffff;
        }

        .player-score {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ec4899;
        }

        .play-again-btn {
            margin-top: 30px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes gradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

                width: 120px;
            }

            .timer-text {
                font-size: 1.2rem;
            }

            .score-display {
                font-size: 3rem;
            }

            .leaderboard {
                padding: 20px;
            }

            .leaderboard-title {
                font-size: 1.5rem;
            }

            .leaderboard-entry {
                padding: 12px 15px;
            }
        }

            .container {
                padding: 15px;
            }

            .game-title {
                font-size: 1.5rem;
            }

            .question-card {
                padding: 15px;
            }

            .question-text {
                font-size: 1rem;
            }

            .question-arabic {
                font-size: 0.9rem;
            }

            .answer-text {
                font-size: 1rem;
            }

            .answer-arabic {
                font-size: 0.85rem;
            }

            .answer-card {
                padding: 15px;
            }
        }

        /* RTL Support */
        [dir="rtl"] .answers-container {
            direction: rtl;
        }

        [dir="rtl"] .question-arabic {
            direction: rtl;
        }
    </style>

// DOM Elements

// Initialize DOM elements when DOM is loaded
function initializeDOM() {
    welcomeScreen = document.getElementById('welcome-screen');

// Start Game Function
function startGame() {
    playerName = playerNameInput.value.trim();
    
    if (!playerName) {
        playerNameInput.style.borderColor = '#ef4444';
        playerNameInput.placeholder = 'Please enter your name / الرجاء إدخال اسمك';
        return;
    }
    
    playerNameInput.style.borderColor = '#a855f7';
    showCountdown();
}

// Show Countdown Function
function showCountdown() {
    welcomeScreen.style.display = 'none';
    countdownScreen.style.display = 'block';
    
    let count = 3;
    countdownDisplay.textContent = count;
    countdownDisplay.className = 'countdown-number';
    
    const countdownInterval = setInterval(() => {
        count--;
        
        if (count > 0) {
            countdownDisplay.textContent = count;
            countdownDisplay.style.animation = 'none';
            countdownDisplay.offsetHeight; // Trigger reflow
            countdownDisplay.style.animation = 'pulse 1s ease-in-out';
        } else if (count === 0) {
            countdownDisplay.textContent = 'GO!';
            countdownDisplay.className = 'go-text';
        } else {
            clearInterval(countdownInterval);
            countdownScreen.style.display = 'none';
            quizScreen.style.display = 'block';
            currentQuestion = 0;
            score = 0;
            showQuestion();
        }
    }, 1000);
}

        return;
    }
    
    const question = questions[currentQuestion];
    
    // Update question counter
    currentQuestionSpan.textContent = currentQuestion + 1;
    
    // Display question
    questionText.textContent = question.question;
    questionArabic.textContent = question.arabicQuestion;
    
    // Generate answers
    answersContainer.innerHTML = '';
    
    question.answers.forEach((answer, index) => {
        const answerCard = document.createElement('div');
        answerCard.className = 'answer-card';
        answerCard.style.animationDelay = `${index * 0.1}s`;
        
        answerCard.innerHTML = `
            <p class="answer-text">${answer.text}</p>
            <p class="answer-arabic">${answer.arabic}</p>
        `;
        
        answerCard.addEventListener('click', () => selectAnswer(index));
        answersContainer.appendChild(answerCard);
    });
    
    // Start timer
    startTimer();
}

// Timer Function
function startTimer() {
    timeLeft = 15;
    updateTimerDisplay();
    
    timer = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        
        if (timeLeft <= 0) {
            clearInterval(timer);
            timeUp();
        }
    }, 1000);
}

// Update Timer Display
function updateTimerDisplay() {
    timerText.textContent = timeLeft;
    const percentage = (timeLeft / 15) * 100;
    timerFill.style.width = percentage + '%';
    
    // Change color as time runs out
    if (timeLeft <= 5) {
        timerFill.style.background = 'linear-gradient(90deg, #ef4444, #dc2626)';
        timerText.style.color = '#ef4444';
    } else {
        timerFill.style.background = 'linear-gradient(90deg, #a855f7, #ec4899)';
        timerText.style.color = '#ec4899';
    }
}

// Time Up Function
function timeUp() {
    const answerCards = answersContainer.querySelectorAll('.answer-card');
    const correctAnswer = questions[currentQuestion].correct;
    
    // Show correct answer
    answerCards.forEach((card, index) => {
        card.classList.add('disabled');
        if (index === correctAnswer) {
            card.classList.add('correct');
        }
    });
    
    // Move to next question after delay
    setTimeout(() => {
        currentQuestion++;
        showQuestion();
    }, 2000);
}

// Select Answer Function
function selectAnswer(selectedIndex) {
    clearInterval(timer);
    
    const answerCards = answersContainer.querySelectorAll('.answer-card');
    const correctAnswer = questions[currentQuestion].correct;
    
    // Disable all cards
    answerCards.forEach(card => card.classList.add('disabled'));
    
    // Show correct/wrong
    if (selectedIndex === correctAnswer) {
        answerCards[selectedIndex].classList.add('correct');
        // Calculate score based on time remaining (max 1000 points)
        const points = Math.round((timeLeft / 15) * 1000);
        score += points;
    } else {
        answerCards[selectedIndex].classList.add('wrong');
        answerCards[correctAnswer].classList.add('correct');
    }
    
    // Move to next question after delay
    setTimeout(() => {
        currentQuestion++;
        showQuestion();
    }, 2000);
}

// End Game Function
function endGame() {
    quizScreen.style.display = 'none';
    resultScreen.style.display = 'block';
    
    // Display score
    finalScore.textContent = score;
    
    // Generate result message
    let message = '';
    if (score >= 12000) {
        message = "Excellent! You're a Cyber Security Expert! 🎉";
    } else if (score >= 9000) {
        message = "Great job! You know your cyber security well! 👏";
    } else if (score >= 6000) {
        message = "Good effort! Keep learning! 💪";
    } else {
        message = "Keep practicing! Cyber security is important! 📚";
    }
    resultMessage.textContent = message;
    
    // Update leaderboard
    updateLeaderboard();
}

// Update Leaderboard Function
function updateLeaderboard() {
    // Add current player to leaderboard
    leaderboard.push({
        name: playerName,
        score: score,
        isCurrent: true
    });
    
    // Sort by score (highest first)
    leaderboard.sort((a, b) => b.score - a.score);
    
    // Keep only top 10
    leaderboard = leaderboard.slice(0, 10);
    
    // Save to localStorage
    localStorage.setItem('cyberQuizLeaderboard', JSON.stringify(leaderboard));
    
    // Display leaderboard
    displayLeaderboard();
}

// Display Leaderboard Function
function displayLeaderboard() {
    if (!leaderboardEntries) {
        initializeDOM();
    }
    
    if (!leaderboardEntries) return;
    
    leaderboardEntries.innerHTML = '';
    
    leaderboard.forEach((entry, index) => {
        const entryDiv = document.createElement('div');
        entryDiv.className = `leaderboard-entry ${entry.isCurrent ? 'current-player' : ''}`;
        
        // Add rank emoji
        let rankEmoji = '';
        if (index === 0) rankEmoji = '🥇 ';
        else if (index === 1) rankEmoji = '🥈 ';
        else if (index === 2) rankEmoji = '🥉 ';
        else rankEmoji = `${index + 1}. `;
        
        entryDiv.innerHTML = `
            <span class="player-name">${rankEmoji}${entry.name}</span>
            <span class="player-score">${entry.score}</span>
        `;
        
        leaderboardEntries.appendChild(entryDiv);
    });
}

// Load Leaderboard Function
function loadLeaderboard() {
    const saved = localStorage.getItem('cyberQuizLeaderboard');
    if (saved) {
        leaderboard = JSON.parse(saved);
    }
}

// Restart Game Function
function restartGame() {
    resultScreen.style.display = 'none';
    welcomeScreen.style.display = 'block';
    playerNameInput.value = '';
    playerNameInput.style.borderColor = '#a855f7';
    playerNameInput.placeholder = 'Enter your name / أدخل اسمك';
}

// Make functions globally accessible
window.startGame = startGame;
window.restartGame = restartGame;

// Initialize
loadLeaderboard();
displayLeaderboard();

// Handle Enter key on name input
document.addEventListener('DOMContentLoaded', function() {
    initializeDOM();
    
    if (playerNameInput) {
        playerNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                startGame();
            }
        });
    }
});
    </script>
