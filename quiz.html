<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎯 Cyber Security Quiz | Mariam</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti"></script>

<style>
body{
  margin:0;background:radial-gradient(circle at top,#0B1221,#000);
  color:white;font-family:'Poppins',sans-serif;text-align:center;
}
nav{display:flex;gap:10px;padding:10px;background:#09101f;position:sticky;top:0;}
nav a{text-decoration:none;color:#d1d5db;padding:6px 10px;border-radius:8px;font-size:14px;}
nav a.active{background:#1e293b;color:white;}

#home{padding:60px;}
#home h1{font-size:42px;margin-bottom:10px;}
#home p{opacity:.8;font-size:18px;margin-bottom:30px;}

.btn{
  background:linear-gradient(135deg,#22c55e,#0ea5e9);
  border:none;color:#001;padding:15px 30px;border-radius:40px;
  cursor:pointer;font-weight:700;font-size:18px;
  transition:0.2s;margin:10px;
}
.btn:hover{transform:scale(1.05);}

.quiz-box{
  width:90%;max-width:550px;margin:40px auto;
  background:#142037;padding:30px;border-radius:20px;
  animation:float 3s infinite ease-in-out;
}
@keyframes float{0%{transform:translateY(0);}50%{transform:translateY(-8px);}100%{transform:translateY(0);}}

#timer{font-size:20px;color:#60a5fa;margin-bottom:8px;}
#progressBar{width:100%;height:8px;background:#1e293b;border-radius:10px;}
#progress{height:8px;width:0%;background:#22c55e;border-radius:10px;transition:0.4s;}

.opt{
  display:block;width:100%;border:none;color:white;
  background:#1e293b;padding:14px;border-radius:12px;
  margin:10px 0;cursor:pointer;font-size:17px;
  transition:0.2s;
}
.opt:hover{background:#334155;}
.correct{background:#22c55e!important;color:#000!important;}
.wrong{background:#b91c1c!important;}

#end{display:none;margin-top:80px;}
#end h2{font-size:38px;margin-bottom:0;}
#end h3{font-size:24px;margin:10px 0 30px;}
footer{margin:40px 0;opacity:.5;}
</style>
</head>

<body>

<nav>
<a href="index.html">🏠 Home</a>
<a href="chat.html">💬 Chat</a>
<a href="history.html">📁 History</a>
<a href="quiz.html" class="active">🧠 Quiz</a>
<a href="scam.html">⚠️ Detector</a>
<a href="saeed.game.html">🎮 Saeed's Game</a>
</nav>

<!-- HOME -->
<section id="home">
<h1>🎯 Cyber Security Quiz</h1>
<p>Protect yourself with real UAE cyber safety scenarios.</p>
<h3>Language / اللغة</h3>
<button class="btn" onclick="setLang('EN')">🇬🇧 English</button>
<button class="btn" onclick="setLang('AR')">🇦🇪 العربية</button>
<br>
<button class="btn" id="startBtn" style="display:none;" onclick="startGame()">🚀 Start</button>
</section>

<!-- QUIZ -->
<section id="quiz" style="display:none;">
<div class="quiz-box">
<h2 id="question"></h2>
<div id="timer">⏳ 15s</div>
<div id="progressBar"><div id="progress"></div></div>
<div id="options"></div>
<button class="btn" id="nextBtn" style="display:none;" onclick="nextQ()">Next ➜</button>
</div>
</section>

<!-- END -->
<section id="end">
<h2 id="endTitle"></h2>
<h3 id="endScore"></h3>
<button class="btn" onclick="location.reload()">🔁 Play Again</button>
</section>

<footer>Created by Mariam — 2025</footer>
<script src="scripts/quiz.js"></script>

</body>
</html>
