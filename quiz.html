<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Cyber Security | Test yourself</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
background:linear-gradient(135deg,#1a0a2e 0%,#16213e 50%,#0f0f23 100%);
min-height:100vh;
color:#ffffff;
overflow-x:hidden
}

.container{
max-width:1200px;
margin:0 auto;
padding:20px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center
}

#countdown-screen{display:none}
#quiz-screen{display:none}
#result-screen{display:none}

.answer-card{
border:3px solid rgba(168,85,247,0.4);
border-radius:15px;
padding:25px;
cursor:pointer;
transition:0.3s;
text-align:center;
margin:10px
}

.answer-card:hover{
transform:translateY(-5px);
border-color:#ec4899
}

.answer-card.disabled{
pointer-events:none;
opacity:0.5
}

</style>

</head>

<body>

<div class="container">

<!-- Welcome Screen -->
<div id="welcome-screen">
<input type="text" id="player-name" placeholder="Enter your name" maxlength="20">

<!-- BUTTON KEPT SAME -->
<button class="start-btn" onclick="startGame()">START GAME</button>
</div>


<!-- Countdown Screen -->
<div id="countdown-screen">
<div id="countdown-display" class="countdown-number">3</div>
</div>


<!-- Quiz Screen -->
<div id="quiz-screen">
<div class="question-card">
<p id="question-text"></p>
<p id="question-arabic"></p>
</div>

<div class="answers-container" id="answers-container"></div>

<div class="timer-container">
<span id="timer-text">15</span>
<div class="timer-bar">
<div id="timer-fill"></div>
</div>
</div>
</div>


<!-- Result Screen -->
<div id="result-screen">
<h2>Game Complete!</h2>

<p id="final-score">0</p>
<p id="result-message"></p>

<!-- ADDED ONLY THIS ID – WAS MISSING -->
<div id="leaderboard-entries"></div>

<button onclick="restartGame()">PLAY AGAIN</button>
</div>

</div>


<!-- ONLY ONE SCRIPT – ROOT -->
<script src="quiz.js"></script>

</body>
</html>
