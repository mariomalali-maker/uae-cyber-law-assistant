<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎯 Cyber Quiz | Cyber Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#0e101e,#111827 30%,#020617);
    color:white;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow-x:hidden;
  }

  /* NAV */
  .top-nav{
    display:flex;gap:14px;
    background:#0f172a;
    padding:12px 20px;
    border-bottom:1px solid #1e293b;
  }
  .top-nav a{
    text-decoration:none;
    color:#cbd5e1;
    padding:6px 14px;
    border-radius:8px;
    font-size:14px;
    transition:0.2s;
  }
  .top-nav a.active,
  .top-nav a:hover{
    background:#334155;
    color:white;
  }

  /* MAIN QUIZ AREA */
  .quiz-wrap{
    flex:1;
    display:flex;
    padding:30px 10px;
    justify-content:center;
  }
  .quiz-card{
    width:100%;
    max-width:600px;
    background:#1e293b;
    padding:30px;
    border-radius:20px;
    box-shadow:0 8px 40px rgba(0,0,0,0.5);
    animation: rise 0.5s ease;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
  }

  h2{
    text-align:center;
    font-weight:700;
    margin-bottom:14px;
  }

  /* PROGRESS BAR */
  .progress{
    height:10px;
    background:#334155;
    border-radius:50px;
    margin-bottom:20px;
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#06b6d4,#22c55e);
    border-radius:50px;
    transition:0.4s;
  }

  /* ANSWER BUTTONS */
  .quiz-option{
    display:block;
    width:100%;
    padding:14px;
    margin:8px 0;
    background:#273449;
    border:none;
    border-radius:14px;
    font-size:15px;
    cursor:pointer;
    transition:0.25s;
  }
  .quiz-option:hover{
    background:#3a4a63;
    transform:scale(1.01);
  }
  .quiz-option.correct{background:#16a34a;}
  .quiz-option.wrong{background:#dc2626;}

  /* TIMER */
  #timer{
    font-size:18px;
    text-align:center;
    font-weight:600;
    margin:10px 0;
  }

  /* FOOTER */
  footer{
    text-align:center;
    font-size:13px;
    opacity:0.6;
    padding:15px;
  }

  /* CONFETTI */
  #confetti{
    position:fixed;top:0;left:0;
    width:100%;height:100%;
    pointer-events:none;
    display:none;
  }
</style>
</head>

<body>

<nav class="top-nav">
  <a href="index.html">🏠 Home</a>
  <a href="chat.html">💬 Chat</a>
  <a href="history.html">📁 History</a>
  <a href="quiz.html" class="active">🎯 Cyber Quiz</a>
  <a href="scam.html">🛡 Scam Detector</a>
   <a href="saeed.game.html">Saeeds Kids Game</a>
</nav>

<canvas id="confetti"></canvas>

<div class="quiz-wrap">
  <div class="quiz-card" id="quiz-card">
    <h2>🎯 Cyber Safety Quiz</h2>
    <div class="progress"><div class="progress-bar" id="progress"></div></div>
    <p id="timer">Time Left: <strong>10</strong>s</p>
    <div id="content"></div>
    <button id="next" style="display:none;margin-top:15px;">Next ➜</button>
  </div>
</div>

<footer>Created by Mariam – 2025</footer>

<script src="scripts/quiz.js"></script>

</body>
</html>
