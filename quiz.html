<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>🎯 Cyber Security Kahoot | Mariam</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet"/>

<style>
body{
  margin:0;background:linear-gradient(135deg,#0e1628,#000);
  font-family:'Poppins',sans-serif;color:white;text-align:center;
}

/* NAV */
nav{display:flex;gap:12px;padding:10px;background:#09101f;border-bottom:1px solid #1f2937;position:sticky;top:0;}
nav a{color:#d1d5db;text-decoration:none;padding:6px 10px;border-radius:6px;font-size:14px;}
nav a.active{background:#1f2937;}

/* WELCOME */
#welcome{padding:60px 20px;}
#welcome img{width:150px;margin-bottom:20px;animation:float 3s infinite ease-in-out;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

/* BUTTON */
.main-btn{
  background:linear-gradient(135deg,#22c55e,#06b6d4);
  border:none;padding:15px 30px;border-radius:40px;color:#001;
  font-weight:600;font-size:18px;margin:10px;cursor:pointer;
  animation:pulse 2s infinite;transition:0.3s;
}
.main-btn:hover{transform:scale(1.08);}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}

/* QUIZ */
#quiz{display:none;width:90%;max-width:500px;margin:40px auto;background:#142037;padding:25px;border-radius:18px;}
.opt{
  display:block;width:100%;padding:16px;margin:12px 0;border:none;font-size:17px;
  border-radius:12px;cursor:pointer;transition:0.15s;
  background:#1e293b;color:white;
}
.opt:hover{transform:scale(1.03);}

/* RESULT COLORS */
.correct{background:#22c55e!important;color:#000!important;animation:jump 0.4s;}
.wrong{background:#b91c1c!important;animation:shake 0.3s;}
@keyframes shake{0%,100%{transform:translateX(0);}50%{transform:translateX(-6px);}}
@keyframes jump{0%{transform:scale(1);}50%{transform:scale(1.15);}100%{transform:scale(1);}}

/* TIMER */
#timer{font-size:20px;margin-bottom:8px;color:#38bdf8;font-weight:600;}
.timerLow{color:#ff4444;animation:shake 0.3s infinite;}

/* BAR */
#progressBar{width:100%;height:8px;background:#1e293b;border-radius:5px;margin-bottom:12px;}
#progress{height:8px;width:0;background:#22c55e;border-radius:5px;transition:0.4s;}

/* END SCREEN */
#end{display:none;padding:40px 20px;}
#end h1{font-size:40px;margin-bottom:10px;}
.legend{color:#22c55e;text-shadow:0 0 12px #22c55e;}
.tryagain{color:#fbbf24;}

</style>
</head>

<body>

<nav>
<a href="index.html">🏠 Home</a>
<a href="chat.html">💬 Chat</a>
<a href="history.html">📁 History</a>
<a href="quiz.html">🧠 Cyber Quiz</a>
<a href="detector.html">⚠️ Detector</a>
<a class="active">🎮 Saeed's Game</a>
</nav>

<div id="welcome">
  <img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png"/>
  <h1 id="w-title">🎯 Cyber Security Quiz</h1>
  <p id="w-desc">Real UAE scenarios to protect yourself.</p>

  <h3>Choose Language / اختار اللغة</h3>
  <button class="main-btn" onclick="setLang('EN')">🇬🇧 English</button>
  <button class="main-btn" onclick="setLang('AR')">🇦🇪 العربية</button>

  <button id="startBtn" class="main-btn" style="display:none;">🚀 Start</button>
</div>

<div id="quiz">
  <h2 id="q"></h2>
  <div id="timer">⏳ 15s</div>
  <div id="progressBar"><div id="progress"></div></div>
  <div id="options"></div>
  <button id="next" class="main-btn" style="display:none;">Next ➜</button>
</div>

<div id="end">
  <h1 id="resultTitle"></h1>
  <h2 id="score"></h2>
  <button class="main-btn" onclick="location.reload()">🔁 Play Again</button>
</div>

<footer style="margin:40px 0;opacity:.6;">Created by Mariam — 2025</footer>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti"></script>
<script src="scripts/quiz.js?v=100"></script>
</body>
</html>
