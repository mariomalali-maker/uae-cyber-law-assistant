<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 Cyber Security Quiz | Kahoot Style</title>


<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --kahoot-red: #e21b3c;
    --kahoot-blue: #1368ce;
    --kahoot-yellow: #d89e00;
    --kahoot-green: #26890c;
    --dark-bg: #1a1a2e;
    --card-bg: #16213e;
    --text-primary: #ffffff;
    --text-secondary: #a0a0a0;
    --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
}

.screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
}

.hidden {
    display: none !important;
}

/* START SCREEN STYLES */
.logo-container {
    text-align: center;
    margin-bottom: 40px;
}

.pulse-logo {
    font-size: 80px;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

.title {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 20px;
    text-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
}

.gradient-text {
    background: var(--gradient-1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.language-selector {
    margin-bottom: 30px;
}

.language-selector h3 {
    font-size: 1.2rem;
    margin-bottom: 20px;
    color: var(--text-secondary);
}

.lang-buttons {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
}

.lang-btn {
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 15px;
    padding: 20px 30px;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    backdrop-filter: blur(10px);
}

.lang-btn:hover {
    transform: translateY(-5px);
    background: rgba(255, 255, 255, 0.15);
    box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
}

.flag {
    font-size: 3rem;
}

.lang-name {
    font-weight: 600;
    font-size: 1rem;
}

.start-container {
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.5s ease;
}

.start-container.visible {
    opacity: 1;
    transform: translateY(0);
}

.player-info input {
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 25px;
    padding: 15px 25px;
    font-size: 1.1rem;
    color: white;
    text-align: center;
    width: 300px;
    outline: none;
    transition: all 0.3s ease;
}

.player-info input:focus {
    border-color: #667eea;
    box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
}

.player-info input::placeholder {
    color: rgba(255, 255, 255, 0.5);
}

.btn-start {
    background: var(--gradient-1);
    border: none;
    border-radius: 50px;
    padding: 20px 60px;
    font-size: 1.3rem;
    font-weight: 700;
    color: white;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    margin-top: 20px;
    box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
}

.btn-start:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
}

.btn-shine {
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    animation: shine 2s infinite;
}

@keyframes shine {
    0% { left: -100%; }
    50%, 100% { left: 100%; }
}

/* COUNTDOWN SCREEN */
.countdown-container {
    text-align: center;
}

.countdown-number {
    font-size: 12rem;
    font-weight: 900;
    background: var(--gradient-1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: countPulse 1s ease-in-out;
}

@keyframes countPulse {
    0% { transform: scale(1.5); opacity: 0; }
    50% { transform: scale(0.9); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
}

.countdown-text {
    font-size: 2rem;
    font-weight: 700;
    color: var(--text-secondary);
    margin-top: 20px;
}

/* QUIZ SCREEN */
.quiz-header {
    width: 100%;
    max-width: 800px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.question-counter {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text-secondary);
}

.question-counter span:first-child {
    color: #667eea;
}

.score-display {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.5rem;
    font-weight: 700;
}

.score-icon {
    animation: starSpin 2s infinite linear;
}

@keyframes starSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.timer-bar {
    width: 100%;
    max-width: 800px;
    height: 8px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
    margin-bottom: 30px;
    overflow: hidden;
}

.timer-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea, #764ba2);
    border-radius: 4px;
    transition: width 1s linear;
}

.timer-fill.warning {
    background: linear-gradient(90deg, #f093fb, #f5576c);
}

.timer-fill.danger {
    background: linear-gradient(90deg, #ff6b6b, #ee5a24);
    animation: timerPulse 0.5s infinite;
}

@keyframes timerPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.question-box {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    padding: 40px;
    margin-bottom: 30px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    animation: slideIn 0.5s ease-out;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.question-box h2 {
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    font-weight: 600;
    line-height: 1.6;
}

.options-container {
    width: 100%;
    max-width: 800px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.option-btn {
    background: rgba(255, 255, 255, 0.1);
    border: none;
    border-radius: 15px;
    padding: 25px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 15px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    text-align: left;
}

.option-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 100%);
    opacity: 0;
    transition: opacity 0.3s ease;
}

.option-btn:hover::before {
    opacity: 1;
}

.option-btn:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

.option-key {
    font-size: 2rem;
    font-weight: 900;
    min-width: 50px;
    opacity: 0.7;
}

.option-text {
    font-size: 1rem;
    font-weight: 500;
    flex: 1;
    word-wrap: break-word;
}

/* Option Colors */
.option-btn[data-option="0"]:hover { background: var(--kahoot-red); }
.option-btn[data-option="1"]:hover { background: var(--kahoot-blue); }
.option-btn[data-option="2"]:hover { background: var(--kahoot-yellow); }
.option-btn[data-option="3"]:hover { background: var(--kahoot-green); }

.option-btn.correct {
    background: var(--kahoot-green) !important;
    animation: correctPulse 0.5s ease;
}

.option-btn.wrong {
    background: var(--kahoot-red) !important;
    animation: shake 0.5s ease;
}

@keyframes correctPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
}

/* FEEDBACK OVERLAY */
.feedback-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.feedback-content {
    text-align: center;
    animation: scaleIn 0.5s ease;
}

@keyframes scaleIn {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.feedback-icon {
    font-size: 8rem;
    margin-bottom: 20px;
}

.feedback-text {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 15px;
}

.feedback-points {
    font-size: 3rem;
    font-weight: 900;
    background: var(--gradient-1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

/* RESULTS SCREEN */
.results-container {
    text-align: center;
    max-width: 600px;
}

.results-title {
    margin-bottom: 40px;
}

.result-emoji {
    font-size: 6rem;
    margin-bottom: 20px;
    animation: bounce 1s infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
}

.results-title h2 {
    font-size: 2.5rem;
    font-weight: 900;
    background: var(--gradient-1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.score-circle {
    position: relative;
    width: 250px;
    height: 250px;
    margin: 0 auto 40px;
}

.progress-ring {
    transform: rotate(-90deg);
}

.progress-ring-bg {
    fill: none;
    stroke: rgba(255, 255, 255, 0.1);
    stroke-width: 12;
}

.progress-ring-fill {
    fill: none;
    stroke: url(#gradient);
    stroke-width: 12;
    stroke-linecap: round;
    stroke-dasharray: 565.48;
    stroke-dashoffset: 565.48;
    transition: stroke-dashoffset 1.5s ease;
}

.progress-ring-fill.animate {
    stroke-dashoffset: var(--offset);
}

.score-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 3rem;
    font-weight: 900;
}

.score-divider {
    font-size: 2rem;
    opacity: 0.5;
}

.player-result {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 30px;
}

.result-label {
    font-size: 0.9rem;
    color: var(--text-secondary);
    margin-bottom: 5px;
}

.result-name {
    font-size: 1.5rem;
    font-weight: 700;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 40px;
}

.stat-item {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 15px;
    padding: 20px;
}

.stat-value {
    font-size: 2rem;
    font-weight: 900;
    background: var(--gradient-1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.stat-label {
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-top: 5px;
}

.result-actions {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
}

.btn-play, .btn-home {
    border: none;
    border-radius: 50px;
    padding: 15px 40px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: all 0.3s ease;
}

.btn-play {
    background: var(--gradient-1);
    color: white;
}

.btn-home {
    background: rgba(255, 255, 255, 0.1);
    color: white;
    border: 2px solid rgba(255, 255, 255, 0.2);
}

.btn-play:hover, .btn-home:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
}

.btn-icon {
    font-size: 1.3rem;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .options-container {
        grid-template-columns: 1fr;
    }
    
    .title {
        font-size: 2rem;
    }
    
    .question-box {
        padding: 25px;
    }
    
    .stats-grid {
        grid-template-columns: 1fr;
    }
    
    .countdown-number {
        font-size: 8rem;
    }
    
    .score-circle {
        width: 200px;
        height: 200px;
    }
    
    .score-text {
        font-size: 2.5rem;
    }
}

/* RTL Support */
body.rtl {
    direction: rtl;
}

body.rtl .option-btn {
    text-align: right;
}

body.rtl .option-btn .option-key {
    margin-left: auto;
}

/* Confetti Canvas */
#confetti-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9999;
}

body {
    margin:0;
    font-family:'Poppins', sans-serif;
    background:#0c0f19;
}

.screen.hidden {
    display:none;
}

.rtl {
    direction:rtl;
    text-align:right;
}

.option-btn.correct {
    background:#22c55e;
}

.option-btn.wrong {
    background:#e21b3c;
}

.timer-fill.danger {
    background:#e21b3c;
}

.timer-fill.warning {
    background:#f59e0b;
}

.feedback-overlay.hidden {
    display:none;
}

/* hide any injected canvas */
canvas {
    display:none;
}

</style>
</head>

<body>

<div id="startScreen" class="screen">
    <input type="text" id="playerName" maxlength="15">
    <button onclick="startGame()">START</button>
</div>

<div id="countdownScreen" class="screen hidden">
    <div id="countdownNumber">3</div>
    <div id="countdownText">GET READY!</div>
</div>

<div id="quizScreen" class="screen hidden">
    <span id="currentScore">0</span>
    <h2 id="questionText"></h2>

    <button class="option-btn" onclick="selectAnswer(0)">
        <span class="option-text"></span>
    </button>

    <button class="option-btn" onclick="selectAnswer(1)">
        <span class="option-text"></span>
    </button>

    <button class="option-btn" onclick="selectAnswer(2)">
        <span class="option-text"></span>
    </button>

    <button class="option-btn" onclick="selectAnswer(3)">
        <span class="option-text"></span>
    </button>
</div>

<div id="resultsScreen" class="screen hidden">
    <span id="playerNameDisplay">Anonymous</span>
</div>

<script src="quiz.js"></script>

</body>
</html>
