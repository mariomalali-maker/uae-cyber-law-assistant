<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Security | Test yourself</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #1a0a2e 0%, #16213e 50%, #0f0f23 100%);
  min-height: 100vh;
  color: #ffffff;
  overflow-x: hidden;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

#countdown-screen { display: none; }
#quiz-screen { display: none; }
#result-screen { display: none; }

.answer-card {
  border: 3px solid rgba(168,85,247,0.4);
  border-radius: 15px;
  padding: 25px;
  cursor: pointer;
  transition: all 0.3s ease;
  text-align: center;
  margin: 10px;
}

.answer-card:hover {
  transform: translateY(-5px);
  border-color: #ec4899;
}

.answer-card.disabled {
  pointer-events: none;
  opacity: 0.5;
}

.answer-card.correct {
  background: #10b981;
  border-color: #10b981;
}

.answer-card.wrong {
  background: #ef4444;
  border-color: #ef4444;
}

.timer-bar {
  width: 150px;
  height: 10px;
  background: rgba(255,255,255,0.2);
  border-radius: 5px;
  overflow: hidden;
}

.timer-fill {
  height: 100%;
  transition: width 0.1s linear;
}
</style>

</head>

<body>

<div class="container">

<!-- Welcome Screen -->
<div id="welcome-screen">
<h1 class="game-title">Cyber Security | Test yourself</h1>
<input type="text" id="player-name" placeholder="Enter your name" maxlength="20">
<button class="start-btn" onclick="startGame()">START GAME</button>
</div>

<!-- Countdown Screen -->
<div id="countdown-screen">
<div id="countdown-display" class="countdown-number">3</div>
</div>

<!-- Quiz Screen -->
<div id="quiz-screen">

<div class="question-card">
<p id="question-text"></p>
<p id="question-arabic"></p>
</div>

<div id="answers-container"></div>

<div class="timer-container">
<span id="timer-text">15</span>
<div class="timer-bar">
<div id="timer-fill"></div>
</div>
</div>

</div>

<!-- Result Screen -->
<div id="result-screen">

<h2>Game Complete!</h2>
<p id="final-score">0</p>
<p id="result-message"></p>

<!-- THIS WAS MISSING BEFORE -->
<div id="leaderboard-entries"></div>

<button class="start-btn" onclick="restartGame()">PLAY AGAIN</button>

</div>

</div>

<!-- -------- JAVASCRIPT SECTION – KEPT EXACT LOGIC -------- -->
<script>

// Game State
let playerName = '';
let currentQuestion = 0;
let score = 0;
let timer = null;
let timeLeft = 15;
let leaderboard = [];


// Questions – EXACT AS YOU WANTED
const questions = [
{
question: "What is the primary purpose of the UAE's National Cybersecurity Strategy (NCSS)?",
arabicQuestion: "ما هو الهدف الرئيسي من الاستراتيجية الوطنية للأمن السيبراني؟",
answers: [
{text:"Block all international websites",arabic:"حظر جميع المواقع الدولية"},
{text:"Create a secure and resilient cyber infrastructure",arabic:"إنشاء بنية آمنة ومقاومة"},
{text:"Monitor all citizens",arabic:"مراقبة الجميع"},
{text:"Replace all websites",arabic:"استبدال المواقع"}
],
correct: 1
},

{
question: "Which UAE authority is responsible for cybersecurity regulations?",
arabicQuestion: "أي جهة مسؤولة عن تنظيمات الأمن السيبراني؟",
answers: [
{text:"TRA",arabic:"هيئة تنظيم الاتصالات"},
{text:"Dubai Police",arabic:"شرطة دبي"},
{text:"Education Dept",arabic:"دائرة التعليم"},
{text:"Health Ministry",arabic:"وزارة الصحة"}
],
correct: 0
},

{
question: "What is the UAE national cybersecurity hotline?",
arabicQuestion: "ما هو الخط الساخن للإبلاغ؟",
answers: [
{text:"999",arabic:"999"},
{text:"901",arabic:"901"},
{text:"800 CRY (279)",arabic:"800 CRY"},
{text:"800 SAFE (7233)",arabic:"800 SAFE"}
],
correct: 2
},

{
question: "The UAE Cyber Security Council was established in which year?",
arabicQuestion: "تم إنشاء المجلس في أي عام؟",
answers: [
{text:"2015",arabic:"2015"},
{text:"2018",arabic:"2018"},
{text:"2020",arabic:"2020"},
{text:"2022",arabic:"2022"}
],
correct: 2
}
];
// End questions


// DOM initialization
function initializeDOM() {
  return {
    welcomeScreen: document.getElementById('welcome-screen'),
    countdownScreen: document.getElementById('countdown-screen'),
    quizScreen: document.getElementById('quiz-screen'),
    resultScreen: document.getElementById('result-screen'),
    playerNameInput: document.getElementById('player-name'),
    answersContainer: document.getElementById('answers-container')
  };
}


// Show question
function showQuestion() {

  const dom = initializeDOM();
  if (!dom.answersContainer) return;

  if (currentQuestion >= questions.length) {
    endGame();
    return;
  }

  const q = questions[currentQuestion];

  document.getElementById('question-text').textContent = q.question;
  document.getElementById('question-arabic').textContent = q.arabicQuestion;

  dom.answersContainer.innerHTML = '';

  q.answers.forEach((answer, index) => {

    const card = document.createElement('div');
    card.className = 'answer-card';

    card.innerHTML =
      '<p class="answer-text">' + answer.text + '</p>' +
      '<p class="answer-arabic">' + answer.arabic + '</p>';

    // CLICK PART KEPT EXACT
    card.addEventListener('click', function() {
      selectAnswer(index);
    });

    dom.answersContainer.appendChild(card);
  });

  startTimer();
}


// Timer
function startTimer() {

  clearInterval(timer);

  timeLeft = 15;

  timer = setInterval(() => {
    timeLeft--;
    document.getElementById('timer-text').textContent = timeLeft;

    if (timeLeft <= 0) {
      nextQuestion();
    }

  }, 1000);
}


// Select answer
function selectAnswer(selectedIndex) {

  clearInterval(timer);

  const correct = questions[currentQuestion].correct;

  const cards = document.querySelectorAll('.answer-card');

  cards.forEach(c => c.classList.add('disabled'));

  if (selectedIndex === correct) {
    cards[selectedIndex].classList.add('correct');
    score += 1000;
  } else {
    cards[selectedIndex].classList.add('wrong');
    cards[correct].classList.add('correct');
  }

  nextQuestion();
}


function nextQuestion() {
  currentQuestion++;
  setTimeout(showQuestion, 2000);
}


// End game
function endGame() {

  const dom = initializeDOM();

  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';

  document.getElementById('final-score').textContent = score;

  leaderboard = JSON.parse(localStorage.getItem('cyberQuizLeaderboard') || '[]');

  leaderboard.push({ name: playerName, score: score });

  leaderboard.sort((a,b)=>b.score-a.score);

  localStorage.setItem('cyberQuizLeaderboard', JSON.stringify(leaderboard));

  displayLeaderboard();
}


// Display leaderboard
function displayLeaderboard() {

  const entries = document.getElementById('leaderboard-entries');
  if (!entries) return;

  const data = JSON.parse(localStorage.getItem('cyberQuizLeaderboard') || '[]');

  entries.innerHTML = '';

  data.slice(0,10).forEach((e,i)=>{

    const div = document.createElement('div');
    div.className='leaderboard-entry';

    div.innerHTML =
      '<span class="player-name">' + (i+1) + '. ' + e.name + '</span>' +
      '<span class="player-score">' + e.score + '</span>';

    entries.appendChild(div);

  });
}


// Start game
function startGame() {

  const dom = initializeDOM();

  playerName = dom.playerNameInput.value.trim();

  document.getElementById('welcome-screen').style.display = 'none';
  document.getElementById('countdown-screen').style.display = 'block';

  setTimeout(()=>{

    document.getElementById('countdown-screen').style.display='none';
    document.getElementById('quiz-screen').style.display='block';

    showQuestion();

  }, 3000);
}


// Restart
function restartGame() {

  document.getElementById('result-screen').style.display='none';
  document.getElementById('welcome-screen').style.display='block';

  currentQuestion = 0;
  score = 0;
}


document.addEventListener('DOMContentLoaded', () => {
  displayLeaderboard();
});


// expose
window.startGame = startGame;
window.restartGame = restartGame;

</script>

</body>
</html>
