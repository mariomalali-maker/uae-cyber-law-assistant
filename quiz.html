<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cyber Quiz | Cyber Assistant</title>
  <link rel="stylesheet" href="styles/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body class="page-body">

  <nav class="top-nav">
    <a href="index.html" class="brand">🏠 Home</a>
    <a href="chat.html">💬 Chat</a>
    <a href="history.html">📄 History</a>
    <a href="quiz.html" class="active">🎯 Cyber Quiz</a>
    <a href="scam.html">⚠️ Scam Detector</a>
  </nav>

  <main class="center-layout">
    <section class="quiz-card floating">
      <h2>🎯 Cyber Safety Quiz</h2>
      <p class="chat-sub">
        10 quick questions with a 10s limit each. Test how well you protect yourself online.
      </p>

      <div id="quiz-start">
        <p>Ready? You’ll have only <strong>10 seconds</strong> per question.</p>
        <button id="start-quiz-btn" class="primary-btn">Start Quiz</button>
      </div>

      <div id="quiz-main" style="display:none;">
        <p id="timer">Time Left: <strong>10</strong>s</p>
        <h3 id="question-title"></h3>
        <div id="options"></div>
        <p id="feedback" class="quiz-feedback"></p>
        <button id="nextBtn" class="btn" style="display:none;">Next ➜</button>
      </div>

      <h3 id="scoreBox" style="display:none;"></h3>
    </section>
  </main>

  <footer class="footer">
    Created by Mariam – 2025
  </footer>

  <script src="scripts/quiz.js"></script>
</body>
</html>
