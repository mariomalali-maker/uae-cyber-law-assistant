<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Security | Test yourself</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #16213e 50%, #0f0f23 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Welcome Screen */
        #welcome-screen {
            text-align: center;
            animation: fadeIn 1s ease-in;
        }

        .game-title {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(45deg, #a855f7, #ec4899, #a855f7);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradient 3s ease infinite;
            margin-bottom: 10px;
        }

        .game-subtitle {
            font-size: 1.2rem;
            color: #a78bfa;
            margin-bottom: 40px;
        }

        .arabic-text {
            font-family: 'Arial', sans-serif;
            direction: rtl;
            font-size: 1.5rem;
            color: #c4b5fd;
            margin-bottom: 20px;
        }

        .input-container {
            margin: 30px 0;
        }

        #player-name {
            padding: 15px 25px;
            font-size: 1.2rem;
            border: 3px solid #a855f7;
            border-radius: 50px;
            background: rgba(168, 85, 247, 0.1);
            color: #fff;
            text-align: center;
            width: 300px;
            outline: none;
            transition: all 0.3s ease;
        }

        #player-name:focus {
            border-color: #ec4899;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
            transform: scale(1.05);
        }

        .start-btn {
            padding: 15px 50px;
            font-size: 1.3rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #a855f7, #ec4899);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4);
            margin-top: 20px;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.6);
        }

        /* Countdown Screen */
        #countdown-screen {
            display: none;
            text-align: center;
        }

        .countdown-number {
            font-size: 15rem;
            font-weight: bold;
            color: #ec4899;
            animation: pulse 1s ease-in-out;
        }

        /* Quiz Screen */
        #quiz-screen {
            display: none;
            width: 100%;
            max-width: 900px;
        }

        .answers-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .answer-card {
            border: 3px solid #a855f7;
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .answer-card.correct {
            border-color: #10b981;
        }

        .answer-card.wrong {
            border-color: #ef4444;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pulse {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes gradient {
            0%,100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Responsive */
        @media (max-width:768px){
            .game-title{font-size:2rem;}
            #player-name{width:250px;}
            .answers-container{grid-template-columns:1fr;}
        }

        @media (max-width:480px){
            .container{padding:15px;}
            .answer-card{padding:15px;}
        }

        /* RTL Support */
        [dir="rtl"] .answers-container {
            direction: rtl;
        }
    </style>

<script src="https://sites.super.myninja.ai/_day/jim/script.js"></script>

</head>

<body>

<div class="container">

<!-- Welcome Screen -->
<div id="welcome-screen">
    <h1 class="game-title">Cyber Security | Test yourself</h1>
    <p class="game-subtitle">الأمن السيبراني | اختبر نفسك</p>
    <p class="arabic-text">اختبار الأمن السيبراني في الإمارات</p>

    <div class="input-container">
        <input type="text" id="player-name" maxlength="20">
    </div>

    <button class="start-btn" onclick="startGame()">START GAME</button>
</div>

<!-- Countdown Screen -->
<div id="countdown-screen">
    <div class="countdown-number" id="countdown-display">3</div>
</div>

<!-- Quiz Screen -->
<div id="quiz-screen">
    <div class="quiz-header">
        <div>Question <span id="current-question">1</span></div>
        <div><span id="timer-text">15</span></div>
    </div>

    <div class="question-card">
        <p id="question-text"></p>
        <p id="question-arabic"></p>
    </div>

    <div class="answers-container" id="answers-container"></div>
</div>

<!-- Result Screen -->
<div id="result-screen">
    <div id="final-score">0</div>
    <p id="result-message"></p>
    <button class="start-btn" onclick="restartGame()">PLAY AGAIN</button>
</div>

</div>

<script>
/* ===== محتوى quiz.js المدموج ===== */

let playerName = '';
let currentQuestion = 0;
let score = 0;
let timer;
let timeLeft = 15;
let leaderboard = [];

const questions = [
    {
        question: "What is the primary purpose of the UAE's National Cybersecurity Strategy (NCSS)?",
        arabicQuestion: "ما هو الهدف الرئيسي من الاستراتيجية الوطنية للأمن السيبراني في الإمارات؟",
        answers: [
            { text: "Block all international websites", arabic: "حظر جميع المواقع الدولية" },
            { text: "Create a secure and resilient cyber infrastructure", arabic: "إنشاء بنية تحتية سيبرانية آمنة ومقاومة" },
            { text: "Monitor all citizens online", arabic: "مراقبة أنشطة المواطنين" },
            { text: "Replace government sites", arabic: "استبدال المواقع الحكومية" }
        ],
        correct: 1
    },

    /* بقية الأسئلة كما هي موجودة فوق في المصفوفة الأصلية */
];

function initializeDOM(){
    welcomeScreen = document.getElementById('welcome-screen');
    countdownScreen = document.getElementById('countdown-screen');
    quizScreen = document.getElementById('quiz-screen');
    resultScreen = document.getElementById('result-screen');
    playerNameInput = document.getElementById('player-name');
    countdownDisplay = document.getElementById('countdown-display');
    questionText = document.getElementById('question-text');
    questionArabic = document.getElementById('question-arabic');
    answersContainer = document.getElementById('answers-container');
    timerText = document.getElementById('timer-text');
    timerFill = document.getElementById('timer-fill');
    currentQuestionSpan = document.getElementById('current-question');
    finalScore = document.getElementById('final-score');
    resultMessage = document.getElementById('result-message');
    leaderboardEntries = document.getElementById('leaderboard-entries');
}

function startGame(){
    initializeDOM();

    playerName = playerNameInput.value.trim();
    if(!playerName){ return; }

    welcomeScreen.style.display='none';
    countdownScreen.style.display='block';
    showCountdown();
}

function showCountdown(){
    let count=3;
    const interval=setInterval(()=>{
        count--;
        if(count<=0){
            clearInterval(interval);
            countdownScreen.style.display='none';
            quizScreen.style.display='block';
            showQuestion();
        }
    },1000);
}

function showQuestion(){
    if(currentQuestion>=questions.length){
        endGame();
        return;
    }

    const q=questions[currentQuestion];
    questionText.textContent=q.question;
    questionArabic.textContent=q.arabicQuestion;

    answersContainer.innerHTML='';

    q.answers.forEach((a,i)=>{
        const card=document.createElement('div');
        card.className='answer-card';

        card.innerHTML=
          '<p>'+a.text+'</p>'+
          '<p>'+a.arabic+'</p>';

        card.addEventListener('click',()=>selectAnswer(i));
        answersContainer.appendChild(card);
    });

    startTimer();
}

function startTimer(){
    timeLeft=15;
    timer=setInterval(()=>{
        timeLeft--;
        updateTimerDisplay();
        if(timeLeft<=0){
            clearInterval(timer);
            timeUp();
        }
    },1000);
}

function updateTimerDisplay(){
    timerText.textContent=timeLeft;
}

function timeUp(){
    currentQuestion++;
    showQuestion();
}

function selectAnswer(i){
    clearInterval(timer);

    const correct=questions[currentQuestion].correct;
    if(i===correct){
        score+=Math.round((timeLeft/15)*1000);
    }

    currentQuestion++;
    showQuestion();
}

function endGame(){
    quizScreen.style.display='none';
    resultScreen.style.display='block';
    finalScore.textContent=score;
    updateLeaderboard();
}

function updateLeaderboard(){
    leaderboard.push({name:playerName,score:score});
    leaderboard.sort((a,b)=>b.score-b.score);
    leaderboard=leaderboard.slice(0,10);
    localStorage.setItem('cyberQuizLeaderboard',JSON.stringify(leaderboard));
}

function restartGame(){
    welcomeScreen.style.display='block';
    resultScreen.style.display='none';
    currentQuestion=0;
    score=0;
}

window.startGame = startGame;
window.restartGame = restartGame;

document.addEventListener('DOMContentLoaded',()=>{
   initializeDOM();
});
</script>

</body>
</html>
