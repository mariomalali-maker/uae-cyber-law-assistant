<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport"content="width=device-width,initial-scale=1">
<title>Cyber Quiz</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#050816;color:white;}
nav{display:flex;gap:16px;padding:14px 20px;background:#0f1629;border-bottom:1px solid rgba(255,255,255,.12);overflow-x:auto;}
nav a{color:white;text-decoration:none;font-size:.9rem;padding:6px 10px;border-radius:8px;}
nav a:hover{background:#1f2937;}nav .active{background:#22c55e;color:#000}
#card{width:100%;max-width:760px;margin:40px auto;background:#111827;border-radius:14px;height:220px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;transition:.6s;cursor:pointer}
.flip{transform:rotateY(180deg);}
</style></head>
<body>

<nav>
<a href="index.html">🏠 Home</a>
<a href="chat.html">💬 Chat</a>
<a class="active" href="quiz.html">🧠 Cyber Quiz</a>
<a href="scam.html">🛑 Scam Detector</a>
<a href="settings.html">⚙️ Settings</a>
 <a href="saeed.game.html">🎮 Saeed's Game</a>
</nav>

<div id="card"></div>

<script>
const quiz=[{q:"Legal to share photo w/out permission in UAE?",a:"No"},{q:"Where to report scams?",a:"ecrime.ae"},{q:"Share OTP?",a:"No"}];
let i=0,showA=false;

function render(){
 card.textContent = showA? quiz[i].a : quiz[i].q;
}
card.onclick=()=>{showA=!showA;card.classList.toggle("flip");setTimeout(()=>{render();if(showA){i++;showA=false;if(i>=quiz.length){card.textContent="🎉 Done!"}}},300)}
render();
</script>
</body></html>

  <script src="scripts/quiz.js"></script>
</body>
</html>
