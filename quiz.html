<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz</title>
<style>
body{margin:0;padding:20px;background:#0d1524;color:white;font-family:system-ui,sans-serif;}
.card{background:#132033;padding:20px;border-radius:12px;}
button{padding:10px;width:100%;margin-top:10px;border:none;border-radius:8px;background:#00c48c;color:white;}
</style>
</head>

<body>
<a href="welcome.html" style="color:white;">⟵</a>
<h2>🧠 Quiz Zone</h2>
<div class="card" id="q"></div>

<script>
let quiz=[
{q:"Is sharing someone's photo without permission legal in UAE?",a:"no"},
{q:"Where to report scams?",a:"ecrime.ae"},
{q:"Give OTP to others?",a:"no"}
];
let i=0,s=0;
function show(){
 if(i>=quiz.length)return q.innerHTML=`Done! Score: ${s}/${quiz.length}`;
 q.innerHTML=`<h3>${quiz[i].q}</h3><input id='a'><button onclick='check()'>Answer</button>`;
}
function check(){
 let a=document.getElementById("a").value.trim().toLowerCase();
 if(a===quiz[i].a){s++;alert("✔");} else alert("✖ "+quiz[i].a);
 i++;show();
}
show();
</script>

<a href="chat.html" style="position:fixed;bottom:22px;right:22px;background:#00c48c;padding:14px;border-radius:50%;color:white;">💬</a>
</body>
</html>

  <script src="scripts/quiz.js"></script>
</body>
</html>
