<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎯 Cyber Security Quiz | Kahoot Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* YOUR ORIGINAL CSS */
        canvas { display: none !important; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --kahoot-red: #e21b3c; --kahoot-blue: #1368ce; --kahoot-yellow: #d89e00;
            --kahoot-green: #26890c; --dark-bg: #1a1a2e; --card-bg: #16213e;
            --text-primary: #ffffff; --text-secondary: #a0a0a0;
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); color: var(--text-primary); min-height: 100vh; overflow-x: hidden; }
        .screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .hidden { display: none !important; }
        .logo-container { text-align: center; margin-bottom: 40px; }
        .pulse-logo { font-size: 80px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .title { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin-top: 20px; text-shadow: 0 0 20px rgba(102, 126, 234, 0.5); text-align: center; }
        .gradient-text { background: var(--gradient-1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .language-selector { margin-bottom: 30px; text-align: center; }
        .lang-buttons { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
        .lang-btn { background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 15px; padding: 20px 30px; cursor: pointer; transition: all 0.3s ease; display: flex; flex-direction: column; align-items: center; gap: 10px; backdrop-filter: blur(10px); color: white; }
        .flag { font-size: 3rem; }
        .start-container { opacity: 0; transform: translateY(20px); transition: all 0.5s ease; text-align: center; }
        .start-container.visible { opacity: 1; transform: translateY(0); }
        .player-info input { background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 25px; padding: 15px 25px; font-size: 1.1rem; color: white; text-align: center; width: 300px; outline: none; margin-bottom: 20px; }
        .btn-start { background: var(--gradient-1); border: none; border-radius: 50px; padding: 20px 60px; font-size: 1.3rem; font-weight: 700; color: white; cursor: pointer; }
        .countdown-number { font-size: 12rem; font-weight: 900; background: var(--gradient-1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .quiz-header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .timer-bar { width: 100%; max-width: 800px; height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 4px; margin-bottom: 30px; overflow: hidden; }
        .timer-fill { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 1s linear; }
        .question-box { background: rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 40px; margin-bottom: 30px; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 800px; text-align: center; }
        .options-container { width: 100%; max-width: 800px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .option-btn { background: rgba(255, 255, 255, 0.1); border: none; border-radius: 15px; padding: 25px 20px; cursor: pointer; display: flex; align-items: center; gap: 15px; transition: all 0.3s ease; color: white; text-align: left; }
        .option-btn.correct { background: var(--kahoot-green) !important; }
        .option-btn.wrong { background: var(--kahoot-red) !important; }
        .feedback-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .results-container { text-align: center; max-width: 600px; }
        .score-circle { position: relative; width: 250px; height: 250px; margin: 0 auto 40px; }
        .progress-ring { transform: rotate(-90deg); width: 250px; height: 250px; }
        .progress-ring-bg { fill: none; stroke: rgba(255, 255, 255, 0.1); stroke-width: 12; }
        .progress-ring-fill { fill: none; stroke: #667eea; stroke-width: 12; stroke-linecap: round; stroke-dasharray: 565.48; stroke-dashoffset: 565.48; transition: stroke-dashoffset 1.5s ease; }
        .score-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; font-weight: 900; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-item { background: rgba(255, 255, 255, 0.05); border-radius: 15px; padding: 20px; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: #667eea; }
        .btn-play { border: none; border-radius: 50px; padding: 15px 40px; cursor: pointer; color: white; background: var(--gradient-1); font-weight: 700; }
        body.rtl { direction: rtl; }
    </style>
</head>
<body>

<div id="startScreen" class="screen">
    <div class="logo-container">
        <div class="pulse-logo">🎯</div>
        <h1 class="title">CYBER SECURITY<br><span class="gradient-text">CHALLENGE</span></h1>
    </div>
    <div class="language-selector">
        <h3>Choose Language / اختر اللغة</h3>
        <div class="lang-buttons">
            <button class="lang-btn" onclick="setLanguage('EN')">
                <span class="flag">🇬🇧</span><span class="lang-name">English</span>
            </button>
            <button class="lang-btn" onclick="setLanguage('AR')">
                <span class="flag">🇦🇪</span><span class="lang-name">العربية</span>
            </button>
        </div>
    </div>
    <div id="startContainer" class="start-container hidden">
        <div class="player-info">
            <input type="text" id="playerName" placeholder="Enter your name / أدخل اسمك" maxlength="15">
        </div>
        <button class="btn-start" onclick="startGame()">🚀 START GAME</button>
    </div>
</div>

<div id="countdownScreen" class="screen hidden">
    <div class="countdown-number" id="countdownNumber">3</div>
</div>

<div id="quizScreen" class="screen hidden">
    <div class="quiz-header">
        <div class="question-counter"><span id="currentQ">1</span>/<span id="totalQ">10</span></div>
        <div class="score-display">⭐ <span id="currentScore">0</span></div>
    </div>
    <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
    <div class="question-box"><h2 id="questionText"></h2></div>
    <div class="options-container">
        <button class="option-btn" onclick="selectAnswer(0)"><span class="option-key">A</span><span class="option-text"></span></button>
        <button class="option-btn" onclick="selectAnswer(1)"><span class="option-key">B</span><span class="option-text"></span></button>
        <button class="option-btn" onclick="selectAnswer(2)"><span class="option-key">C</span><span class="option-text"></span></button>
        <button class="option-btn" onclick="selectAnswer(3)"><span class="option-key">D</span><span class="option-text"></span></button>
    </div>
    <div id="feedbackOverlay" class="feedback-overlay hidden">
        <div class="feedback-content" style="text-align: center;">
            <div id="feedbackIcon" style="font-size: 8rem;"></div>
            <div id="feedbackText" style="font-size: 2rem; font-weight: 700; color: white;"></div>
            <div id="feedbackPoints" style="font-size: 3rem; font-weight: 900; color: #f093fb;"></div>
        </div>
    </div>
</div>

<div id="resultsScreen" class="screen hidden">
    <div class="results-container">
        <div class="result-emoji">🏆</div>
        <h2 id="resultTitle"></h2>
        <div class="score-circle">
            <svg class="progress-ring"><circle class="progress-ring-bg" cx="125" cy="125" r="90"/><circle class="progress-ring-fill" id="progressRing" cx="125" cy="125" r="90"/></svg>
            <div class="score-text"><span id="finalScore">0</span></div>
        </div>
        <div class="player-result"><p id="playerNameDisplay" style="font-size: 1.5rem; font-weight: 700;"></p></div>
        <div class="stats-grid">
            <div class="stat-item"><div id="correctCount" class="stat-value">0</div><div>Correct</div></div>
            <div class="stat-item"><div id="wrongCount" class="stat-value">0</div><div>Wrong</div></div>
            <div class="stat-item"><div id="accuracy" class="stat-value">0%</div><div>Accuracy</div></div>
        </div>
        <button class="btn-play" onclick="location.reload()">PLAY AGAIN</button>
    </div>
</div>

<script>
    let currentLanguage = '';
    let currentQuestion = 0;
    let score = 0;
    let playerName = 'Anonymous';
    let timeLeft = 15;
    let timerInterval = null;
    let hasAnswered = false;
    let correctAnswers = 0;
    let wrongAnswers = 0;

    const questions = [
        {
            en: "A social media account was hacked and the attacker changed the recovery email. What is the safest first action?",
            ar: "تم اختراق حساب على التواصل الاجتماعي وتغيير البريد. ما أول إجراء آمن؟",
            options: {
                en: ["Negotiate", "Report to ecrime.ae and secure linked accounts", "Delete account", "Post publicly"],
                ar: ["التفاوض", "بلاغ رسمي ecrime.ae وتأمين الحسابات", "حذف الحساب", "النشر للعلن"]
            },
            correct: 1
        },
        {
            en: "A message from 'the bank' asks for identity verification via a suspicious link. What should you do?",
            ar: "رسالة من البنك تطلب التحقق عبر رابط مشبوه. ماذا تفعل؟",
            options: {
                en: ["Open link", "Verify via official bank channels", "Forward to friends", "Ignore"],
                ar: ["فتح الرابط", "التحقق عبر قنوات البنك الرسمية", "إرسال للأصدقاء", "تجاهل"]
            },
            correct: 1
        }
        // ... (You can add more questions here following the same format)
    ];

    function setLanguage(lang) {
        currentLanguage = lang;
        document.body.classList.toggle('rtl', lang === 'AR');
        document.getElementById('startContainer').classList.remove('hidden');
        setTimeout(() => document.getElementById('startContainer').classList.add('visible'), 50);
    }

    function startGame() {
        playerName = document.getElementById('playerName').value || 'Anonymous';
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('countdownScreen').classList.remove('hidden');
        
        let count = 3;
        const countEl = document.getElementById('countdownNumber');
        const timer = setInterval(() => {
            count--;
            if(count === 0) {
                clearInterval(timer);
                document.getElementById('countdownScreen').classList.add('hidden');
                document.getElementById('quizScreen').classList.remove('hidden');
                loadQuestion();
            } else {
                countEl.textContent = count;
            }
        }, 1000);
    }

    function loadQuestion() {
        hasAnswered = false;
        const q = questions[currentQuestion];
        const lang = currentLanguage.toLowerCase();
        
        document.getElementById('currentQ').textContent = currentQuestion + 1;
        document.getElementById('totalQ').textContent = questions.length;
        document.getElementById('questionText').textContent = q[lang];
        
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach((btn, i) => {
            btn.className = 'option-btn';
            btn.querySelector('.option-text').textContent = q.options[lang][i];
        });

        startTimer();
    }

    function startTimer() {
        timeLeft = 15;
        const fill = document.getElementById('timerFill');
        fill.style.width = '100%';
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            fill.style.width = (timeLeft / 15 * 100) + '%';
            if(timeLeft <= 0) {
                clearInterval(timerInterval);
                selectAnswer(-1); // Timeout
            }
        }, 1000);
    }

    function selectAnswer(idx) {
        if(hasAnswered) return;
        hasAnswered = true;
        clearInterval(timerInterval);

        const q = questions[currentQuestion];
        const isCorrect = idx === q.correct;
        const btns = document.querySelectorAll('.option-btn');

        if(isCorrect) {
            score += 1000 + (timeLeft * 50);
            correctAnswers++;
        } else {
            wrongAnswers++;
        }

        btns.forEach((btn, i) => {
            if(i === q.correct) btn.classList.add('correct');
            else if(i === idx) btn.classList.add('wrong');
        });

        showFeedback(isCorrect);
    }

    function showFeedback(correct) {
        const overlay = document.getElementById('feedbackOverlay');
        document.getElementById('feedbackIcon').textContent = correct ? '✅' : '❌';
        document.getElementById('feedbackText').textContent = correct ? 'CORRECT' : 'WRONG';
        overlay.classList.remove('hidden');

        if(correct && typeof confetti === 'function') confetti();

        setTimeout(() => {
            overlay.classList.add('hidden');
            currentQuestion++;
            if(currentQuestion < questions.length) loadQuestion();
            else showResults();
        }, 1500);
    }

    function showResults() {
        document.getElementById('quizScreen').classList.add('hidden');
        document.getElementById('resultsScreen').classList.remove('hidden');
        
        const acc = Math.round((correctAnswers / questions.length) * 100);
        document.getElementById('finalScore').textContent = score;
        document.getElementById('playerNameDisplay').textContent = playerName;
        document.getElementById('correctCount').textContent = correctAnswers;
        document.getElementById('wrongCount').textContent = wrongAnswers;
        document.getElementById('accuracy').textContent = acc + '%';
        document.getElementById('resultTitle').textContent = acc >= 70 ? 'WELL DONE!' : 'KEEP LEARNING!';

        const ring = document.getElementById('progressRing');
        ring.style.strokeDashoffset = 565.48 - (565.48 * acc / 100);
    }
</script>
</body>
</html>
