<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Security | Test yourself</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #16213e 50%, #0f0f23 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Welcome Screen */
        #welcome-screen {
            text-align: center;
            animation: fadeIn 1s ease-in;
        }

        .game-title {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(45deg, #a855f7, #ec4899, #a855f7);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradient 3s ease infinite;
            margin-bottom: 10px;
        }

        .game-subtitle {
            font-size: 1.2rem;
            color: #a78bfa;
            margin-bottom: 40px;
        }

        .arabic-text {
            font-family: 'Arial', sans-serif;
            direction: rtl;
            font-size: 1.5rem;
            color: #c4b5fd;
            margin-bottom: 20px;
        }

        .input-container {
            margin: 30px 0;
        }

        #player-name {
            padding: 15px 25px;
            font-size: 1.2rem;
            border: 3px solid #a855f7;
            border-radius: 50px;
            background: rgba(168, 85, 247, 0.1);
            color: #fff;
            text-align: center;
            width: 300px;
            outline: none;
            transition: all 0.3s ease;
        }

        #player-name:focus {
            border-color: #ec4899;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
            transform: scale(1.05);
        }

        /* Quiz Screen */
        #quiz-screen {
            display: none;
            width: 100%;
        }

        .answers-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .answer-card {
            border: 3px solid rgba(168, 85, 247, 0.4);
            border-radius: 15px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .answer-card:hover {
            transform: translateY(-5px);
            border-color: #ec4899;
        }

        .answer-card.disabled {
            pointer-events: none;
            opacity: 0.5;
        }

        .answer-card.correct {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .answer-card.wrong {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        /* Result Screen */
        #result-screen {
            display: none;
            text-align: center;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
    </style>

<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>

<body>

<div class="container">

<!-- Welcome Screen -->
<div id="welcome-screen">
    <h1 class="game-title">Cyber Security | Test yourself</h1>
    <input type="text" id="player-name" placeholder="Enter your name" maxlength="20">
    <button class="start-btn" onclick="startGame()">START GAME</button>
</div>

<!-- Countdown Screen -->
<div id="countdown-screen">
    <div id="countdown-display" class="countdown-number">3</div>
</div>

<!-- Quiz Screen -->
<div id="quiz-screen">
    <p id="question-text"></p>
    <p id="question-arabic" class="arabic-text"></p>
    <div id="answers-container" class="answers-container"></div>
</div>

<!-- Result Screen -->
<div id="result-screen">
    <h2>Game Complete!</h2>
    <p id="final-score">0</p>
    <p id="result-message"></p>
    <div id="leaderboard-entries"></div>
    <button class="start-btn" onclick="restartGame()">PLAY AGAIN</button>
</div>

</div>


</body>
</html>

<!-- -------- JAVASCRIPT SECTION -------- -->
<script>

// ----------- EXACT JS YOU SENT – NO CHANGE -----------

let playerName = '';
let currentQuestion = 0;
let score = 0;
let timer;
let timeLeft = 15;
let leaderboard = [];

const questions = [
    {
        question: "What is the primary purpose of the UAE's National Cybersecurity Strategy (NCSS)?",
        arabicQuestion: "ما هو الهدف الرئيسي من الاستراتيجية الوطنية للأمن السيبراني في الإمارات؟",
        answers: [
            { text: "Block all international websites", arabic: "حظر جميع المواقع الدولية" },
            { text: "Create a secure and resilient cyber infrastructure", arabic: "إنشاء بنية تحتية سيبرانية آمنة ومقاومة" },
            { text: "Monitor all citizens' online activities", arabic: "مراقبة أنشطة جميع المواطنين عبر الإنترنت" },
            { text: "Replace all government websites with internal servers", arabic: "استبدال جميع المواقع الحكومية بخوادم داخلية" }
        ],
        correct: 1
    },

    {
        question: "Which UAE authority is responsible for cybersecurity regulations and policies?",
        arabicQuestion: "أي جهة إماراتية مسؤولة عن تنظيمات وسياسات الأمن السيبراني؟",
        answers: [
            { text: "Telecommunications Regulatory Authority (TRA)", arabic: "هيئة تنظيم الاتصالات" },
            { text: "Dubai Police", arabic: "شرطة دبي" },
            { text: "Abu Dhabi Department of Education", arabic: "دائرة التعليم والمعرفة في أبوظبي" },
            { text: "Ministry of Health", arabic: "وزارة الصحة" }
        ],
        correct: 0
    },

    {
        question: "What is the UAE's national cybersecurity hotline for reporting cyber incidents?",
        arabicQuestion: "ما هو الخط الساخن الوطني للأمن السيبراني للإبلاغ عن الحوادث السيبرانية؟",
        answers: [
            { text: "999", arabic: "999" },
            { text: "901", arabic: "901" },
            { text: "800 CRY (279)", arabic: "800 CRY (279)" },
            { text: "800 SAFE (7233)", arabic: "800 SAFE (7233)" }
        ],
        correct: 2
    },

    {
        question: "The UAE Cyber Security Council was established in which year?",
        arabicQuestion: "تم إنشاء مجلس الأمن السيبراني في الإمارات في أي عام؟",
        answers: [
            { text: "2015", arabic: "2015" },
            { text: "2018", arabic: "2018" },
            { text: "2020", arabic: "2020" },
            { text: "2022", arabic: "2022" }
        ],
        correct: 2
    }
];

function initializeDOM() {
    welcomeScreen = document.getElementById('welcome-screen');
    countdownScreen = document.getElementById('countdown-screen');
    quizScreen = document.getElementById('quiz-screen');
    resultScreen = document.getElementById('result-screen');
    playerNameInput = document.getElement.getElementById('player-name');
    questionText = document.getElementById('question-text');
    questionArabic = document.getElementById('question-arabic');
    answersContainer = document.getElementById('answers-container');
    timerText = document.getElementById('timer-text');
    timerFill = document.getElementById('timer-fill');
    currentQuestionSpan = document.getElementById('current-question');
    finalScore = document.getElementById('final-score');
    resultMessage = document.getElementById('result-message');
    leaderboardEntries = document.getElementById('leaderboard-entries');
}

function startGame() {
    playerName = playerNameInput.value.trim();

    if (!playerName) {
        playerNameInput.style.borderColor = '#ef4444';
        return;
    }

    showCountdown();
}

function showCountdown() {
    welcomeScreen.style.display = 'none';
    countdownScreen.style.display = 'block';

    setTimeout(() => {
        countdownScreen.style.display = 'none';
        quizScreen.style.display = 'block';
        showQuestion();
    }, 3000);
}

function showQuestion() {
    if (currentQuestion >= questions.length) {
        endGame();
        return;
    }

    const q = questions[currentQuestion];

    questionText.textContent = q.question;
    questionArabic.textContent = q.arabicQuestion;

    answersContainer.innerHTML = '';

    q.answers.forEach((a, i) => {
        const card = document.createElement('div');
        card.className = 'answer-card';
        card.onclick = () => selectAnswer(i);
        answersContainer.appendChild(card);
    });
}

function startTimer() {
    timeLeft = 15;
    timer = setInterval(() => {
        timeLeft--;
        timerText.textContent = timeLeft;
        if (timeLeft <= 0) {
            currentQuestion++;
            showQuestion();
        }
    }, 1000);
}

function selectAnswer(i) {
    clearInterval(timer);

    if (i === questions[currentQuestion].correct) {
        score += 1000;
    }

    currentQuestion++;
    setTimeout(showQuestion, 2000);
}

function endGame() {
    quizScreen.style.display = 'none';
    resultScreen.style.display = 'block';
    finalScore.textContent = score;

    const saved = localStorage.getItem('cyberQuizLeaderboard');
    if (saved) leaderboard = JSON.parse(saved);

    leaderboard.push({ name: playerName, score });

    leaderboard.sort((a, b) => b.score - a.score);

    localStorage.setItem('cyberQuizLeaderboard', JSON.stringify(leaderboard));

    displayLeaderboard();
}

function displayLeaderboard() {
    leaderboardEntries.innerHTML = '';

    leaderboard.forEach((e, i) => {
        const div = document.createElement('div');
        div.textContent = e.name + ' - ' + e.score;
        leaderboardEntries.appendChild(div);
    });
}

function restartGame() {
    resultScreen.style.display = 'none';
    welcomeScreen.style.display = 'block';
    currentQuestion = 0;
    score = 0;
}

document.addEventListener('DOMContentLoaded', () => {
    initializeDOM();
});

window.startGame = startGame;
window.restartGame = restartGame;

</script>
<!-- ----------- END EXACT JS ----------- -->

</html>
