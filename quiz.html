<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Security | Test yourself</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #1a0a2e 0%, #16213e 50%, #0f0f23 100%);
  min-height: 100vh;
  color: #ffffff;
}

/* Welcome Screen */
#welcome-screen {
  text-align: center;
}

#player-name {
  padding: 15px 25px;
  font-size: 1.2rem;
  border: 3px solid #a855f7;
  border-radius: 50px;
  background: rgba(168, 85, 247, 0.1);
  color: #fff;
  text-align: center;
  width: 300px;
  outline: none;
  margin:20px;
}

.start-btn {
  padding: 15px 50px;
  font-size: 1.3rem;
  font-weight: bold;
  border: none;
  border-radius: 50px;
  background: linear-gradient(45deg, #a855f7, #ec4899);
  color: white;
  cursor: pointer;
  margin-top: 20px;
}

/* Screens */
#countdown-screen { display:none; }
#quiz-screen { display:none; }
#result-screen { display:none; }

/* Quiz */
.quiz-header {
  display:flex;
  justify-content:space-between;
  padding:15px;
}

.question-card {
  padding:20px;
  background:rgba(168,85,247,0.15);
  border-radius:15px;
  margin-bottom:20px;
}

.answers-container {
  display:grid;
  gap:15px;
}

.answer-card {
  border:2px solid rgba(168,85,247,0.4);
  border-radius:12px;
  padding:20px;
  text-align:center;
  cursor:pointer;
}

.answer-text { font-size:1.2rem; margin-bottom:8px; }
.answer-arabic { direction:rtl; font-size:1rem; color:#c4b5fd; }

.score-display {
  font-size:3rem;
  margin:20px;
}

/* Colors for result feedback */
.correct { background:rgba(16,185,129,0.3); }
.wrong { background:rgba(239,68,68,0.3); }

@media(max-width:768px){
  .quiz-header{ flex-direction:column; gap:10px; }
}
</style>

</head>

<body>
<div class="container">

<div id="welcome-screen">
<h1>Cyber Security | Test yourself</h1>
<input type="text" id="player-name" placeholder="Enter your name" maxlength="20">
<button class="start-btn" onclick="startGame()">START GAME</button>
</div>

<div id="countdown-screen">
<div id="countdown-display">3</div>
</div>

<div id="quiz-screen">
<div class="quiz-header">
<div>Question <span id="current-question">1</span>/15</div>
<div>Time: <span id="timer-text">15</span></div>
</div>

<div class="question-card">
<p id="question-text"></p>
<p id="question-arabic"></p>
</div>

<div class="answers-container" id="answers-container"></div>

</div>

<div id="result-screen">
<h1>Game Complete!</h1>
<div class="score-display" id="final-score">0</div>
<p id="result-message"></p>
<button class="start-btn play-again-btn" onclick="restartGame()">PLAY AGAIN</button>

<div class="leaderboard">
<h2>Leaderboard</h2>
<div id="leaderboard-entries"></div>
</div>

</div>

</div>

<script src="quiz.js"></script>
</body>
</html>
