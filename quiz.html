<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>🎮 Saeed’s Cyber Game | UAE Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti"></script>

<style>
body{
  margin:0;background:linear-gradient(135deg,#050b17,#111827);
  font-family:'Poppins',sans-serif;color:white;text-align:center;
  overflow-x:hidden;
}

/* NAV */
nav{display:flex;gap:12px;padding:12px;background:#0b1220;}
nav a{color:#eee;text-decoration:none;padding:8px 14px;border-radius:10px;}
nav a.active,nav a:hover{background:#1f2937;color:white;}

/* WELCOME */
#welcome{padding:70px 20px;animation:fade .8s}
@keyframes fade{from{opacity:0;transform:translateY(20px)}}
#welcome img{width:160px;animation:float 3s infinite}
@keyframes float{50%{transform:translateY(-12px)}}

/* BUTTONS */
.btn{
background:linear-gradient(135deg,#22c55e,#06b6d4);
border:none;padding:14px 24px;margin:6px;
border-radius:40px;font-weight:600;cursor:pointer;font-size:17px;
transition:.3s;
}
.btn:hover{transform:scale(1.06)}

/* QUIZ CARD */
#quiz{
display:none;width:92%;max-width:500px;margin:40px auto;
background:#1a2438;padding:25px;border-radius:20px;
box-shadow:0 0 45px rgba(0,255,204,.2);
animation:fade 0.8s;
}

/* PROGRESS BAR */
#progressBar{height:10px;background:#333;border-radius:10px;margin-bottom:10px;}
#progress{height:10px;background:#22c55e;width:0;border-radius:10px;transition:.5s}

/* OPTIONS */
.opt{
width:100%;padding:14px;margin:10px 0;
background:#233044;border:none;border-radius:12px;
color:white;font-size:16px;cursor:pointer;
transition:.2s;
}
.opt:hover{background:#31405A;transform:scale(1.02)}
.correct{background:#22c55e!important;color:#000!important;}
.wrong{background:#b91c1c!important;}

/* END */
#end{display:none;padding:80px 20px;}
#end h1{font-size:38px;margin-bottom:10px;}
.fall{position:fixed;top:-10px;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}

footer{margin:40px 0;opacity:.5;font-size:12px}
</style>
</head>

<body>

<nav>
<a href="index.html">🏠 Home</a>
<a href="chat.html">💬 Chat</a>
<a href="history.html">📁 History</a>
<a class="active">🎮 Saeed's Game</a>
</nav>

<div id="welcome">
<img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png"/>
<h1>🎯 Cyber Security Quiz</h1>
<p>Real UAE situations. Learn to protect yourself.</p>

<h3>Choose Language / اختار اللغة</h3>
<button class="btn" onclick="setLang('EN')">🇬🇧 English</button>
<button class="btn" onclick="setLang('AR')">🇦🇪 العربية</button>

<button id="startBtn" class="btn" style="display:none;">🚀 Start</button>
</div>

<div id="quiz">
<h2 id="q"></h2>
<div id="timer">⏳ 15s</div>
<div id="progressBar"><div id="progress"></div></div>
<div id="options"></div>
<button class="btn" id="next" style="display:none;">Next ➜</button>
</div>

<div id="end">
<h1 id="endHead"></h1>
<h2 id="score"></h2>
<button class="btn" onclick="location.reload()">🔁 Play Again</button>
</div>

<footer>Created by Mariam — 2025</footer>

<script src="scripts/quiz.js?v=2025"></script>
</body>
</html>
