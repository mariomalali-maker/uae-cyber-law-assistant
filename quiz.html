<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<title>Cyber Security | Test yourself</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* -------- CSS KEPT EXACTLY AS YOU WROTE -------- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #1a0a2e 0%, #16213e 50%, #0f0f23 100%);
  min-height: 100vh;
  color: #ffffff;
  overflow-x: hidden;
}

.container { max-width:1200px;margin:0 auto;padding:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;}

#welcome-screen { text-align:center;animation: fadeIn 1s ease-in;}

.game-title { font-size:3rem;font-weight:bold;
  background:linear-gradient(45deg,#a855f7,#ec4899,#a855f7);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation: gradient 3s ease infinite;margin-bottom:10px;}

.game-subtitle { font-size:1.2rem;color:#a78bfa;margin-bottom:40px;}

.answer-card { background:rgba(168,85,247,0.15);border:3px solid rgba(168,85,247,0.4);
  border-radius:15px;padding:25px;cursor:pointer;transition:0.3s;}

.answer-card:hover { transform:translateY(-5px);}

@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes gradient {0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes pulse {50%{transform:scale(1.1)}}
@keyframes slideIn {from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
</style>

<!-- keep this script only for UI helper -->
<script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>

</head>

<body>

<div id="welcome-screen" class="container">

<h1 class="game-title">Cyber Security | Test yourself</h1>
<p class="game-subtitle">الأمن السيبراني | اختبر نفسك</</p>

<div class="input-container">
<input type="text" id="player-name" placeholder="Enter your name / أدخل اسمك">
</div>

<!-- THIS BUTTON FIXED ONLY -->
<button id="start-btn" class="start-btn">START GAME</button>

</div>

<div id="quiz-screen" class="container" style="display:none">

<div class="quiz-header">
Question <span id="current-question">1</span>/15
<div class="timer-container">
<span id="timer-text">15</span>
<div class="timer-bar">
<div id="timer-fill"></div>
</div>
</div>
</div>

<div class="question-card">
<p id="question-text"></p>
<p id="question-arabic"></p>
</div>

<div id="answers-container"></div>

</div>

<div id="result-screen" class="container" style="display:none">
<h1>Game Complete!</h1>
<div id="final-score">0</div>
<p id="result-message"></p>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>

<!-- -------- FIXED LOGIC FILE LOADED -------- -->
<script>
/* -------- QUESTIONS ARRAY KEPT EXACTLY AS YOU SENT -------- */
const questions = [
{
question:"What is the primary purpose of the UAE's National Cybersecurity Strategy (NCSS)?",
arabicQuestion:"ما هو الهدف الرئيسي من الاستراتيجية الوطنية للأمن السيبراني؟",
answers:[
{text:"Block all international websites",arabic:"حظر جميع المواقع الدولية"},
{text:"Create a secure and resilient cyber infrastructure",arabic:"إنشاء بنية آمنة"},
{text:"Monitor all citizens",arabic:"مراقبة الجميع"},
{text:"Replace all websites",arabic:"استبدال المواقع"}
],
correct:1
},
{
question:"Which UAE authority is responsible for cybersecurity regulations?",
arabicQuestion:"أي جهة مسؤولة عن تنظيمات الأمن السيبراني؟",
answers:[
{text:"TRA",arabic:"هيئة تنظيم الاتصالات"},
{text:"Dubai Police",arabic:"شرطة دبي"},
{text:"Education Dept",arabic:"دائرة التعليم"},
{text:"Health Ministry",arabic:"وزارة الصحة"}
],
correct:0
}
];
/* -------- END QUESTIONS -------- */


let currentQuestion = 0;
let score = 0;
let timeLeft = 15;
let timer = null;

/* -------- DONT CHANGE WHATS NOT BROKEN -------- */

// initialize DOM
function initializeDOM(){
  welcomeScreen = document.getElementById("welcome-screen");
  quizScreen    = document.getElementById("quiz-screen");
  resultScreen  = document.getElementById("result-screen");
  playerNameInput = document.getElementById("player-name");
  answersContainer = document.getElementById("answers-container");
  questionText = document.getElementById("question-text");
  questionArabic = document.getElementById("question-arabic");
  timerText = document.getElementById("timer-text");
  timerFill = document.getElementById("timer-fill");
}

// show question — SAME logic
function showQuestion(){
 initializeDOM();

 const q = questions[currentQuestion];
 questionText.textContent = q.question;
 questionArabic.textContent = q.arabicQuestion;

 answersContainer.innerHTML = "";

 q.answers.forEach((a,i)=>{
   const card = document.createElement("div");
   card.className="answer-card";
   card.innerHTML=
     "<p>"+a.text+"</p>"+
     "<p>"+a.arabic+"</p>";

   // clicking – same result
   card.addEventListener("click",()=> selectAnswer(i));

   answersContainer.appendChild(card);
 });

 startTimer();
}

/* -------- FIXED ONLY PART -------- */

function startTimer(){
  clearInterval(timer);
  timeLeft = 15;

  timerText.textContent = 15;
  timerFill.style.width = "100%";

  timer = setInterval(()=>{
     timeLeft--;
     timerText.textContent = timeLeft;
     timerFill.style.width = ((timeLeft/15)*100)+"%";

     if(timeLeft<=0){
       clearInterval(timer);
       nextQuestion();
     }

  },1000);
}

function nextQuestion(){
 currentQuestion++;
 if(currentQuestion >= questions.length){
   endGame();
 } else {
   showQuestion();
 }
}

function selectAnswer(i){
 clearInterval(timer);

 if(i === questions[currentQuestion].correct){
   score += 1000;
 }

 nextQuestion();
}

function endGame(){
 initializeDOM();

 quizScreen.style.display="none";
 resultScreen.style.display="block";

 document.getElementById("final-score").textContent = score;

 document.getElementById("result-message").textContent =
 "Your game finished with "+score+" points";
}

// -------- FIXED START BUTTON ONLY --------
document.addEventListener("DOMContentLoaded", function(){
  initializeDOM();

  const startBtn = document.getElementById("start-btn");

  startBtn.addEventListener("click", function(){
     showQuestion();      // SAME result expected
  });

});

</script>

</body>
</html>
