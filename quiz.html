<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Security | Test yourself</title>
<link rel="stylesheet" href="styles/style.css">
</head>

<body>
<div class="container">

<div id="welcome-screen">
<h1 class="game-title">Cyber Security | Test yourself</h1>
<p class="game-subtitle">الأمن السيبراني | اختبر نفسك</p>

<div class="input-container">
<input type="text" id="player-name" placeholder="Enter your name / أدخل اسمك">
</div>

<!-- ONLY this button kept – no overrides -->
<button class="start-btn" onclick="startGame()">START GAME</button>
</div>

<div id="countdown-screen" style="display:none">
<div id="countdown-display">3</div>
</div>

<div id="quiz-screen" style="display:none">

<div class="quiz-header">
<div>Question <span id="current-question">1</span>/15</div>
<div id="timer-text">15</div>
<div class="timer-bar">
<div id="timer-fill" class="timer-fill"></div>
</div>
</div>

<div class="question-card">
<p id="question-text"></p>
<p id="question-arabic"></p>
</div>

<!-- MATCH EXACT variable used in JS -->
<div id="answers-container" class="answers-container"></div>

</div>

<div id="result-screen" style="display:none">

<h1>Game Complete!</h1>
<div class="score-display" id="final-score">0</div>
<p id="result-message"></p>

<button class="play-again-btn" onclick="restartGame()">PLAY AGAIN</button>

</div>

</div>

<!-- ROOT FILE ONLY – case aligned -->
<script src="quiz.js"></script>
</body>
</</html>
