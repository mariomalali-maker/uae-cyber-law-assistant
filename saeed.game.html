<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎮 Saeed's Cyber Safety Game</title>

<style>
body{
  margin:0;background:#0d1117;font-family:Arial;color:white;
  display:flex;flex-direction:column;align-items:center;
}
nav{width:100%;background:#00000055;padding:10px;display:flex;gap:20px;justify-content:center;}
nav a{color:white;text-decoration:none;font-weight:bold;}
nav a.active{color:#22c55e;}

#toggleLang{position:absolute;top:10px;right:10px;padding:8px 13px;border-radius:8px;border:none;cursor:pointer;background:#1e293b;color:white;}

#game-area{text-align:center;margin-top:20px;position:relative;}
#hearts{font-size:22px;margin-bottom:10px;}

/* Abu Dhabi road bg */
#bg{
  width:800px;height:400px;border-radius:25px;
  background:url('https://i.imgur.com/mgbt9Lp.png') center/cover no-repeat;
  position:relative;padding-top:20px;
}
#sign{
  position:absolute;left:20px;top:20px;padding:6px 10px;border-radius:6px;
  background:#22c55e;color:black;font-weight:bold;
}

/* Saeed */
#saeed{
  width:120px;position:absolute;left:100px;bottom:30px;
  animation:walk 2s infinite alternate ease-in-out;
}
@keyframes walk{0%{transform:translateX(-5px);}100%{transform:translateX(5px);}}

/* hop on correct */
.hop{animation:hop 0.4s;}
@keyframes hop{0%{transform:translateY(0);}50%{transform:translateY(-20px);}100%{transform:translateY(0);}}

/* phone */
.phone{
  background:#0f172a;width:280px;height:390px;border-radius:25px;
  padding:15px;border:3px solid #475569;position:absolute;right:40px;bottom:20px;
  cursor:pointer;
}
.message-box{background:#1e293b;height:170px;border-radius:10px;padding:10px;font-size:15px;overflow-y:auto;}

.choice-btn{
  width:100%;padding:10px;margin:7px 0;border:none;border-radius:8px;font-weight:bold;
  cursor:pointer;font-size:14px;color:white;
}
.safe{background:#15803d;} .risky{background:#b91c1c;} .neutral{background:#64748b;}

#mouth{transition:0.3s;}
.eye{animation:blink 4s infinite;}
@keyframes blink{0%,90%,100%{transform:scaleY(1);}95%{transform:scaleY(.1);}}
</style>
</head>
<body>

<button id="toggleLang">🇬🇧 EN</button>

<nav>
  <a href="index.html">🏠 Home</a>
  <a href="chat.html">💬 Chat</a>
  <a href="quiz.html">🎯 Cyber Quiz</a>
  <a href="scam.html">⚠️ Scam Detector</a>
  <a href="saeed.game.html" class="active">🎮 Saeed’s Game</a>
</nav>

<div id="game-area">
<div id="bg">
  <div id="sign">Abu Dhabi →</div>

  <svg id="saeed" viewBox="0 0 120 200">
    <rect x="40" y="70" width="40" height="80" rx="10" fill="white"/>
    <rect x="45" y="150" width="15" height="8" rx="3" fill="black"/>
    <rect x="60" y="150" width="15" height="8" rx="3" fill="black"/>
    <circle cx="60" cy="40" r="20" fill="#f4d6b0"/>
    <path d="M35 25 Q60 5 85 25 L85 55 Q60 65 35 55Z" fill="white"/>
    <ellipse cx="60" cy="22" rx="25" ry="6" fill="black"/>
    <circle class="eye" cx="50" cy="40" r="3" fill="#3b2915"/>
    <circle class="eye" cx="70" cy="40" r="3" fill="#3b2915"/>
    <path id="mouth" d="M50 50 Q60 55 70 50" stroke="#a04c4c" stroke-width="3" fill="none"/>
  </svg>

  <div class="phone">
    <div class="message-box" id="msg">📱 Tap to Start</div>
    <button id="opt1" class="choice-btn safe" style="display:none;"></button>
    <button id="opt2" class="choice-btn risky" style="display:none;"></button>
  </div>
</div>
<div id="hearts">❤️❤️❤️</div>
</div>

<!-- SOUNDS -->
<audio id="ding" src="/sounds/ding.mp3"></audio>
<audio id="correct" src="/sounds/correct.mp3"></audio>
<audio id="wrong" src="/sounds/wrong.mp3"></audio>

<script>
let lang="en";
let started=false,level=0,hearts=3;

const text={
  en:{
    start:`📱 Saeed's phone is ringing...\n\nYou are his **Cyber Safety Advisor**.\nTap the phone to begin!`,
    win:`🎉 YOU WON! Saeed is safe!`,
    lose:`💔 Game Over — Try Again!`,
    again:`Tap phone to restart 🎮`,
    questions:[
      ["Instagram DM: 'Send a private picture?'","Block & report this account","Send them a photo"],
      ["Bank message: 'Click link to unlock account'","Use official bank app","Click the link"],
      ["'I need your OTP wallah please'","Never share codes","Share OTP"],
      ["'You won 20,000 AED! Claim now'","Ignore & report","Claim prize"],
      ["'Send passport copy for job'","Decline & report","Send passport"],
      ["'We hacked you, pay or we leak'","Don't pay; report to ecrime.ae","Pay them"],
      ["Game chat 'Download to get VIP free'","Only use official store","Download"],
      ["Unknown caller asking info","Don't share private info","Tell them details"],
      ["Email from weird domain","Verify official domain","Reply with info"],
      ["Final: Mixed apps","Verify with official sources","Respond to all"]
    ]
  },
  ar:{
    start:`📱 هاتف سعيد يرن...\n\nأنت **مستشار الأمن الرقمي**.\nساعده في الاختيار الصحيح.\nاضغط على الهاتف للبدء!`,
    win:`🎉 فزت! سعيد أصبح آمنًا`,
    lose:`💔 انتهت المحاولة — حاول مجددًا`,
    again:`اضغط على الهاتف لإعادة اللعب 🎮`,
    questions:[
      ["رسالة انستغرام: أرسل صورة خاصة؟","حظر و إبلاغ","إرسال الصورة"],
      ["البنك: افتح الرابط لاسترجاع الحساب","الدخول عبر تطبيق البنك الرسمي","فتح الرابط"],
      ["أبي رمز OTP عاجل","لا تشارك الرموز أبدًا","إرسال الرمز"],
      ["ربحت ٢٠,٠٠٠ درهم!","تجاهل و أبلغ","المطالبة بالجائزة"],
      ["نريد جوازك للوظيفة","الرفض و التبليغ","إرسال الجواز"],
      ["اخترقناك ادفع وإلا ننشر صورك","عدم الدفع ثم الإبلاغ في ecrime.ae","الدفع"],
      ["لعبة: حمل هذا للفئة VIP","تثبيت من المتجر الرسمي فقط","تحميل"],
      ["مكالمة من رقم غريب","لا تعطي أي معلومة","مشاركة المعلومات"],
      ["بريد من موقع غريب","تحقق من الموقع الرسمي","الرد بالمعلومات"],
      ["الأخير: رسائل مختلفة","التحقق من المصادر الرسمية فقط","الرد على الجميع"]
    ]
  }
};

const msg=document.getElementById("msg"),opt1=document.getElementById("opt1"),opt2=document.getElementById("opt2"),mouth=document.getElementById("mouth"),saeed=document.getElementById("saeed");

function setScene(t){msg.innerText=t;}

document.querySelector(".phone").onclick=()=>{
  if(!started){started=true;setScene(text[lang].start);setTimeout(update,1200);}
};

function update(){
  if(hearts<=0)return end(text[lang].lose);
  if(level>=text[lang].questions.length)return end(text[lang].win);

  const q=text[lang].questions[level];
  setScene(q[0]);
  opt1.textContent=q[1];opt2.textContent=q[2];
  opt1.style.display="block";opt2.style.display="block";
  mouth.setAttribute("d","M50 50 Q60 55 70 50");
  document.getElementById("ding").play();
}

opt1.onclick=()=>{
  saeed.classList.add("hop");
  setTimeout(()=>saeed.classList.remove("hop"),400);
  mouth.setAttribute("d","M50 48 Q60 62 70 48");
  document.getElementById("correct").play();
  level++;setTimeout(update,900);
};

opt2.onclick=()=>{
  hearts--;document.getElementById("hearts").textContent="❤️".repeat(hearts);
  mouth.setAttribute("d","M50 55 Q60 45 70 55");
  document.getElementById("wrong").play();
  level++;setTimeout(update,900);
};

function end(t){
  setScene(t+"\n\n"+text[lang].again);
  opt1.style.display="none";opt2.style.display="none";
  level=0;hearts=3;started=false;
}

document.getElementById("toggleLang").onclick=()=>{
  lang=lang==="en"?"ar":"en";
  document.getElementById("toggleLang").textContent=lang==="en"?"🇬🇧 EN":"🇦🇪 AR";
  setScene(text[lang].start);
};
</script>
</body>
</html>
