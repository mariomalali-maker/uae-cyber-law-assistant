<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saeed's Cyber Safety Game</title>

<style>
*{box-sizing:border-box;}
:root{--bg:#020617;--accent:#22c55e;--text:#e5e7eb;--muted:#9ca3af;}

body{margin:0;font-family:system-ui;background:radial-gradient(circle at top,#020617 0,#020617 55%,#000 100%);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
nav{display:flex;gap:12px;padding:12px 18px;background:#020617;border-bottom:1px solid rgba(15,23,42,0.9);position:sticky;top:0;}
nav a{color:var(--text);text-decoration:none;padding:6px 10px;border-radius:999px;}
nav a.active{background:var(--accent);color:#022c22;}

main{flex:1;display:flex;justify-content:center;padding:14px;}

#game-shell{width:100%;max-width:960px;background:rgba(15,23,42,0.95);border-radius:24px;overflow:hidden;position:relative;}

/* HUD */
.hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:4;}
#hearts{font-size:1.2rem;}
.level-label{background:#0d9488;padding:4px 10px;border-radius:999px;}

/* SCENE */
#scene{position:relative;width:100%;min-height:380px;background:linear-gradient(#0f172a 0,#020617 60%);}
.sky,.tower,.sea,.palm,.road{position:absolute;}
.tower{bottom:140px;width:70px;background:linear-gradient(#1f2937,#020617);border-radius:18px 18px 0 0;}
.sea{bottom:110px;left:0;right:0;height:60px;background:linear-gradient(90deg,#0ea5e9,#22c55e,#0ea5e9);opacity:.3;}
.palm{bottom:108px;width:18px;height:80px;background:#0f172a;border-radius:10px;}
.road{left:0;right:0;bottom:40px;height:80px;background:#020617;}

/* SAEED */
#saeed-wrapper{position:absolute;bottom:82px;left:18%;width:180px;animation:bounce 1.4s infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

/* PHONE */
#phone{position:absolute;right:10%;bottom:110px;width:280px;background:#020617;border:3px solid #111827;border-radius:22px;
opacity:0;pointer-events:none;transform:scale(.3) translate(40px,80px);transition:.3s;}
#phone.show{opacity:1;pointer-events:auto;transform:scale(1);}

.phone-inner{padding:10px;}
.msg-bubble{background:#111827;padding:7px 10px;border-radius:12px;margin-bottom:8px;}
.choice-btn{border:none;border-radius:999px;padding:8px;margin:3px;cursor:pointer;}
.choice-safe{background:#22c55e;color:#022c22;}
.choice-risk{background:#fee2e2;color:#7f1d1d;}

/* OVERLAYS */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:10;}
.panel{background:#020617;padding:20px;border-radius:18px;text-align:center;width:min(420px,90%);}

</style>
</head>

<body>

<nav>
<a href="index.html">🏠 Home</a>
<a href="chat.html">💬 Chat</a>
<a href="quiz.html">🧠 Cyber Quiz</a>
<a href="scam.html">⚠️ Scam Detector</a>
<a class="active">🎮 Saeed's Game</a>
</nav>

<main>
<div id="game-shell">

<!-- INTRO -->
<div class="overlay" id="intro-overlay">
<div class="panel">
<h2>🎧 This is Saeed</h2>
<p>Playing... Listen closely / يتم التشغيل .. اسمع جيدًا</p>
<button id="intro-play" class="choice-safe">▶️ Play Story</button>
<audio id="intro-audio" src="intro-voice.mp3"></audio>
</div>
</div>

<!-- LANGUAGE -->
<div class="overlay" id="lang-overlay" style="display:none;">
<div class="panel">
<h2>Choose language</h2>
<button id="lang-en" class="choice-safe">English</button>
<button id="lang-ar" class="choice-risk">العربية</button>
</div>
</div>

<div class="hud"><div id="hearts">❤️❤️❤️</div><span id="level-label">Level 1</span></div>

<section id="scene">
<div class="tower" style="left:8%;height:170px;"></div>
<div class="tower" style="left:22%;height:220px;"></div>
<div class="tower" style="left:42%;height:200px;"></div>
<div class="tower" style="left:62%;height:240px;border-radius:40px;"></div>
<div class="tower" style="left:80%;height:190px;"></div>
<div class="sea"></div>
<div class="palm" style="left:18%;"></div>
<div class="palm" style="left:48%;"></div>
<div class="palm" style="left:74%;"></div>
<div class="road"></div>

<!-- Saeed -->
<div id="saeed-wrapper">
<svg width="140" viewBox="0 0 120 220">
<circle cx="60" cy="64" r="24" fill="#fde68a"></circle>
<rect x="40" y="94" width="40" height="90" rx="18" fill="#fff"></rect>
<path id="mouth" d="M50 76 Q60 82 70 76" stroke="red" stroke-width="2" fill="none"/>
</svg>
</div>

<!-- PHONE -->
<div id="phone">
<div class="phone-inner">
<div><b id="phone-title"></b></div>
<div class="msg-bubble" id="phone-msg"></div>
<button class="choice-btn choice-safe" id="btn-safe"></button>
<button class="choice-btn choice-risk" id="btn-risk"></button>
<p id="phone-tip"></p>
</div>
</div>

</section>

<!-- END -->
<div class="overlay" id="end-overlay" style="display:none;">
<div class="panel" id="end-panel"></div>
</div>

</div>
</main>


<script>
// ---------- DATA ----------
const scenarios=[
{icon:"📱",title:{en:"Instagram DM",ar:"رسالة خاصة"},msg:{en:"Someone asked for a private picture!",ar:"شخص طلب صورة خاصة!"},safe:{en:"Block & Report",ar:"حظر و إبلاغ"},risky:{en:"Send the picture",ar:"ترسل الصورة"},tipBad:{en:"Never send personal images",ar:"لا ترسل صور شخصية"}},
{icon:"✉️",title:{en:"Fake Bank Email",ar:"بنك مزيف"},msg:{en:"Your bank is locked! Click here!",ar:"تم تجميد حسابك! اضغط هنا!"},safe:{en:"Use official app",ar:"افتح التطبيق الرسمي"},risky:{en:"Click link",ar:"اضغط الرابط"},tipBad:{en:"Banks never ask via random links",ar:"البنك ما يطلب كذا"}}
];

// ---------- VARS ----------
let i=0, hearts=3, lang="en";

// ---------- DOM ----------
const phone=document.getElementById("phone"),
msg=document.getElementById("phone-msg"),
titleEl=document.getElementById("phone-title"),
tip=document.getElementById("phone-tip"),
level=document.getElementById("level-label"),
heartsEl=document.getElementById("hearts");

// ---------- INTRO ----------
intro_play.onclick=()=>{
intro_play.textContent="🎧 Playing... Listen closely";
intro_audio.play();
intro_audio.onended=()=>{intro_overlay.style.display="none";lang_overlay.style.display="flex";}
};

// ---------- LANGUAGE ----------
lang_en.onclick=()=>{lang="en";lang_overlay.style.display="none";start();};
lang_ar.onclick=()=>{lang="ar";lang_overlay.style.display="none";start();};

// ---------- GAME ----------
function start(){i=0;hearts=3;updateHearts();load(0);phone.classList.add("show");}
function load(x){
const s=scenarios[x];
titleEl.textContent=s.title[lang];
msg.textContent=s.msg[lang];
btn_safe.textContent=s.safe[lang];
btn_risk.textContent=s.risky[lang];
tip.textContent="";
}
function updateHearts(){heartsEl.textContent="❤️".repeat(hearts)+"🖤".repeat(3-hearts);}

btn_safe.onclick=()=>choose(true);
btn_risk.onclick=()=>choose(false);

function choose(safe){
if(safe){i++;if(i>=scenarios.length)win();else load(i);}
else{hearts--;updateHearts();tip.textContent="❌ "+scenarios[i].tipBad[lang];if(hearts<=0)lose();}
}

function win(){end_panel.innerHTML="<h2>🎉 You kept Saeed safe!</h2>";end_overlay.style.display="flex";}
function lose(){end_panel.innerHTML="<h2>⚠️ Game Over</h2>";end_overlay.style.display="flex";}
</script>

</body>
</html>
