<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saeed's Cyber Safety Game</title>
<style>

/* ---------------- MOBILE RESPONSIVE ---------------- */
@media (max-width: 768px) {
  main { padding: 8px 0 10px; }
  #game-shell { max-width: 100%; border-radius: 0; }
  #scene { height: 360px; min-height: 320px; }
  #saeed-wrapper { left: 12%; bottom: 70px; width: 130px; height: 190px; }
  #phone { right: 4%; bottom: 80px; width: 55vw; max-width: 260px; }
}

/* ---------------- PHONE UI ---------------- */
#phone {
  position: absolute; right: 8%; bottom: 90px;
  width: 260px; background: #00000050;
  border-radius: 18px; display: none; z-index: 5;
}
.phone-inner {
  background: #0f172a; border-radius: 18px;
  padding: 10px; border: 1px solid #1e293b;
}
.phone-screen { margin-top: 8px; font-size: 0.88rem; }

/* ---------------- BASE ---------------- */
* { box-sizing: border-box; }
:root {
 --bg:#020617;--accent:#22c55e;--text:#e5e7eb;--muted:#9ca3af;
}
body {
 margin: 0; font-family: system-ui;
 background: radial-gradient(circle at top,#020617 0,#020617 55%,#000 100%);
 color: var(--text); min-height: 100vh; display: flex; flex-direction: column;
}

/* ---------------- NAV ---------------- */
nav {
 display: flex; align-items: center; gap: 12px;
 padding: 12px 18px; background: #020617;
 border-bottom: 1px solid rgba(15,23,42,0.9);
 position: sticky; top: 0; z-index: 10;
}
nav a {
 color: var(--text); text-decoration: none; font-size: 0.9rem;
 padding: 6px 10px; border-radius: 999px;
 display: inline-flex; align-items: center; gap: 4px;
}
nav a.active { background: var(--accent); color:#022c22; }
nav a:hover { background:#0b1120; }

/* ---------------- GAME CONTAINER ---------------- */
main { flex: 1; display: flex; justify-content: center; padding: 14px 8px 18px; }
#game-shell {
 width:100%; max-width:960px; background:rgba(15,23,42,.95);
 border-radius:24px; border:1px solid rgba(31,41,55,.9);
 box-shadow:0 25px 80px rgba(0,0,0,.7); position:relative; overflow:hidden;
}
.hud {
 position:absolute; top:10px; left:14px; right:14px;
 display:flex; justify-content:space-between; font-size:.85rem; z-index:4;
}
#scene { position:relative; width:100%; height:min(70vh,520px); min-height:380px; background:linear-gradient(#0f172a,#020617); }

/* ---------------- OVERLAYS ---------------- */
.overlay {
 position:absolute; inset:0; background:rgba(15,23,42,.9);
 display:flex; align-items:center; justify-content:center; z-index:6;
}
.panel { width:min(420px,92vw); background:#020617; border-radius:20px; padding:18px; text-align:center; }

/* ---------------- SHOW PHONE ---------------- */
#phone.show { display:block; }
</style>
</head>

<body>

<nav>
 <a href="index.html">🏠 Home</a>
 <a href="chat.html">💬 Chat</a>
 <a href="history.html">📁 History</a>
 <a href="quiz.html">🧠 Cyber Quiz</a>
 <a href="scam.html">⚠️ Scam Detector</a>
 <a href="saeed.game.html" class="active">🎮 Saeed's Game</a>
</nav>

<main>
<div id="game-shell">

<!-- 🎧 INTRO -->
<div class="overlay" id="intro-overlay">
<div class="panel">
<h2>🎧 Welcome to Saeed's Story</h2>
<p>Press Play to listen before starting the game.</p>

<audio id="intro-audio" src="intro-voice.mp3"
       preload="auto" playsinline crossorigin="anonymous" muted>
</audio>

<button id="intro-btn">▶️ Play Audio</button>
<p id="intro-status" style="margin-top:10px;display:none;">🎙️ Playing now...</p>
</div>
</div>

<!-- HUD -->
<div class="hud">
<div class="hearts" id="hearts">❤️❤️❤️</div>
<div class="level-label" id="level-label">Level 1 · DMs</div>
</div>

<!-- GAME SCENE -->
<section id="scene">
  <div id="saeed-wrapper">
    <svg viewBox="0 0 120 220">
      <path id="mouth" d="M50 76 Q60 82 70 76" stroke="#b91c1c" stroke-width="2.4" stroke-linecap="round" fill="none"></path>
    </svg>
  </div>

  <div id="phone">
    <div class="phone-inner">
      <div class="phone-top">
        <span id="phone-title">DM</span><span style="font-size:0.7rem;">online</span>
      </div>
      <div class="phone-screen"><div id="phone-msg">...</div></div>
      <div class="choice-row">
        <button id="btn-safe"></button>
        <button id="btn-risk"></button>
      </div>
      <div id="phone-tip"></div>
    </div>
  </div>
</section>

<!-- LANGUAGE -->
<div class="overlay" id="lang-overlay" style="display:none;">
<div class="panel">
<h2>Choose language</h2>
<button id="lang-en">English</button>
<button id="lang-ar">العربية</button>
</div>
</div>

<!-- END -->
<div class="overlay" id="end-overlay" style="display:none;">
<div class="panel" id="end-panel"></div>
</div>

</div>
</main>

<script>
/* 🎧 AUDIO FIX — WORKS ON ALL DEVICES */
const introOverlay = document.getElementById("intro-overlay");
const introAudio = document.getElementById("intro-audio");
const introBtn = document.getElementById("intro-btn");
const introStatus = document.getElementById("intro-status");

introBtn.onclick = () => {
  introAudio.muted = false;         // required for iPhone
  introAudio.currentTime = 0;       // restart every time
  introAudio.play()
  .then(() => {
      introBtn.style.display = "none";
      introStatus.style.display = "block";
  })
  .catch(() => {
      introStatus.textContent = "🔈 Tap again to enable sound";
  });

  introAudio.onended = () => {
    introOverlay.style.display = "none";
    document.getElementById("lang-overlay").style.display = "flex";
  };
};

/* ---------------- GAME LOGIC ---------------- */

const scenarios = [
  {
    type:"dm", icon:"📱",
    title:{en:"Instagram DM",ar:"رسالة خاصة"},
    msg:{en:"A stranger asks for a personal photo. Send it?",ar:"شخص غريب يطلب صورة شخصية."},
    safe:{en:"Block & report",ar:"حظر و إبلاغ"},
    risky:{en:"Send photo",ar:"إرسال الصورة"},
    tipBad:{en:"Never share images with strangers.",ar:"لا ترسل الصور للغرباء."},
    levelLabel:{en:"Level 1 · DMs",ar:"المستوى ١ · الرسائل"}
  },
  {
    type:"email", icon:"✉️",
    title:{en:"Bank Email",ar:"رسالة بنك"},
    msg:{en:"Your account is frozen — click here to unlock.",ar:"تم تجميد حسابك البنكي — اضغط هنا."},
    safe:{en:"Use official app",ar:"استخدم تطبيق البنك"},
    risky:{en:"Click link",ar:"اضغط الرابط"},
    tipBad:{en:"Banks never ask via random links.",ar:"البنوك لا تطلب عبر روابط عشوائية."},
    levelLabel:{en:"Level 2 · Email",ar:"المستوى ٢ · بريد"}
  }
];

let current = 0, hearts = 3, lang = "en";
const heartsEl = document.getElementById("hearts");
const mouthEl = document.getElementById("mouth");

function update() {
  const s = scenarios[current];
  document.getElementById("phone-title").textContent = s.title[lang];
  document.getElementById("phone-msg").textContent = s.msg[lang];
  document.getElementById("btn-safe").textContent = s.safe[lang];
  document.getElementById("btn-risk").textContent = s.risky[lang];
  document.getElementById("phone-tip").textContent = "";
  document.getElementById("level-label").textContent = s.levelLabel[lang];
  mouthEl.setAttribute("d","M50 76 Q60 82 70 76");
}

function start() {
  hearts=3; current=0;
  heartsEl.textContent="❤️❤️❤️";
  update();
  document.getElementById("phone").classList.add("show");
}

function bad() { mouthEl.setAttribute("d","M50 78 Q60 72 70 78"); }

document.getElementById("btn-safe").onclick = () => {
  current++;
  if(current >= scenarios.length) {
    document.getElementById("end-overlay").style.display="flex";
    document.getElementById("end-panel").innerHTML = lang==="en" ?
      "<h2>🎉 You kept Saeed safe!</h2><button onclick='location.reload()'>Restart</button>" :
      "<h2>🎉 حميت سعيد!</h2><button onclick='location.reload()'>إعادة</button>";
  } else update();
};

document.getElementById("btn-risk").onclick = () => {
  hearts--;
  heartsEl.textContent = "❤️".repeat(hearts)+"🖤".repeat(3-hearts);
  document.getElementById("phone-tip").textContent = "❌ "+scenarios[current].tipBad[lang];
  bad();
  if(hearts <= 0){
    document.getElementById("end-overlay").style.display="flex";
    document.getElementById("end-panel").innerHTML = lang==="en" ?
      "<h2>💔 Saeed is unsafe</h2><button onclick='location.reload()'>Try Again</button>" :
      "<h2>💔 سعيد في خطر</h2><button onclick='location.reload()'>إعادة</button>";
  }
};

document.getElementById("lang-en").onclick=()=>{lang="en";start();document.getElementById("lang-overlay").style.display="none";}
document.getElementById("lang-ar").onclick=()=>{lang="ar";start();document.getElementById("lang-overlay").style.display="none";}
</script>

</body>
</html>
