<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Protect Saeed 🇦🇪</title>
<style>
body{margin:0;font-family:Arial;background:#0d1117;color:white;overflow:hidden;}
#toggleLang{position:absolute;top:10px;right:10px;padding:8px 13px;border:none;background:#1e293b;color:white;border-radius:8px;cursor:pointer;}

/* INTRO */
#intro{position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(9px);display:flex;align-items:center;justify-content:center;z-index:5;}
#introBox{background:rgba(255,255,255,0.2);padding:30px;border-radius:25px;width:350px;text-align:center;backdrop-filter:blur(12px);}
#introBtn{margin-top:15px;padding:12px 25px;border:none;border-radius:20px;font-size:17px;background:#16a34a;color:white;cursor:pointer;font-weight:bold;}
#credit{font-size:11px;margin-top:10px;opacity:0.8;}

#bg{width:100vw;height:100vh;background:url('https://i.imgur.com/9z0P4XE.jpg')center/cover no-repeat;position:relative;}
.palms{background:url('https://i.imgur.com/P1i0TLR.png') bottom/contain no-repeat;position:absolute;bottom:0;width:100%;height:100%;pointer-events:none;}

/* Saeed */
#saeed{width:150px;position:absolute;left:70px;bottom:110px;animation:walk 2s infinite alternate;}
@keyframes walk{0%{transform:translateX(-5px);}100%{transform:translateX(5px);}}
.hop{animation:hop .45s;}
@keyframes hop{0%{transform:translateY(0)}50%{transform:translateY(-30px)scale(1.05)}100%{transform:translateY(0)}}
#emoji{position:absolute;left:120px;bottom:250px;font-size:40px;display:none;}

/* Hearts */
#hearts{position:absolute;top:20px;left:20px;font-size:35px;}

/* PHONE */
#phone{background:white;color:black;width:300px;height:450px;border-radius:35px;position:absolute;right:50px;bottom:80px;padding:12px;overflow:hidden;}
#notch{width:110px;height:25px;background:black;border-radius:0 0 14px 14px;margin:0 auto;}
#messageArea{margin-top:20px;padding:15px;background:#f1f5f9;border-radius:12px;min-height:130px;}

.option{margin:12px 0;padding:10px;border:none;border-radius:12px;width:100%;font-weight:bold;cursor:pointer;}
.safe{background:#16a34a;color:white;}
.risky{background:#dc2626;color:white;}

/* vibration medium */
.vibrate{animation:shake .25s 3;}
@keyframes shake{0%{transform:translate(0)}25%{transform:translate(-3px)}50%{transform:translate(3px)}75%{transform:translate(-3px)}100%{transform:translate(0)}}
</style>
</head>
<body>

<button id="toggleLang">🇬🇧 EN</button>

<!-- INTRO -->
<div id="intro">
<div id="introBox">
<div id="introEN">
👋 <b>This is Saeed.</b><br><br>
He needs help learning online safety.<br><br>
🎮 Are you ready to protect him?
</div>
<div id="introAR" style="display:none;direction:rtl;text-align:right;">
👋 <b>هذا سعيد.</b><br><br>
يحتاج مساعدتك ليتعلم الأمان الرقمي.<br><br>
🎮 هل أنت مستعد لحمايته؟
</div>
<button id="introBtn">Start Adventure</button>
<div id="credit">✨ Created by Mariam for UAE cyber safety 💚</div>
</div>
</div>

<!-- GAME -->
<div id="bg" style="display:none;">
<div class="palms"></div>

<div id="hearts">❤️❤️❤️</div>

<svg id="saeed" viewBox="0 0 120 200">
<rect x="40" y="70" width="40" height="80" rx="10" fill="white"/>
<circle cx="60" cy="40" r="20" fill="#f4d6b0"/>
<path d="M35 25 Q60 5 85 25 L85 55 Q60 65 35 55Z" fill="white"/>
<ellipse cx="60" cy="22" rx="25" ry="6" fill="black"/>
<circle cx="50" cy="40" r="3" fill="#3b2915"/>
<circle cx="70" cy="40" r="3" fill="#3b2915"/>
<path id="mouth" d="M50 50 Q60 55 70 50" stroke="#a04c4c" stroke-width="3" fill="none"/>
</svg>

<div id="emoji"></div>

<div id="phone">
<div id="notch"></div>
<div id="messageArea"></div>
<button class="option safe" onclick="pick(true)">👍</button>
<button class="option risky" onclick="pick(false)">👎</button>
</div>
</div>

<script>
let lang="en";
document.getElementById("toggleLang").onclick=()=>{
lang=lang==="en"?"ar":"en";
document.getElementById("toggleLang").innerText=lang==="en"?"🇬🇧 EN":"🇦🇪 AR";
document.getElementById("introEN").style.display=lang==="en"?"block":"none";
document.getElementById("introAR").style.display=lang==="en"?"none":"block";
};

/* QUESTIONS */
const questions=[
{app:"Instagram", en:"Send a private photo?", ar:"إرسال صورة خاصة؟", correct:false},
{app:"WhatsApp", en:"I need money urgently", ar:"أحتاج مالًا بشكل عاجل", correct:false},
{app:"Email", en:"Login to fix your bank account", ar:"سجّل الدخول لإصلاح حسابك البنكي", correct:false},
{app:"TikTok", en:"Join my 18+ group?", ar:"انضم لمجموعتي +18؟", correct:false},
{app:"Browser", en:"Free iPhone! Claim prize!", ar:"آيفون مجاني! احصل على الجائزة!", correct:false},
{app:"Snapchat", en:"Swipe up for free gems", ar:"اسحب للأعلى للحصول على جواهر مجانية", correct:false},
{app:"WhatsApp", en:"Send your OTP code", ar:"أرسل رمز التحقق الخاص بك (OTP)", correct:false},
{app:"Instagram", en:"Where do you live?", ar:"أين تعيش؟", correct:false},
{app:"Email", en:"Invoice attached (unknown)", ar:"فاتورة مرفقة (غير معروفة)", correct:false},
{app:"Law", en:"Film strangers allowed?", ar:"هل يُسمح بتصوير الناس دون إذن؟", correct:false}
];

let hearts=3, index=0;
let used=[];

/* START GAME */
document.getElementById("introBtn").onclick=()=>{
document.getElementById("intro").style.display="none";
document.getElementById("bg").style.display="block";
nextQuestion();
};

/* SHOW NEXT */
function nextQuestion(){
if(used.length===10){return win();}
const p=document.getElementById("phone");
p.classList.remove("vibrate"); void p.offsetWidth; p.classList.add("vibrate");

let q;
do{q=questions[Math.floor(Math.random()*questions.length)];}
while(used.includes(q));

used.push(q);
index++;
document.getElementById("messageArea").innerHTML=
lang==="en"?`<b>${q.app}</b><br>${q.en}`:`<b>${q.app}</b><br>${q.ar}`;
}

/* ANSWER */
function pick(safe){
const q=used[used.length-1];
const emoji=document.getElementById("emoji");
if(safe===!q.correct){ // correct choice
document.getElementById("saeed").classList.add("hop");
emoji.innerText="😊"; emoji.style.display="block";
setTimeout(()=>emoji.style.display="none",700);
document.getElementById("saeed").classList.remove("hop");
nextQuestion();
}else{
hearts--;
document.getElementById("hearts").innerText="❤️".repeat(hearts);
emoji.innerText="😢"; emoji.style.display="block";
setTimeout(()=>emoji.style.display="none",700);
if(hearts<=0){lose();}
else nextQuestion();
}
}

/* ENDINGS */
function win(){
alert(lang==="en"?"✨ You helped Saeed — You're a hero!":"✨ لقد ساعدت سعيد — أنت بطل!");
location.reload();
}
function lose(){
alert(lang==="en"?"💔 Saeed got hurt — Try again.":"💔 تعرّض سعيد للخطر — حاول مجددًا");
location.reload();
}
</script>
</body>
</html>
