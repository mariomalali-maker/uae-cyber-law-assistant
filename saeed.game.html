<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saeed – Cyber Survival</title>

<style>
/* ================= RESET ================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

/* ================= BASE ================= */
body{
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  background:#020617;
  color:#e5e7eb;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ================= GAME SHELL ================= */
#game{
  width:100%;
  max-width:1000px;
  height:100%;
  max-height:680px;
  background:linear-gradient(180deg,#020617,#000);
  border-radius:24px;
  border:1px solid rgba(255,255,255,.08);
  position:relative;
  overflow:hidden;
}

/* ================= BACKGROUND ================= */
#bg{
  position:absolute; inset:0;
  background:
    radial-gradient(circle at 15% 10%, rgba(56,189,248,.12), transparent 40%),
    radial-gradient(circle at 85% 20%, rgba(244,114,182,.1), transparent 45%),
    linear-gradient(#020617,#000);
}

/* ================= HUD ================= */
#hud{
  position:absolute;
  top:12px; left:12px; right:12px;
  display:flex; justify-content:space-between;
  z-index:20;
}
.pill{
  background:rgba(15,23,42,.8);
  border:1px solid rgba(255,255,255,.1);
  border-radius:999px;
  padding:6px 14px;
  font-size:.85rem;
}
#dangerBar{
  width:100px; height:8px;
  background:#111827;
  border-radius:999px;
  overflow:hidden;
}
#dangerFill{
  height:100%;
  width:0%;
  background:#ef4444;
  transition:.3s;
}

/* ================= CHARACTER ================= */
#saeed{
  position:absolute;
  bottom:110px;
  left:18%;
  width:230px;
  z-index:10;
  animation:float 1.6s ease-in-out infinite;
}
@keyframes float{50%{transform:translateY(-6px)}}

.eye{animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
#mouth{transition:.2s}

/* ================= PHONE ================= */
#phone{
  position:absolute;
  right:6%;
  top:120px;
  width:330px;
  background:rgba(15,23,42,.95);
  border-radius:22px;
  border:1px solid rgba(255,255,255,.1);
  padding:16px;
  z-index:30;
}
.phone-top{
  display:flex; justify-content:space-between;
  font-size:.8rem; opacity:.8;
}
.bubble{
  background:#1e293b;
  padding:12px;
  border-radius:14px;
  margin:12px 0;
}
.buttons{display:flex; gap:10px}
button{
  flex:1; padding:10px;
  border:none; border-radius:12px;
  font-weight:700; cursor:pointer;
}
.safe{background:#22c55e;color:#022c22}
.risky{background:#fee2e2;color:#7f1d1d}

/* ================= OVERLAYS ================= */
.overlay{
  position:absolute; inset:0;
  background:rgba(2,6,23,.9);
  display:flex; justify-content:center; align-items:center;
  z-index:50;
}
.panel{
  background:#0f172a;
  border-radius:20px;
  padding:22px;
  max-width:440px;
  text-align:center;
  border:1px solid rgba(255,255,255,.1);
}

/* ================= MOBILE ================= */
@media(max-width:760px){
  #saeed{left:50%;transform:translateX(-50%);bottom:300px}
  #phone{left:50%;right:auto;top:auto;bottom:20px;transform:translateX(-50%);width:90%}
}
</style>
</head>

<body>
<div id="game">
<div id="bg"></div>

<!-- HUD -->
<div id="hud">
  <div class="pill" id="level">Level 1 / 8</div>
  <div class="pill">❤️ <span id="hearts">3</span></div>
  <div id="dangerBar"><div id="dangerFill"></div></div>
</div>

<!-- CHARACTER -->
<div id="saeed">
<svg viewBox="0 0 200 300">
  <circle cx="100" cy="70" r="40" fill="#fde68a"/>
  <circle class="eye" cx="88" cy="68" r="4"/>
  <circle class="eye" cx="112" cy="68" r="4"/>
  <path id="mouth" d="M85 90 Q100 100 115 90" stroke="#b91c1c" stroke-width="4" fill="none"/>
  <rect x="60" y="120" width="80" height="120" rx="28" fill="#f9fafb"/>
</svg>
</div>

<!-- PHONE -->
<div id="phone">
  <div class="phone-top">
    <span>📱 Chat</span>
    <span>online</span>
  </div>
  <div class="bubble" id="question"></div>
  <div class="buttons">
    <button class="safe" id="safeBtn"></button>
    <button class="risky" id="riskBtn"></button>
  </div>
</div>

<!-- INTRO -->
<div class="overlay" id="intro">
<div class="panel">
  <h2 id="introTitle">Meet Saeed</h2>
  <p id="introText">Help Saeed survive the internet.</p>
  <audio id="introAudio" src="intro-voice.mp3"></audio>
  <button class="safe" onclick="playStory()">▶ Play Story</button>
</div>
</div>

<!-- LANGUAGE -->
<div class="overlay" id="lang" style="display:none">
<div class="panel">
  <h2>Choose Language</h2>
  <button class="safe" onclick="setLang('en')">English</button><br><br>
  <button class="safe" onclick="setLang('ar')">العربية</button>
</div>
</div>

<!-- END -->
<div class="overlay" id="end" style="display:none">
<div class="panel" id="endBox"></div>
</div>

</div>

<script>
let lang="en",idx=0,hearts=3,danger=0;

const text={
en:{
introTitle:"Meet Saeed",
introText:"Help Saeed survive the internet.",
win:"You kept Saeed safe!",
lose:"Game Over"
},
ar:{
introTitle:"هذا سعيد",
introText:"ساعد سعيد على النجاة في الإنترنت",
win:"حميت سعيد!",
lose:"انتهت اللعبة"
}
};

const levels=[
{q:{en:"A stranger asks for a private photo.",ar:"شخص غريب يطلب صورة خاصة"},s:{en:"Block & report",ar:"حظر وتبليغ"},r:{en:"Send photo",ar:"إرسال"},lose:true},
{q:{en:"Someone asks your school name.",ar:"شخص يسأل عن مدرستك"},s:{en:"Keep private",ar:"عدم الإجابة"},r:{en:"Tell them",ar:"إخبارهم"},lose:false},
{q:{en:"Bank email with a link.",ar:"إيميل بنك فيه رابط"},s:{en:"Use official app",ar:"استخدم التطبيق"},r:{en:"Click link",ar:"اضغط الرابط"},lose:true},
{q:{en:"Friend sends weird link.",ar:"صديق يرسل رابط غريب"},s:{en:"Ask first",ar:"اسأل أولاً"},r:{en:"Click",ar:"اضغط"},lose:false},
{q:{en:"Free WiFi asks login.",ar:"واي فاي يطلب تسجيل دخول"},s:{en:"Use mobile data",ar:"بيانات الهاتف"},r:{en:"Login",ar:"تسجيل"},lose:false},
{q:{en:"You won a prize popup.",ar:"نافذة ربح جائزة"},s:{en:"Close it",ar:"إغلاق"},r:{en:"Download",ar:"تحميل"},lose:true},
{q:{en:"New account wants your number.",ar:"حساب جديد يطلب رقمك"},s:{en:"Say no",ar:"رفض"},r:{en:"Give number",ar:"إعطاء"},lose:false},
{q:{en:"Someone threatens you.",ar:"شخص يهددك"},s:{en:"Save & tell adult",ar:"حفظ وإبلاغ"},r:{en:"Reply angrily",ar:"الرد"},lose:true}
];

function playStory(){
  const a=document.getElementById("introAudio");
  a.play();
  a.onended=()=>{document.getElementById("intro").style.display="none";document.getElementById("lang").style.display="flex";}
}

function setLang(l){
  lang=l;
  document.getElementById("lang").style.display="none";
  start();
}

function start(){
  idx=0; hearts=3; danger=0;
  render();
}

function render(){
  const L=levels[idx];
  document.getElementById("question").textContent=L.q[lang];
  document.getElementById("safeBtn").textContent=L.s[lang];
  document.getElementById("riskBtn").textContent=L.r[lang];
  document.getElementById("level").textContent=`Level ${idx+1} / 8`;
  document.getElementById("hearts").textContent=hearts;
  document.getElementById("dangerFill").style.width=`${danger}%`;
}

safeBtn.onclick=()=>{idx++; idx>=8?end(true):render();};
riskBtn.onclick=()=>{
  danger+=12;
  if(levels[idx].lose){hearts--;}
  if(hearts<=0){end(false);return;}
  idx++; idx>=8?end(true):render();
};

function end(win){
  document.getElementById("end").style.display="flex";
  endBox.innerHTML=`<h2>${text[lang][win?"win":"lose"]}</h2><button onclick="location.reload()">Restart</button>`;
}
</script>
</body>
</html>
