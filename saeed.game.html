<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎮 Saeed's Cyber Safety Game</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(#001220, #012f46);
    height: 100vh;
    margin: 0;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  nav {
    width: 100%;
    background: rgba(0,0,0,0.4);
    padding: 10px;
    display: flex;
    justify-content: center;
    gap: 20px;
  }

  nav a {
    color: white; text-decoration: none; font-weight: bold;
  }

  #game-area {
    margin-top: 20px;
    text-align: center;
  }

  #saeed {
    margin: 25px auto;
  }

  .phone {
    background: #0f172a;
    width: 230px;
    height: 340px;
    border-radius: 20px;
    padding: 20px;
    margin: 20px auto;
    border: 3px solid #475569;
  }

  .message-box {
    background: #1e293b;
    height: 140px;
    border-radius: 10px;
    padding: 10px;
    overflow: auto;
    font-size: 14px;
  }

  .choices button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }

  .safe { background: #15803d; color: white; }
  .risk { background: #b91c1c; color: white; }

  #next-btn {
    margin-top: 10px;
    padding: 10px;
    background: #2563eb;
    border: none;
    border-radius: 8px;
    display: none;
  }

  .heart {
    color: red; font-size: 20px; margin: 5px;
  }

  /* Eyes blink */
  .eye { animation: blink 4s infinite; }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }
</style>
</head>

<body>

<nav>
  <a href="index.html">🏠 Home</a>
  <a href="chat.html">💬 Chat</a>
  <a href="quiz.html">🎯 Cyber Quiz</a>
  <a href="scam.html">⚠️ Scam Detector</a>
  <a href="saeed.game.html" style="text-decoration:underline;">🎮 Saeed's Game</a>
</nav>

<div id="game-area">
  <h2>🎮 Help Saeed Stay Safe Online!</h2>
  <div id="hearts">❤️❤️❤️</div>

  <!-- ⭐ SAEED SVG -->
  <svg viewBox="0 0 200 300" width="180" id="saeed">
    <ellipse cx="100" cy="290" rx="32" ry="10" fill="#0a0a0a75"/>
    <circle cx="100" cy="90" r="38" fill="#fce7c9"/>
    <ellipse cx="100" cy="58" rx="38" ry="12" fill="#222" />
    <path d="M60 70 Q100 30 140 70 L140 150 Q120 160 100 160 Q80 160 60 150 Z" fill="white"/>

    <circle cx="82" cy="92" r="6" fill="#3b2915" class="eye"/>
    <circle cx="118" cy="92" r="6" fill="#3b2915" class="eye"/>
    <path id="mouth" d="M82 108 Q100 118 118 108" stroke="#a04c4c" stroke-width="4" fill="none"/>
  </svg>

  <div class="phone">
    <div class="message-box" id="msg">📩 Loading...</div>

    <div class="choices">
      <button class="safe" id="btnSafe">Safe Choice</button>
      <button class="risk" id="btnRisk">Risky Choice</button>
    </div>
    <button id="next-btn">➡️ Next</button>
  </div>
</div>

<script>
let level = 0;
let hearts = 3;

const messages = [
  "Someone you don't know sent: 'Hey pretty, can I talk to you privately?'",
  "A link: 'Claim your 10,000 AED prize now! 😍 click 👉 scam.ae-win.com'",
  "A friend: 'Send me your Snapchat login code, I got locked out!'",
  "Instagram: '@BrandPartnerUAE' wants you to post pics for pay",
];

function loadLevel() {
  if (hearts <= 0) return endGame("Game Over 💔");
  if (level >= messages.length) return endGame("🎉 YOU WON! Saeed is safe!");

  document.getElementById("msg").textContent = messages[level];
  document.getElementById("next-btn").style.display = "none";
  
  // Reset mouth
  document.getElementById("mouth").setAttribute("d", "M82 108 Q100 118 118 108");
}

function endGame(text) {
  document.getElementById("msg").textContent = text;
  document.getElementById("btnSafe").style.display = "none";
  document.getElementById("btnRisk").style.display = "none";
  document.getElementById("next-btn").style.display = "none";
}

function updateHearts() {
  document.getElementById("hearts").innerHTML = "❤️".repeat(hearts);
}

document.getElementById("btnSafe").addEventListener("click", () => {
  document.getElementById("mouth").setAttribute("d","M82 108 Q100 118 118 108");
  level++;
  document.getElementById("next-btn").style.display = "block";
});

document.getElementById("btnRisk").addEventListener("click", () => {
  document.getElementById("mouth").setAttribute("d","M82 110 Q100 96 118 110");
  hearts--;
  updateHearts();
  level++;
  document.getElementById("next-btn").style.display = "block";
});

document.getElementById("next-btn").addEventListener("click", loadLevel);

updateHearts();
loadLevel();
</script>

</body>
</html>
