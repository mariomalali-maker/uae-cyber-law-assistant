<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Saeed's Cyber Safety Game 🇦🇪</title>

<style>
/* -------- GENERAL -------- */
body { margin:0; background:#0d1117; color:white; font-family:Arial; display:flex; flex-direction:column; align-items:center; }
nav { width:100%; background:#00000055; padding:10px; display:flex; gap:20px; justify-content:center; }
nav a { color:white; text-decoration:none; font-weight:bold; }
nav a.active { color:#22c55e; }
#toggleLang { position:absolute; top:10px; right:10px; padding:8px 13px; border:none; background:#1e293b; color:white; border-radius:8px; cursor:pointer; }

/* -------- GAME CONTAINER -------- */
#container {
  background:url("https://i.imgur.com/9z0P4XE.jpg") center/cover no-repeat;
  width:900px; height:500px; border-radius:20px; margin-top:20px;
  position:relative; overflow:hidden; box-shadow:0 0 20px #000;
}
#corniche-sign { position:absolute; left:20px; top:20px; background:#22c55e; padding:6px 12px; font-weight:bold; border-radius:6px; color:black; }

/* -------- SAEED -------- */
#saeed { width:150px; position:absolute; left:80px; bottom:70px; animation:breathe 3s infinite; }
@keyframes breathe { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);} }
.hop { animation:hop 0.4s; }
@keyframes hop { 0%{transform:translateY(0);} 50%{transform:translateY(-25px) scale(1.05);} 100%{transform:translateY(0);} }

/* -------- PHONE UI -------- */
.phone {
  background:#0f172add; width:320px; height:420px;
  border-radius:30px; padding:15px; border:3px solid #475569;
  position:absolute; right:80px; bottom:50px; cursor:pointer;
  display:flex; flex-direction:column; gap:10px;
}
#phone-top { display:flex; align-items:center; gap:10px; }
#phone-top img { width:22px; }
#dm-screen { background:#1e293b; height:180px; border-radius:10px; padding:12px; overflow-y:auto; border:1px solid #334155; }
.dm-msg { max-width:80%; background:#E5E7EB; color:#000; padding:8px 12px; border-radius:12px; margin:5px 0; font-size:14px; }

.choice-btn {
  width:100%; padding:12px; border:none; font-weight:bold; border-radius:8px;
  cursor:pointer; color:white; font-size:15px; transition:0.2s;
}
.choice-btn:active { transform:scale(0.96); }
.safe{background:#15803d;} .risky{background:#b91c1c;} .neutral{background:#64748b;}

#hearts { margin-top:10px; font-size:26px; }
</style>
</head>
<body>

<button id="toggleLang">🇬🇧 EN</button>

<nav>
  <a href="index.html">🏠 Home</a>
  <a href="chat.html">💬 Chat</a>
  <a href="quiz.html">🎯 Quiz</a>
  <a href="scam.html">⚠️ Scam</a>
  <a href="saeed.game.html" class="active">🎮 Game</a>
</nav>

<div id="container">

  <div id="corniche-sign">Corniche → Abu Dhabi</div>

  <!-- SAEED -->
  <svg id="saeed" viewBox="0 0 120 200">
    <rect x="40" y="70" width="40" height="80" rx="10" fill="white"/>
    <rect x="50" y="140" width="20" height="12" rx="5" fill="#ddd"/> <!-- phone -->
    <rect x="45" y="150" width="15" height="8" rx="3" fill="black"/>
    <rect x="60" y="150" width="15" height="8" rx="3" fill="black"/>
    <circle cx="60" cy="40" r="20" fill="#f4d6b0"/>
    <path d="M35 25 Q60 5 85 25 L85 55 Q60 65 35 55Z" fill="white"/>
    <ellipse cx="60" cy="22" rx="25" ry="6" fill="black"/>
    <circle cx="50" cy="40" r="3" fill="#3b2915"/>
    <circle cx="70" cy="40" r="3" fill="#3b2915"/>
    <path id="mouth" d="M50 50 Q60 55 70 50" stroke="#a04c4c" stroke-width="3" fill="none"/>
  </svg>

  <!-- PHONE -->
  <div class="phone" id="phone">
    <div id="phone-top">
      <img id="phone-logo" src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
      <span id="dm-user">Instagram User</span>
      <span style="margin-left:auto;opacity:.6;font-size:12px">online</span>
    </div>

    <div id="dm-screen">
      <div class="dm-msg" id="dm-msg">📱 Tap to Start</div>
    </div>

    <button id="opt1" class="choice-btn safe" style="display:none;"></button>
    <button id="opt2" class="choice-btn risky" style="display:none;"></button>
  </div>
</div>

<div id="hearts">❤️❤️❤️</div>

<!-- Optional Sounds -->
<audio id="ding"></audio>
<audio id="correct"></audio>
<audio id="wrong"></audio>


<script>
/* ---------- GAME LOGIC ---------- */
let lang="en", started=false, level=0, hearts=3;

const text={
en:{
start:`📱 You are Saeed's **Cyber Safety Advisor**.\nHelp him stay safe.\nTap the phone to begin.`,
win:`🎉 YOU WON! Saeed is protected!`,
lose:`💔 GAME OVER — Try again.`,
again:`Tap phone to restart 🎮`,
questions:[
["Instagram DM: 'send a private pic? 🤭'","🚫 Block & Report","💬 Reply (unsafe)"],
["Bank message: 'Click to unlock'","📱 Use official bank app","🔗 Click unknown link"],
["'Wallah send OTP please'","❌ Never share codes","📩 Send OTP"],
["You won 20,000 AED!","🚫 Ignore & report","🎁 Claim prize"],
["Job: send passport","🚫 Decline & report","🛂 Send passport"],
["We hacked you, pay now","📢 ecrime.ae report","💸 Pay them"],
["Download for VIP free","✔ Only app store","⬇️ Download file"],
["Unknown caller asks info","🛑 Don't share","📞 Tell info"],
["Email looks like GOV","Check official domain","Reply"],
["Final test","✔ Verify source","Respond to all"]
]},
ar:{
start:`📱 أنت **مستشار الأمن الرقمي** لسعيد.\nساعده بالأمان.\nاضغط للبدء.`,
win:`🎉 فزت! سعيد آمن`,
lose:`💔 انتهت المحاولة`,
again:`اضغط لإعادة اللعب 🎮`,
questions:[
["انستغرام: أرسل صورة خاصة؟","🚫 حظر و إبلاغ","💬 الرد وإرسال"],
["رسالة بنك غير رسمية","📱 دخول التطبيق الرسمي","🔗 فتح الرابط"],
["أرسل رمز OTP","❌ لا تشارك الرموز","📩 إرسال الرمز"],
["ربحت ٢٠,٠٠٠ درهم","🚫 تجاهل و إبلاغ","🎁 المطالبة"],
["نريد جوازك للعمل","🚫 الرفض والإبلاغ","🛂 إرسال الجواز"],
["ادفع وإلا ننشر","📢 إبلاغ ecrime.ae","💸 الدفع"],
["VIP مجاني: حمل هذا","✔ من المتجر فقط","⬇️ تحميل"],
["مكالمة تطلب معلومات","🛑 عدم مشاركة","📞 مشاركة"],
["إيميل من جهة غريبة","التحقق من الرسمي","الرد"],
["الأخير","✔ التحقق من المصدر","الرد على الجميع"]
]}
};


function show(t){ document.getElementById("dm-msg").innerText=t; }

document.getElementById("phone").onclick=()=>{
if(!started){ started=true; show(text[lang].start); setTimeout(update,1000); }
};

function update(){
if(hearts<=0) return end(text[lang].lose);
if(level>=text[lang].questions.length) return end(text[lang].win);

let q=text[lang].questions[level];
show(q[0]);
opt1.textContent=q[1]; opt2.textContent=q[2];
opt1.style.display="block"; opt2.style.display="block";
mouth.setAttribute("d","M50 50 Q60 55 70 50");
}

opt1.onclick=()=>{ // SAFE
saeed.classList.add("hop"); setTimeout(()=>saeed.classList.remove("hop"),400);
mouth.setAttribute("d","M50 48 Q60 62 70 48");
level++; update();
};

opt2.onclick=()=>{ // UNSAFE
hearts--; document.getElementById("hearts").textContent="❤️".repeat(hearts);
mouth.setAttribute("d","M50 55 Q60 45 70 55");
level++; update();
};

function end(msg){
show(msg+"\n\n"+text[lang].again);
opt1.style.display="none"; opt2.style.display="none";
level=0; hearts=3; started=false;
}

document.getElementById("toggleLang").onclick=()=>{
lang = lang==="en"?"ar":"en";
document.getElementById("toggleLang").textContent = lang==="en"?"🇬🇧 EN":"🇦🇪 AR";
show(text[lang].start);
};
</script>
</body>
</html>
