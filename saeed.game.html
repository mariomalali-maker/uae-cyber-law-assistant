<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saeed's Cyber Safety Game</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
    background: #020617;
    color: #e5e7eb;
  }

  /* NAV */
  nav {
    display: flex;
    gap: 12px;
    padding: 10px 16px;
    background: #020617;
    border-bottom: 1px solid #0f172a;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  nav a {
    text-decoration: none;
    color: #e5e7eb;
    font-size: 0.9rem;
    padding: 6px 10px;
    border-radius: 999px;
  }
  nav a:hover { background: #0b1120; }
  nav .active { background: #22c55e; color: #022c22; }

  /* GAME SHELL */
  #game-shell {
    max-width: 1000px;
    margin: 16px auto;
    padding: 20px;
  }

  #game-card {
    position: relative;
    background: #020617;
    border-radius: 24px;
    border: 1px solid #1f2937;
    padding: 16px 20px 20px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.8);
    overflow: hidden;
  }

  /* HUD */
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 0.9rem;
  }

  #hearts {
    font-size: 1.3rem;
  }

  #level-pill {
    padding: 4px 10px;
    border-radius: 999px;
    background: #064e3b;
    color: #bbf7d0;
  }

  /* SCENE */
  #scene {
    position: relative;
    height: 420px;
    background: radial-gradient(circle at top, #020617 0, #020617 58%, #000 100%);
    border-radius: 18px;
    overflow: hidden;
  }

  .city-tower {
    position: absolute;
    bottom: 130px;
    width: 70px;
    border-radius: 24px 24px 0 0;
    background: linear-gradient(#1f2937, #020617);
    box-shadow: 0 0 40px rgba(15,23,42,0.9);
  }

  .city-tower::after {
    content: "";
    position: absolute;
    top: 12px;
    left: 14px;
    right: 14px;
    height: 3px;
    border-radius: 999px;
    background: rgba(148,163,184,0.7);
  }

  .sea-strip {
    position: absolute;
    left: 0; right: 0;
    bottom: 110px;
    height: 60px;
    background: linear-gradient(90deg, #0ea5e9, #22c55e, #0ea5e9);
    opacity: 0.35;
  }

  .palm-trunk {
    position: absolute;
    bottom: 108px;
    width: 18px;
    height: 80px;
    background: #020617;
    border-radius: 10px;
  }
  .palm-trunk::after {
    content: "";
    position: absolute;
    top: -10px;
    left: -18px;
    right: -18px;
    height: 30px;
    border-radius: 999px;
    background: radial-gradient(circle at 50% 100%, #22c55e 0, #166534 70%, transparent 75%);
  }

  .road {
    position: absolute;
    left: 0; right: 0;
    bottom: 40px;
    height: 80px;
    background: #020617;
    box-shadow: 0 -14px 40px rgba(0,0,0,1) inset;
  }

  .lane {
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    height: 4px;
    transform: translateY(-50%);
    background-image: repeating-linear-gradient(
      to right,
      rgba(248,250,252,0.9),
      rgba(248,250,252,0.9) 32px,
      transparent 32px,
      transparent 64px
    );
    opacity: 0.8;
  }

  /* SAeed */
  #saeed {
    position: absolute;
    left: 14%;
    bottom: 80px;
    width: 150px;
    height: 240px;
    animation: saeed-bounce 1.4s ease-in-out infinite;
    transform-origin: center bottom;
  }

  #saeed-inner {
    width: 100%;
    height: 100%;
  }

  @keyframes saeed-bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .eye {
    transform-origin: center;
    animation: blink 4s infinite;
  }

  @keyframes blink {
    0%,92%,100% { transform: scaleY(1); }
    95% { transform: scaleY(0.15); }
  }

  .mouth {
    transition: d 0.25s ease;
  }

  /* reaction animations */
  .happy-jump {
    animation: happyJump 0.4s ease;
  }
  @keyframes happyJump {
    0% { transform: translateY(0); }
    30% { transform: translateY(-12px); }
    60% { transform: translateY(0); }
    100% { transform: translateY(-4px); }
  }

  .sad-shake {
    animation: sadShake 0.45s ease;
  }
  @keyframes sadShake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    50% { transform: translateX(4px); }
    75% { transform: translateX(-4px); }
    100% { transform: translateX(0); }
  }

  /* PHONE */
  #phone {
    position: absolute;
    right: 10%;
    bottom: 90px;
    width: 300px;
    max-width: 88vw;
    background: #020617;
    border: 2px solid #020617;
    border-radius: 26px;
    padding: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.9);
    opacity: 0;
    transform: scale(0.3);
    pointer-events: none;
  }

  #phone.show {
    animation: phone-pop 0.35s ease-out forwards;
  }

  @keyframes phone-pop {
    0% { opacity: 0; transform: scale(0.3) translate(30px,40px); }
    100% { opacity: 1; transform: scale(1) translate(0,0); }
  }

  .phone-inner {
    background: #020617;
    border-radius: 20px;
    border: 1px solid #1f2937;
    padding: 8px 8px 10px;
  }

  .phone-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.78rem;
    color: #9ca3af;
    margin-bottom: 6px;
  }

  .phone-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .phone-avatar {
    width: 20px;
    height: 20px;
    border-radius: 999px;
    background: #0ea5e9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
  }

  .phone-screen {
    background: #020617;
    border-radius: 14px;
    border: 1px solid #111827;
    padding: 8px;
    min-height: 90px;
    margin-bottom: 8px;
  }

  .chat-area {
    max-height: 110px;
    overflow-y: auto;
  }

  .bubble-in {
    display: inline-block;
    padding: 7px 9px;
    border-radius: 12px 12px 12px 4px;
    background: #111827;
    color: #f9fafb;
    font-size: 0.8rem;
    margin-bottom: 6px;
    max-width: 100%;
    word-wrap: break-word;
  }

  .bubble-system {
    font-size: 0.7rem;
    color: #9ca3af;
    margin-bottom: 4px;
  }

  /* email style box */
  .email-box {
    background: #020617;
    border-radius: 10px;
    border: 1px solid #1f2937;
    padding: 7px 8px;
    font-size: 0.8rem;
    margin-bottom: 6px;
  }

  .email-sub {
    font-weight: 600;
    margin-bottom: 2px;
  }
  .email-from {
    font-size: 0.7rem;
    color: #9ca3af;
    margin-bottom: 4px;
  }

  .choice-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .opt-btn {
    border-radius: 999px;
    border: none;
    padding: 8px 10px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .opt-safe { background: #22c55e; color: #022c22; }
  .opt-mid { background: #facc15; color: #1f2937; }
  .opt-risk { background: #fee2e2; color: #7f1d1d; }

  .phone-tip {
    margin-top: 4px;
    font-size: 0.72rem;
    color: #9ca3af;
  }

  /* OVERLAYS */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 30;
  }

  .panel {
    background: #020617;
    border-radius: 20px;
    padding: 18px 18px 16px;
    border: 1px solid #1f2937;
    width: min(420px, 92vw);
    text-align: center;
  }

  .panel h2 {
    margin-bottom: 6px;
    font-size: 1.25rem;
  }

  .panel p {
    margin: 4px 0;
    font-size: 0.88rem;
    color: #9ca3af;
  }

  .panel button {
    width: 100%;
    border-radius: 999px;
    border: none;
    padding: 9px 10px;
    font-size: 0.9rem;
    cursor: pointer;
    margin-top: 10px;
  }

  .btn-en { background: #22c55e; color: #022c22; }
  .btn-ar { background: #f3f4f6; color: #020617; }

  #end-overlay { display: none; }

  @media (max-width: 700px) {
    #saeed {
      left: 8%;
      width: 130px;
    }
    #phone {
      right: 4%;
      width: 260px;
    }
  }
</style>
</head>

        ar: "الصفحات المزيفة تسرق كلمات المرور. استخدم الروابط المحفوظة أو التطبيقات الرسمية لحسابات المدرسة."

  let currentIndex = 0;
  let hearts = 3;
  let lang = "en";

  const heartsEl = document.getElementById("hearts");
  const levelPill = document.getElementById("level-pill");
  const phone = document.getElementById("phone");
  const chatArea = document.getElementById("chat-area");
  const avatarEl = document.getElementById("phone-avatar");
  const titleEl = document.getElementById("phone-title");
  const tipEl = document.getElementById("phone-tip");
  const btnSafe = document.getElementById("btn-safe");
  const btnMid = document.getElementById("btn-mid");
  const btnRisk = document.getElementById("btn-risk");
  const saeedInner = document.getElementById("saeed-inner");
  const mouth = document.getElementById("mouth");
  const introOverlay = document.getElementById("intro-overlay");
  const endOverlay = document.getElementById("end-overlay");
  const endTitle = document.getElementById("end-title");
  const endText = document.getElementById("end-text");

  function updateHUD() {
    heartsEl.textContent = "❤️".repeat(hearts) + "🖤".repeat(3 - hearts);
    const lvl = levels[currentIndex];
    levelPill.textContent = lvl.levelLabel[lang];
  }

  function setMouthHappy() {
    mouth.setAttribute("d", "M50 76 Q60 82 70 76");
  }

  function setMouthSad() {
    mouth.setAttribute("d", "M50 78 Q60 72 70 78");
  }

  function clearReactions() {
    saeedInner.classList.remove("happy-jump", "sad-shake");
  }

  function playHappy() {
    clearReactions();
    setMouthHappy();
    saeedInner.classList.add("happy-jump");
    setTimeout(clearReactions, 450);
  }

  function playSad() {
    clearReactions();
    setMouthSad();
    saeedInner.classList.add("sad-shake");
    setTimeout(clearReactions, 450);
  }

  function renderLevel() {
    const lvl = levels[currentIndex];
    updateHUD();
    phone.classList.remove("show");
    void phone.offsetWidth; // restart animation
    phone.classList.add("show");

    avatarEl.textContent = lvl.icon;
    titleEl.textContent = lvl.title[lang];

    chatArea.innerHTML = `
      <div class="bubble-system">${lvl.system[lang]}</div>
      ${lvl.type === "email"
        ? `<div class="email-box">
             <div class="email-from">${lang === "en" ? "From: unknown sender" : "من: مرسل غير معروف"}</div>
             <div class="email-sub">${lvl.title[lang]}</div>
             <div>${lvl.msg[lang].replace(/\n/g, "<br>")}</div>
           </div>`
        : `<div class="bubble-in">${lvl.msg[lang]}</div>`
      }
    `;

    btnSafe.textContent = lvl.safe[lang];
    btnRisk.textContent = lvl.risky[lang];
    tipEl.textContent = "";
    if (lvl.mid) {
      btnMid.style.display = "block";
      btnMid.textContent = lvl.mid[lang];
    } else {
      btnMid.style.display = "none";
    }
  }

  function handleAnswer(type) {
    const lvl = levels[currentIndex];

    if (type === "risk") {
      hearts--;
      playSad();
      tipEl.textContent = "❌ " + lvl.badTip[lang];
    } else {
      // safe or mid
      playHappy();
      tipEl.textContent = lang === "en"
        ? "✅ Nice choice! That keeps Saeed safer online."
        : "✅ اختيار ممتاز! هذا يحمي سعيد أكثر على الإنترنت.";
    }

    updateHUD();

    if (hearts <= 0) {
      setTimeout(() => endGame(false), 900);
      return;
    }

    // move to next only once reaction is seen
    setTimeout(() => {
      currentIndex++;
      if (currentIndex >= levels.length) {
        endGame(true);
      } else {
        renderLevel();
      }
    }, 1100);
  }

  function endGame(win) {
    endOverlay.style.display = "flex";
    if (win) {
      endTitle.textContent = lang === "en"
        ? "You kept Saeed safe! 🎉"
        : "حميت سعيد! 🎉";
      endText.textContent = lang === "en"
        ? "You made strong cyber safety choices. Keep using what you learned in real life when you chat, play, or get emails."
        : "اخترت قرارات آمنة تحمي سعيد. استخدم نفس الأفكار في حياتك الحقيقية لما تدردش أو تلعب أو تستقبل إيميلات.";
    } else {
      endTitle.textContent = lang === "en"
        ? "Game over ⚠️"
        : "انتهت اللعبة ⚠️";
      endText.textContent = lang === "en"
        ? "Saeed ran out of hearts because of risky choices. It’s okay – try again and choose safer options next time."
        : "سعيد خسر كل القلوب بسبب قرارات خطرة. عادي، العب مرة ثانية و جرّب تختار خيارات أكثر أمانًا.";
    }
  }

  function startGame(selectedLang) {
    lang = selectedLang;
    introOverlay.style.display = "none";
    currentIndex = 0;
    hearts = 3;
    setMouthHappy();
    renderLevel();
  }

  btnSafe.addEventListener("click", () => handleAnswer("safe"));
  btnMid.addEventListener("click", () => handleAnswer("mid"));
  btnRisk.addEventListener("click", () => handleAnswer("risk"));

  // end overlay hidden by default
  endOverlay.style.display = "none";
</script>
