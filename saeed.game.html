<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saeed's Cyber Safety Game</title>

<style>
/* ---------- GLOBAL ---------- */
*{box-sizing:border-box;margin:0;padding:0}
body{
background:#020617;
font-family:system-ui;
color:#fff;
overflow-x:hidden;
}

/* ---------- NAV ---------- */
nav{
display:flex;gap:12px;padding:12px 16px;
background:#020617;border-bottom:1px solid #0f172a;
position:sticky;top:0;z-index:10;
}
nav a{text-decoration:none;color:#e5e7eb;padding:6px 10px;border-radius:8px}
nav a:hover{background:#0b1120}
nav .active{background:#22c55e;color:#022c22}

/* ---------- GAME SHELL ---------- */
#game{
max-width:900px;margin:auto;margin-top:14px;
background:#0f172a;border:1px solid #1e293b;
border-radius:16px;overflow:hidden;
}
.header{
display:flex;justify-content:space-between;
padding:12px 16px;background:#0f172a;
font-size:14px;
}
.hearts{font-size:20px}
#scene{position:relative;height:420px;background:#020617;}

/* ---------- SAEED (same animation) ---------- */
#saeed{
position:absolute;bottom:80px;left:12%;
width:160px;height:240px;
animation:bounce 1.4s infinite;
}
@keyframes bounce{50%{transform:translateY(-6px)}}

.eye{animation:blink 4s infinite;transform-origin:center}
@keyframes blink{95%{transform:scaleY(.1)}}

.mouth-worry{d:path("M50 78 Q60 72 70 78")}
.mouth-happy{d:path("M50 76 Q60 82 70 76")}

/* ---------- PHONE ---------- */
#phone{
position:absolute;right:6%;bottom:80px;
width:300px;max-width:88vw;
background:#020617;border:2px solid #1e293b;
border-radius:24px;padding:10px;
opacity:0;transform:scale(.3);
pointer-events:none;animation:pop .4s forwards ease;
}
@keyframes pop{to{opacity:1;transform:scale(1)}}

.phone-header{display:flex;justify-content:space-between;
font-size:13px;color:#9ca3af;margin-bottom:6px}

.chat-area{
background:#0b1120;border-radius:12px;padding:10px;
height:130px;overflow-y:auto;
}

/* WhatsApp style bubbles */
.bubble-in{
background:#1e293b;color:white;
padding:7px 11px;border-radius:12px 12px 12px 4px;
margin-bottom:6px;font-size:14px;max-width:80%;
}
.bubble-out{
background:#22c55e;color:#022c22;
padding:7px 11px;border-radius:12px 12px 4px 12px;
margin-bottom:6px;font-size:14px;margin-left:auto;max-width:80%;
}

/* email mode */
.email-box{
border:1px solid #1e293b;border-radius:10px;
padding:8px;font-size:14px;background:#0b1120;
margin-bottom:8px;
}

/* ---------- CHOICE BUTTONS ---------- */
.opt-btn{
margin-top:6px;width:100%;padding:8px 10px;
border-radius:999px;border:none;font-size:14px;
cursor:pointer;text-align:center;
}
.safe{background:#22c55e;color:#022c22}
.risk{background:#fee2e2;color:#7f1d1d}
.mid{background:#facc15;color:#1a1818}

/* ---------- LANGUAGE SCREEN ---------- */
#lang-screen,#end-screen{
position:fixed;inset:0;background:rgba(0,0,0,.85);
display:flex;justify-content:center;align-items:center;
z-index:100;
}
.panel{
background:#020617;border-radius:20px;padding:20px;
width:90%;max-width:400px;text-align:center;
border:1px solid #1f2937;
}
.panel button{
width:100%;margin-top:10px;padding:10px;
border-radius:999px;border:none;font-size:16px;cursor:pointer;
}
.en{background:#22c55e;color:#022c22}
.ar{background:#fff;color:#000}
</style>
</head>

<body>

<nav>
<a href="index.html">🏠 Home</a>
<a href="chat.html">💬 Chat</a>
<a href="quiz.html">🎯 Cyber Quiz</a>
<a href="scam.html">⚠️ Scam Detector</a>
<a href="saeed.game.html" class="active">🎮 Saeed's Game</a>
</nav>

<div id="lang-screen">
<div class="panel">
<h2>Choose Language</h2>
<button class="en" onclick="start('en')">English</button>
<button class="ar" onclick="start('ar')">العربية</button>
</div>
</div>

<div id="game">
<div class="header">
<div id="level">Level 1</div>
<div class="hearts" id="hearts">❤️❤️❤️</div>
</div>

<div id="scene">
<div id="saeed">
<!-- SAME SAEED SVG AS BEFORE -->
<svg viewBox="0 0 120 220">
<ellipse cx="60" cy="208" rx="26" ry="7" fill="#000" opacity="0.5"></ellipse>

<!-- body -->
<rect x="40" y="94" width="40" height="90" rx="18" fill="#f8fafc"/>
<rect x="28" y="102" width="16" height="52" rx="8" fill="#f8fafc"/>
<rect x="76" y="102" width="16" height="52" rx="8" fill="#f8fafc"/>

<!-- sandals -->
<rect x="42" y="196" width="14" height="7" rx="3" fill="#111"/>
<rect x="64" y="196" width="14" height="7" rx="3" fill="#111"/>

<!-- head -->
<circle cx="60" cy="64" r="24" fill="#fef3c7"/>
<path d="M36 58Q60 34 84 58V96Q72 104 60 104T36 96Z" fill="#fff"/>
<ellipse cx="60" cy="47" rx="22" ry="7" fill="#000"/>
<circle class="eye" cx="50" cy="66" r="3" fill="#000"/>
<circle class="eye" cx="70" cy="66" r="3" fill="#000"/>
<path id="mouth" d="M50 76 Q60 82 70 76" stroke="#b91c1c" stroke-width="2.5" fill="none"/>
</svg>
</div>

<div id="phone"></div>

</div>
</div>

<div id="end-screen" style="display:none">
<div class="panel">
<h2 id="end-text"></h2>
<button onclick="location.reload()" class="en">Restart</button>
</div>
</div>


<script>
/* ---------- GAME DATA (10 LEVELS) ---------- */
const levels = [
{type:"dm",en:"Someone you don’t know asks for a private picture",ar:"شخص غريب يطلب صورة خاصة",safe:"Block & Report",mid:"Ignore",risk:"Send a picture"},
{type:"dm",en:"A kid in a game asks what school you go to",ar:"طفل في لعبة يسأل في أي مدرسة تدرس",safe:"Don’t answer + report",risk:"Tell them the school"},

{type:"email",en:"Bank email: Click link to verify account",ar:"بريد بنكي: اضغط على الرابط للتحقق",safe:"Use official app instead",mid:"Call bank to check",risk:"Click link"},

{type:"dm",en:"They offer 500 AED to meet you in person",ar:"يعرض 500 درهم للقاء شخصيًا",safe:"Block & report",mid:"Tell a parent/teacher",risk:"Accept the meeting"},

{type:"game",en:"Add me to a private voice chat?",ar:"ضيفني روم خاص بالصوت؟",safe:"Keep chat public",mid:"Ask why first",risk:"Join private VC"},

{type:"email",en:"Job offer, send your Emirates ID",ar:"عرض عمل، ارسل صورة الهوية",safe:"Don’t share info",risk:"Send ID"},

{type:"dm",en:"Reveal home city?",ar:"ماهي مدينتك؟",safe:"Keep private",mid:"Just say UAE",risk:"Tell exact city"},

{type:"game",en:"Share age?",ar:"عمرك كم؟",safe:"No info",mid:"Under 18",risk:"Give exact age"},

{type:"dm",en:"Open this link for free Robux",ar:"رابط روبوكس مجاني",safe:"Don’t click",mid:"Check official app",risk:"Click link"},

{type:"email",en:"Deadline: pay fee now or account closes",ar:"ادفع رسوم الآن وإلا يغلق الحساب",safe:"Ignore and ask support",mid:"Call support",risk:"Pay the fee"},
];

let lang="en", i=0, hearts=3;

/* ---------- START ---------- */
function start(l){lang=l;document.querySelector("#lang-screen").style.display="none";showLevel();}

/* ---------- RENDER LEVEL ---------- */
function showLevel(){
document.getElementById("level").textContent=`Level ${i+1}`;
document.getElementById("hearts").textContent="❤️".repeat(hearts)+"🖤".repeat(3-hearts);

let L=levels[i];
mouthHappy();

let html="";

/* DM & GAME → WHATSAPP STYLE */
if(L.type==="dm"||L.type==="game"){
html=`
<div class="phone-header"><span>${L.type==="dm"?"WhatsApp DM":"Game Chat"}</span><span>online</span></div>
<div class="chat-area">
<div class="bubble-in">${L[lang]}</div>
</div>
<button class="opt-btn safe" onclick="answer('safe')">${L.safe}</button>
${L.mid?`<button class="opt-btn mid" onclick="answer('mid')">${L.mid}</button>`:""}
<button class="opt-btn risk" onclick="answer('risk')">${L.risk}</button>
`;
}

/* EMAIL BOX */
if(L.type==="email"){
html=`
<div class="phone-header"><span>📩 Email Inbox</span><span>1 new</span></div>
<div class="email-box">${L[lang]}</div>
<button class="opt-btn safe" onclick="answer('safe')">${L.safe}</button>
${L.mid?`<button class="opt-btn mid" onclick="answer('mid')">${L.mid}</button>`:""}
<button class="opt-btn risk" onclick="answer('risk')">${L.risk}</button>
`;
}

document.getElementById("phone").innerHTML=html;
}

/* ---------- ANSWERS ---------- */
function answer(t){
if(t==="safe"){ i++;mouthHappy(); }
if(t==="mid"){ i++;mouthHappy(); }
if(t==="risk"){
hearts--; mouthWorry();
if(hearts<=0) return end(false);
}

if(i>=levels.length) return end(true);
showLevel();
}

/* ---------- FACE ---------- */
function mouthHappy(){document.getElementById("mouth").setAttribute("d","M50 76 Q60 82 70 76");}
function mouthWorry(){document.getElementById("mouth").setAttribute("d","M50 78 Q60 72 70 78");}

/* ---------- END ---------- */
function end(win){
document.getElementById("end-text").textContent= win?(lang==="en"?"You Kept Saeed Safe! 🎉":"حميت سعيد!"):(lang==="en"?"Game Over ⚠️":"انتهت اللعبة ⚠️");
document.getElementById("end-screen").style.display="flex";
}
</script>

</body>
</html>
