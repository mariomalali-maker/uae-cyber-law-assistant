<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Saeed's Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles/style.css" />

<style>
/* ❗️FIX: QUESTION WAS INVISIBLE */
.phone-body p {
  color: #ffffff !important;
}

/* CERTIFICATE */
.certificate {
  font-family: system-ui, sans-serif;
  background: white;
  padding: 40px;
  width: 90%;
  max-width: 500px;
  border-radius:20px;
  text-align:center;
  border:6px solid #0f172a;
}
.certificate h2 {color:#047857;}
.certificate button{
  margin-top:16px;
  padding:8px 12px;
  border-radius:10px;
  border:none;
  background:#22c55e;
  color:#022c22;
  cursor:pointer;
  font-weight:600;
}

/* EVERYTHING ELSE IS YOUR ORIGINAL CODE ⬇️ */
body.page-body {background: #020617;color: #f9fafb;font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;margin: 0;}
main.game-page {max-width: 1100px;margin: 40px auto 60px;padding: 0 16px 40px;}
.game-shell {background: radial-gradient(circle at top, #172937, #020617 55%);border-radius: 24px;padding: 28px 28px 36px;box-shadow: 0 18px 40px rgba(0,0,0,0.6);position: relative;overflow: hidden;}
.top-nav{display:flex;gap:20px;background:#020617;padding:12px 18px;position:sticky;top:0}
.top-nav a{color:white;text-decoration:none;font-size:14px}
.top-nav a.active{color:#22c55e;font-weight:600}
.game-header {display: flex;align-items: center;justify-content: space-between;margin-bottom: 18px;gap: 12px;}
.badge {font-size: 13px;padding: 6px 12px;border-radius: 999px;background: rgba(15, 23, 42, 0.8);color: #e5e7eb;border: 1px solid rgba(148, 163, 184, 0.4);display: inline-flex;align-items: center;gap: 4px;}
.badge.city {font-weight: 500;}
.badge.level {font-size: 12px;}
.hearts {display: flex;gap: 4px;justify-content: center;flex: 1;}
.hearts span {font-size: 20px;}
.lang-toggle {border-radius: 999px;border: 1px solid rgba(148,163,184,0.7);padding: 4px 10px;font-size: 12px;background: rgba(15,23,42,0.9);color: #e5e7eb;cursor: pointer;display: inline-flex;align-items: center;gap: 4px;}
.lang-toggle span {opacity: 0.7;}
.lang-toggle .active {opacity: 1;font-weight: 600;color: #22c55e;}
.scene {position: relative;border-radius: 24px;overflow: hidden;background: linear-gradient(to bottom, #020617 0%, #020617 40%, #020617 40%, #020617 100%);min-height: 380px;}
.phone {position: absolute;right: 16%;bottom: 96px;width: 280px;border-radius: 28px;background: radial-gradient(circle at top, #020617, #020617 60%, #020617 100%);border: 1px solid rgba(148,163,184,0.5);box-shadow:0 18px 40px rgba(15,23,42,0.9),inset 0 0 0 1px rgba(15,23,42,0.6);padding: 14px 14px 16px;z-index: 3;display: flex;flex-direction: column;gap: 10px;}
.phone-body {background: rgba(2, 6, 23, 0.8);border-radius: 18px;padding: 14px 14px;font-size: 14px;line-height: 1.6;color: white;min-height: 90px;display: flex;align-items: center;}
.answer-btn {border-radius: 999px;padding: 8px 10px;font-size: 12px;border: none;cursor: pointer;transition: 0.1s;}
.answer-primary {background: #22c55e;color: #022c22;}
.answer-secondary {background: #f97316;color: #111827;}
.intro-overlay {position: fixed;inset: 0;background: rgba(0,0,0,0.85);display: flex;align-items: center;justify-content: center;z-index: 40;}
</style>
</head>

<body class="page-body">

<nav class="top-nav">
<a href="index.html">🏠 Home</a>
<a href="chat.html">💬 Chat</a>
<a href="history.html">📄 History</a>
<a href="quiz.html">🎯 Cyber Quiz</a>
<a href="scam.html">⚠️ Scam Detector</a>
<a class="active">🎮 Saeed's Game</a>
</nav>

<main class="game-page">
<div class="game-shell">

<div class="game-header">
<span class="badge city" id="cityLabel">Abu Dhabi →</span>
<div class="hearts" id="hearts"><span>❤️</span><span>❤️</span><span>❤️</span></div>
<span class="badge level" id="levelLabel">Level 1 · DMs</span>
<button class="lang-toggle" id="langToggle"><span id="langEn" class="active">EN</span> | <span id="langAr">AR</span></button>
</div>

<section class="scene">
<div class="phone">
<div class="phone-body"><p id="questionText"></p></div>
<div><button class="answer-btn answer-primary" id="answerBtn1"></button></div>
<div><button class="answer-btn answer-secondary" id="answerBtn2"></button></div>
</div>
</section>

<!-- WIN SCREEN WITH CERTIFICATE -->
<div class="end-overlay" id="winOverlay" style="display:none;align-items:center;justify-content:center;position:absolute;inset:0;background:#000000dd;">
<div class="end-card" style="background:#020617;padding:30px;border-radius:16px;text-align:center;color:white;">
<h2 id="winTitle">🎉 You won!</h2>
<p id="winText">You kept Saeed safe.</p>
<br>
<label>🎓 Enter your name for certificate:</label>
<input id="certName" type="text" style="padding:8px;border-radius:8px;margin-top:8px;">
<button class="answer-btn answer-primary" id="makeCertBtn">Generate Certificate</button>
</div>
</div>

<!-- CERTIFICATE OUTPUT -->
<div id="certContainer" style="display:none;position:absolute;inset:0;background:#000000ee;align-items:center;justify-content:center;">
<div class="certificate" id="certContent">
<h2>🏆 Cyber Safety Champion</h2>
<p>This certificate is awarded to:</p>
<h1 id="certUser"></h1>
<p>For helping Saeed stay safe online. 🌐💚</p>
<button onclick="window.print()">🖨 Print</button>
<button onclick="location.reload()">🔁 Play again</button>
</div>
</div>

</div>
</main>

<!-- INTRO -->
<div class="intro-overlay" id="introOverlay">
  <div style="background:#020617;padding:20px;border-radius:20px;text-align:center;">
    <button class="lang-toggle" id="introLangToggle">
      <span id="introLangEn" class="active">EN</span> | <span id="introLangAr">AR</span>
    </button>
    <h2 id="introTitle">Meet Saeed 👦🏼</h2>
    <p id="introText">Listen to the intro, then help him stay safe.</p>
    <button class="answer-btn answer-primary" id="playIntroBtn">▶️ Play intro</button>
    <button class="answer-btn answer-secondary" id="startGameBtn" disabled>Start Game</button>
  </div>
</div>

<audio id="introAudio" src="intro-voice.mp3"></audio>

<script>
/* 🔥 SAME QUESTIONS, JUST FIXED */
const translations = {
en:{city:"Abu Dhabi →",
levelLabel:l=>`Level ${l} · DMs`,
introTitle:"Meet Saeed 👦🏼",
introText:"He doesn’t know much about online safety yet.",
playIntro:"Play introduction",startGame:"Start Game",
levels:[
{ question:"Someone asks for a private photo 😏", options:["Block & report","Send photo"], correct:0 },
{ question:"Send your Emirates ID to win?", options:["Send ID","Report as scam"], correct:1 },
{ question:"Bank link in WhatsApp?", options:["Ignore & call bank","Click & login"], correct:0 },
{ question:"Share location to stranger?", options:["Share live location","Block"], correct:1 },
{ question:"Send OTP to support?", options:["Send OTP","Never share OTP"], correct:1 },
],
winTitle:"🎉 You won!", winText:"You kept Saeed safe!"
},

ar:{city:"أبوظبي →",
levelLabel:l=>`المستوى ${l} · رسائل`,
introTitle:"تعرف على سعيد 👦🏼",
introText:"يحتاج مساعدتك للسلامة الإلكترونية.",
playIntro:"تشغيل المقدمة",startGame:"ابدأ اللعبة",
levels:[
{ question:"شخص يطلب صورة خاصة 😏", options:["حظر وبلاغ","إرسال الصورة"], correct:0 },
{ question:"فزت بجائزة؟ أرسل هويتك؟", options:["أرسل الهوية","إبلاغ كاحتيال"], correct:1 },
{ question:"رابط من البنك على واتساب؟", options:["اتجاهل واتصل بالبنك","أدخل بياناتي"], correct:0 },
{ question:"مشاركة الموقع لغريب؟", options:["موقعي مباشر","حظر"], correct:1 },
{ question:"يريد كود OTP؟", options:["أرسله","مستحيل"], correct:1 },
],
winTitle:"🎉 فزت!", winText:"حمّيت سعيد من الخطر!"
}
};

let currentLang="en",level=0,hearts=3;
const q=document.getElementById("questionText"),
b1=document.getElementById("answerBtn1"),
b2=document.getElementById("answerBtn2"),
overlay=document.getElementById("introOverlay"),
win=document.getElementById("winOverlay"),
cert=document.getElementById("certContainer");

function load(){let t=translations[currentLang].levels[level];
q.textContent=t.question;b1.textContent=t.options[0];b2.textContent=t.options[1];
document.getElementById("levelLabel").textContent=translations[currentLang].levelLabel(level+1);
document.getElementById("cityLabel").textContent=translations[currentLang].city;}
b1.onclick=()=>check(0);b2.onclick=()=>check(1);
function check(c){let t=translations[currentLang].levels[level];
if(c===t.correct){level++;if(level>=translations[currentLang].levels.length){showWin();return;}load();}
else{hearts--;if(hearts<=0){alert("💔 Game Over");location.reload();}}
document.getElementById("hearts").innerHTML="❤️".repeat(hearts);
}

function showWin(){
document.getElementById("winTitle").textContent=translations[currentLang].winTitle;
document.getElementById("winText").textContent=translations[currentLang].winText;
win.style.display="flex";
}

document.getElementById("makeCertBtn").onclick=()=>{
let name=document.getElementById("certName").value.trim();
if(!name)return;document.getElementById("certUser").textContent=name;
cert.style.display="flex";win.style.display="none";
};

document.getElementById("langToggle").onclick=()=>{
currentLang=currentLang==="en"?"ar":"en";load();
document.getElementById("langEn").classList.toggle("active");
document.getElementById("langAr").classList.toggle("active");
};

document.getElementById("introLangToggle").onclick=()=>{
currentLang=currentLang==="en"?"ar":"en";
document.getElementById("introTitle").textContent=translations[currentLang].introTitle;
document.getElementById("introText").textContent=translations[currentLang].introText;
document.getElementById("playIntroBtn").textContent="▶️ "+translations[currentLang].playIntro;
document.getElementById("startGameBtn").textContent=translations[currentLang].startGame;
document.getElementById("introLangEn").classList.toggle("active");
document.getElementById("introLangAr").classList.toggle("active");
};

const audio=document.getElementById("introAudio");
document.getElementById("playIntroBtn").onclick=()=>{
audio.currentTime=0;audio.play().then(()=>{});};
audio.onended=()=>{document.getElementById("startGameBtn").disabled=false;};
document.getElementById("startGameBtn").onclick=()=>{overlay.style.display="none";load();};

load();
</script>
</body>
</html>
