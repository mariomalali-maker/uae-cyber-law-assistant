<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saeed's Cyber Safety Game</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#020617;--accent:#22c55e;--danger:#ef4444;
--text:#e5e7eb;--panel:#0f172a;--blur:rgba(2,6,23,.65)
}
body{
font-family:system-ui,Segoe UI,sans-serif;
background:radial-gradient(circle at top,#020617,#000);
color:var(--text);min-height:100vh;display:flex;flex-direction:column;
}
nav{
display:flex;gap:12px;padding:12px 18px;background:#020617;
border-bottom:1px solid rgba(15,23,42,.8);position:sticky;top:0;z-index:20;
}
nav a{
color:var(--text);text-decoration:none;font-size:.9rem;
padding:6px 10px;border-radius:999px;border:1px solid transparent;
}
nav a.active{background:var(--accent);color:#022c22}
main{flex:1;display:flex;justify-content:center;padding:20px}
#game-shell{
width:100%;max-width:960px;background:rgba(15,23,42,.92);
border-radius:24px;border:1px solid rgba(31,41,55,.8);
box-shadow:0 25px 60px rgba(0,0,0,.6);position:relative;overflow:hidden;
}
.hud{
position:absolute;top:12px;left:12px;right:12px;
display:flex;justify-content:space-between;z-index:3;
}
.level-label{
background:#059669;padding:4px 10px;border-radius:999px;font-size:.8rem
}
#scene{
height:min(70vh,520px);min-height:380px;
background:linear-gradient(#0f172a,#000);position:relative;
}
.road{
position:absolute;bottom:40px;left:0;right:0;height:80px;background:#020617;
}
#saeed-wrapper{
position:absolute;bottom:80px;left:18%;width:180px;
animation:bounce 1.4s infinite ease-in-out;
}
@keyframes bounce{50%{transform:translateY(-6px)}}
.eye{animation:blink 4s infinite}
@keyframes blink{95%{transform:scaleY(.1)}}
#phone{
display:none;position:absolute;top:22%;right:8%;width:300px;
}
#phone.show{display:block}
.phone-inner{
background:#111827;border-radius:20px;padding:16px;border:1px solid #1f2937;
}
.msg-in{background:#1e293b;padding:10px;border-radius:12px;margin-bottom:10px}
.choice-row{display:flex;gap:10px}
.choice-btn{
flex:1;border:none;padding:10px;border-radius:10px;
font-weight:600;cursor:pointer
}
.choice-safe{background:#22c55e;color:#022c22}
.choice-risk{background:#fee2e2;color:#7f1d1d}
.overlay{
position:absolute;inset:0;background:var(--blur);
backdrop-filter:blur(10px);display:flex;
align-items:center;justify-content:center;z-index:50;
}
.panel{
background:var(--panel);padding:22px;border-radius:20px;
width:min(420px,92vw);text-align:center;
}
</style>
</head>

<body>

<nav>
<a href="index.html">🏠 Home</a>
<a href="chat.html">💬 Chat</a>
<a href="quiz.html">🧠 Cyber Quiz</a>
<a href="scam.html">⚠️ Scam Detector</a>
<a class="active">🎮 Saeed's Game</a>
</nav>

<main>
<div id="game-shell">

<!-- 🎧 INTRO -->
<div class="overlay" id="intro">
<div class="panel">
<h2>🎧 Welcome to Saeed's Story</h2>
<p>Press play to listen before starting.</p>
<audio id="introAudio" src="intro-voice.mp3" preload="auto"></audio>
<button id="playBtn">▶️ Play Audio</button>
<p id="introStatus" style="display:none;margin-top:10px;">🎙 Playing...</p>
</div>
</div>

<!-- 🌍 LANGUAGE -->
<div class="overlay" id="lang" style="display:none;">
<div class="panel">
<h2>Choose Language</h2>
<button onclick="setLang('en')">English</button>
<button onclick="setLang('ar')">العربية</button>
</div>
</div>

<!-- END -->
<div class="overlay" id="end" style="display:none;">
<div class="panel" id="endBox"></div>
</div>

<div class="hud">
<div id="hearts">❤️❤️❤️</div>
<div class="level-label" id="level">Level 1</div>
</div>

<section id="scene">
<div class="road"></div>

<div id="saeed-wrapper">
<svg viewBox="0 0 120 220" width="100%">
<circle cx="60" cy="60" r="26" fill="#fde68a"/>
<circle class="eye" cx="50" cy="60" r="3"/>
<circle class="eye" cx="70" cy="60" r="3"/>
<path id="mouth" d="M50 76 Q60 82 70 76" stroke="#b91c1c" stroke-width="3" fill="none"/>
<rect x="40" y="94" width="40" height="90" rx="18" fill="#fff"/>
</svg>
</div>

<div id="phone">
<div class="phone-inner">
<div id="msg" class="msg-in"></div>
<div class="choice-row">
<button class="choice-btn choice-safe" id="safe"></button>
<button class="choice-btn choice-risk" id="risk"></button>
</div>
<p id="tip" style="margin-top:6px;font-size:.8rem;color:#f87171"></p>
</div>
</div>

</section>
</div>
</main>

<script>
/* 🎧 AUDIO FIX */
const playBtn = document.getElementById("playBtn");
playBtn.addEventListener("touchstart", playIntro, { once:true });
playBtn.addEventListener("click", playIntro, { once:true });

async function playIntro(){
const audio=document.getElementById("introAudio");
const status=document.getElementById("introStatus");
status.style.display="block";
try{
audio.currentTime=0;
await audio.play();
audio.onended=()=>{
document.getElementById("intro").style.display="none";
document.getElementById("lang").style.display="flex";
};
}catch(e){
status.textContent="Tap once more";
}
}

/* 🎮 GAME */
let lang="en",idx=0,hearts=3;
const scenarios=[
{m:{en:"Send me a private pic?",ar:"ارسل صورة خاصة"},s:{en:"Block",ar:"حظر"},r:{en:"Send",ar:"أرسل"},bad:{en:"Never send photos",ar:"لا ترسل صور"}},
{m:{en:"Click bank link",ar:"اضغط رابط البنك"},s:{en:"Use app",ar:"استخدم التطبيق"},r:{en:"Click",ar:"اضغط"},bad:{en:"Banks don’t send links",ar:"البنوك لا ترسل روابط"}}
];

function setLang(l){
lang=l;
document.getElementById("lang").style.display="none";
start();
}
function start(){
idx=0;hearts=3;
document.getElementById("phone").classList.add("show");
update();
}
function update(){
const s=scenarios[idx];
document.getElementById("msg").textContent=s.m[lang];
document.getElementById("safe").textContent=s.s[lang];
document.getElementById("risk").textContent=s.r[lang];
document.getElementById("tip").textContent="";
document.getElementById("hearts").textContent="❤️".repeat(hearts)+"🖤".repeat(3-hearts);
}
safe.onclick=()=>{idx++;idx>=scenarios.length?end(true):update();}
risk.onclick=()=>{
hearts--;update();
document.getElementById("tip").textContent=scenarios[idx].bad[lang];
if(hearts<=0)end(false);
};
function end(win){
document.getElementById("end").style.display="flex";
endBox.innerHTML=win?"🎉 You kept Saeed safe":"💔 Game Over";
}
</script>
</body>
</html>
