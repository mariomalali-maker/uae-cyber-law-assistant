<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saeed – Cyber Survival</title>

<style>
/* ================= RESET ================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
button{font-family:inherit}

/* ================= COLORS ================= */
:root{
--bg:#020617;
--panel:#0f172a;
--accent:#22c55e;
--danger:#ef4444;
--text:#e5e7eb;
--muted:#9ca3af;
}

/* ================= PAGE ================= */
body{
background:radial-gradient(circle at top,#020617,#000);
color:var(--text);
font-family:system-ui,Segoe UI,sans-serif;
display:flex;
flex-direction:column;
}

/* ================= NAV ================= */
nav{
display:flex;
gap:12px;
padding:12px 18px;
background:#020617;
border-bottom:1px solid #1f2937;
}
nav a{
color:var(--text);
text-decoration:none;
font-size:.9rem;
padding:6px 10px;
border-radius:999px;
}
nav a.active{
background:var(--accent);
color:#022c22;
}

/* ================= GAME SHELL ================= */
main{
flex:1;
display:flex;
justify-content:center;
padding:16px;
}
#game{
width:100%;
max-width:960px;
background:rgba(15,23,42,.95);
border-radius:24px;
border:1px solid #1f2937;
box-shadow:0 25px 80px rgba(0,0,0,.7);
overflow:hidden;
position:relative;
}

/* ================= HUD ================= */
.hud{
position:absolute;
top:12px;
left:12px;
right:12px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:5;
}
#hearts{font-size:1.1rem}
#level{
background:#059669;
padding:4px 10px;
border-radius:999px;
font-size:.8rem;
}

/* Danger meter */
.danger-bar{
width:140px;
height:8px;
background:#111827;
border-radius:999px;
overflow:hidden;
margin-left:10px;
}
#danger-fill{
height:100%;
width:0%;
background:var(--danger);
transition:.3s;
}

/* ================= SCENE ================= */
#scene{
height:min(70vh,520px);
min-height:420px;
background:linear-gradient(#0f172a,#020617);
position:relative;
overflow:hidden;
}

/* Road */
.road{
position:absolute;
bottom:40px;
left:0;
right:0;
height:80px;
background:#020617;
box-shadow:0 -14px 40px rgba(0,0,0,.8) inset;
}
.lane{
position:absolute;
top:50%;
left:0;
right:0;
height:4px;
transform:translateY(-50%);
background-image:repeating-linear-gradient(
to right,#fff,#fff 24px,transparent 24px,transparent 48px);
opacity:.5;
}

/* ================= CHARACTER ================= */
#saeed{
position:absolute;
bottom:82px;
left:15%;
width:180px;
z-index:3;
animation:idle 2.4s ease-in-out infinite;
}
@keyframes idle{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-6px)}
}
.eye{animation:blink 4s infinite}
@keyframes blink{
0%,92%,100%{transform:scaleY(1)}
95%{transform:scaleY(.1)}
}
#mouth{transition:.2s}

/* ================= PHONE ================= */
#phone{
position:absolute;
top:20%;
right:6%;
width:300px;
display:none;
z-index:4;
}
#phone.show{
display:block;
animation:phoneIn .5s ease forwards;
}
@keyframes phoneIn{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}
.phone-inner{
background:#111827;
border-radius:22px;
padding:16px;
border:1px solid #1f2937;
}
.phone-top{
display:flex;
justify-content:space-between;
margin-bottom:10px;
font-size:.85rem;
}
.msg{
background:#1e293b;
padding:12px;
border-radius:14px;
margin-bottom:12px;
}
.choice-row{
display:flex;
gap:10px;
}
.choice-btn{
flex:1;
border:none;
padding:12px;
border-radius:12px;
font-weight:700;
cursor:pointer;
touch-action:manipulation;
}
.safe{background:#22c55e;color:#022c22}
.risk{background:#fee2e2;color:#7f1d1d}
.tip{margin-top:6px;font-size:.8rem;color:#f87171}

/* ================= OVERLAYS ================= */
.overlay{
position:absolute;
inset:0;
background:rgba(2,6,23,.75);
backdrop-filter:blur(8px);
display:flex;
align-items:center;
justify-content:center;
z-index:10;
}
.panel{
background:#0f172a;
padding:22px;
border-radius:22px;
width:min(420px,92vw);
text-align:center;
}
.panel button{
margin-top:10px;
padding:10px 16px;
border-radius:999px;
border:none;
font-weight:600;
cursor:pointer;
background:var(--accent);
color:#022c22;
}
</style>
</head>

<body>

<nav>
<a href="index.html">🏠 Home</a>
<a href="chat.html">💬 Chat</a>
<a href="quiz.html">🧠 Quiz</a>
<a class="active">🎮 Saeed Game</a>
</nav>

<main>
<div id="game">

<!-- INTRO -->
<div class="overlay" id="intro">
<div class="panel">
<h2>👦 This is Saeed</h2>
<p>You will help him survive the internet.<br>Choose wisely.</p>
<button onclick="startLang()">Start</button>
</div>
</div>

<!-- LANGUAGE -->
<div class="overlay" id="lang" style="display:none">
<div class="panel">
<h2>Choose language</h2>
<button onclick="setLang('en')">English</button>
<button onclick="setLang('ar')">العربية</button>
</div>
</div>

<!-- END -->
<div class="overlay" id="end" style="display:none">
<div class="panel" id="endBox"></div>
</div>

<!-- HUD -->
<div class="hud">
<div id="hearts">❤️❤️❤️</div>
<div style="display:flex;align-items:center">
<div id="level">Level 1</div>
<div class="danger-bar"><div id="danger-fill"></div></div>
</div>
</div>

<section id="scene">
<div class="road"><div class="lane"></div></div>

<!-- SAEED -->
<div id="saeed">
<svg viewBox="0 0 220 360" width="100%">
<ellipse cx="110" cy="340" rx="40" ry="10" fill="#020617" opacity=".6"/>
<rect x="70" y="140" width="80" height="130" rx="30" fill="#f9fafb"/>
<circle cx="110" cy="80" r="44" fill="#fde68a"/>
<circle class="eye" cx="95" cy="75" r="4"/>
<circle class="eye" cx="125" cy="75" r="4"/>
<path id="mouth" d="M95 95 Q110 105 125 95"
stroke="#b91c1c" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
</div>

<!-- PHONE -->
<div id="phone">
<div class="phone-inner">
<div class="phone-top">
<span id="icon">📱</span>
<span id="title"></span>
</div>
<div id="msg" class="msg"></div>
<div class="choice-row">
<button class="choice-btn safe" id="safe"></button>
<button class="choice-btn risk" id="risk"></button>
</div>
<div id="tip" class="tip"></div>
</div>
</div>

</section>
</div>
</main>

<script>
/* ================= GAME DATA ================= */
const data=[
{t:{en:"Instagram DM",ar:"رسالة انستغرام"},
m:{en:"Send me a private photo.",ar:"ارسل صورة خاصة."},
s:{en:"Block & report",ar:"حظر و تبليغ"},
r:{en:"Send photo",ar:"إرسال"},
bad:{en:"Never send photos.",ar:"لا ترسل صور."}},
{t:{en:"Game Chat",ar:"شات لعبة"},
m:{en:"Where do you live?",ar:"أين تسكن؟"},
s:{en:"Keep private",ar:"تجاهل"},
r:{en:"Tell them",ar:"أخبرهم"},
bad:{en:"Location is dangerous.",ar:"الموقع خطر."}},
{t:{en:"Free WiFi",ar:"واي فاي"},
m:{en:"Login with Instagram?",ar:"سجل بانستغرام؟"},
s:{en:"Use mobile data",ar:"بيانات الهاتف"},
r:{en:"Login",ar:"تسجيل"},
bad:{en:"Public WiFi is risky.",ar:"واي فاي عام خطر."}},
{t:{en:"Friend Request",ar:"طلب صداقة"},
m:{en:"I know you. Give number.",ar:"اعطني رقمك."},
s:{en:"Ask parent",ar:"اسأل شخص بالغ"},
r:{en:"Give number",ar:"اعطاء"},
bad:{en:"Never share numbers.",ar:"لا تشارك الرقم."}},
{t:{en:"Email",ar:"إيميل"},
m:{en:"Click to unlock bank.",ar:"اضغط لفتح البنك."},
s:{en:"Use bank app",ar:"تطبيق البنك"},
r:{en:"Click link",ar:"اضغط"},
bad:{en:"Banks don’t send links.",ar:"البنوك لا ترسل روابط."}},
{t:{en:"Link",ar:"رابط"},
m:{en:"Funny video 😂",ar:"فيديو مضحك"},
s:{en:"Ask sender",ar:"اسأل المرسل"},
r:{en:"Open link",ar:"افتح"},
bad:{en:"Links can hack.",ar:"الرابط قد يخترق."}},
{t:{en:"Voice Msg",ar:"صوت"},
m:{en:"Bank voice message.",ar:"رسالة من البنك."},
s:{en:"Call bank",ar:"اتصل بالبنك"},
r:{en:"Play it",ar:"تشغيل"},
bad:{en:"Scam alert.",ar:"احتيال."}},
{t:{en:"Final Choice",ar:"القرار الأخير"},
m:{en:"Stranger wants meeting.",ar:"غريب يريد لقاء."},
s:{en:"Say no",ar:"ارفض"},
r:{en:"Agree",ar:"وافق"},
bad:{en:"Never meet strangers.",ar:"لا تقابل الغرباء."}}
];

/* ================= LOGIC ================= */
let i=0,lang="en",hearts=3,danger=0;

const phone=document.getElementById("phone");
const mouth=document.getElementById("mouth");

function startLang(){
document.getElementById("intro").style.display="none";
document.getElementById("lang").style.display="flex";
}
function setLang(l){
lang=l;
document.getElementById("lang").style.display="none";
startGame();
}
function startGame(){
i=0;hearts=3;danger=0;
phone.classList.add("show");
update();
}
function update(){
const s=data[i];
document.getElementById("level").textContent="Level "+(i+1);
document.getElementById("title").textContent=s.t[lang];
document.getElementById("msg").textContent=s.m[lang];
document.getElementById("safe").textContent=s.s[lang];
document.getElementById("risk").textContent=s.r[lang];
document.getElementById("tip").textContent="";
document.getElementById("hearts").textContent="❤️".repeat(hearts)+"🖤".repeat(3-hearts);
document.getElementById("danger-fill").style.width=danger+"%";
mouth.setAttribute("d","M95 95 Q110 105 125 95");
}
function bad(){
mouth.setAttribute("d","M95 100 Q110 90 125 100");
}
function end(win){
document.getElementById("end").style.display="flex";
document.getElementById("endBox").innerHTML=
win?`<h2>🎉 ${lang==="en"?"You saved Saeed!":"حميت سعيد!"}</h2>`
:`<h2>💔 ${lang==="en"?"Game Over":"انتهت اللعبة"}</h2>`;
}
safe.onclick=()=>{
danger=Math.max(0,danger-10);
i++; i>=data.length?end(true):update();
};
risk.onclick=()=>{
bad();
hearts--; danger+=20;
document.getElementById("tip").textContent=data[i].bad[lang];
if(hearts<=0||danger>=100){end(false);return}
document.getElementById("danger-fill").style.width=danger+"%";
};
</script>

</body>
</html>
