*{box-sizing:border-box;margin:0;padding:0}
:root{

}

body{

/* =======================
   GAME SHELL
======================= */
#game{
  width: min(980px, 100%);
  height: min(620px, calc(100vh - 32px));
  min-height: 560px;
  border-radius: 26px;
  border: 1px solid rgba(148,163,184,.20);
  box-shadow: 0 30px 120px rgba(0,0,0,.75);
  position:relative;
  overflow:hidden;
  background: linear-gradient(180deg, rgba(2,6,23,.8), rgba(2,6,23,.95));
}

/* =======================
   PHONE FIXES (CRITICAL)
======================= */
#phone{
  position:absolute;
  right:7%;
  top:110px;
  width:340px;
  z-index:18;
  opacity:0;
  pointer-events:none;
  transform:translateY(20px) scale(.96);
  transition:.4s ease;
}
#phone.show{
  opacity:1;
  pointer-events:auto;
  transform:translateY(0) scale(1);
}

/* Mobile tap reliability */
button{
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

/* Hidden overlays must not block clicks */
.overlay[style*="display:none"]{
  pointer-events:none !important;
