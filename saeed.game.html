<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saeed's Cyber Safety Game</title>

<style>
/* RESET */
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#020617;--accent:#22c55e;--danger:#ef4444;
--text:#e5e7eb;--muted:#9ca3af;
--panel:#0f172a;--blur:rgba(2,6,23,0.6)
}

/* PAGE */
body{
font-family:system-ui,Segoe UI,sans-serif;
background:radial-gradient(circle at top,#020617,#000);
color:var(--text);min-height:100vh;
display:flex;flex-direction:column;
}

/* NAV */
nav{
display:flex;gap:12px;padding:12px 18px;
background:#020617;border-bottom:1px solid rgba(15,23,42,.8);
position:sticky;top:0;z-index:20;
}
nav a{
color:var(--text);text-decoration:none;font-size:.9rem;
padding:6px 10px;border-radius:999px;
transition:.25s;border:1px solid transparent;
display:inline-flex;align-items:center;gap:4px;
}
nav a:hover{background:#111827;border-color:#1f2937}
nav a.active{background:var(--accent);color:#022c22}

/* GAME BOX */
main{flex:1;display:flex;justify-content:center;padding:20px}
#game-shell{
width:100%;max-width:960px;height:auto;
background:rgba(15,23,42,.92);border-radius:24px;
border:1px solid rgba(31,41,55,.8);
box-shadow:0 25px 60px rgba(0,0,0,.6);
position:relative;overflow:hidden;
}

/* HUD */
.hud{
position:absolute;top:12px;left:12px;right:12px;
display:flex;justify-content:space-between;z-index:3;
}
.level-label{
background:#059669;padding:4px 10px;border-radius:999px;
font-size:.8rem;color:#eafff7;
}

/* BACKGROUND */
#scene{
height:min(70vh,520px);min-height:380px;
background:linear-gradient(#0f172a 0,#001 60%,#000 100%);
position:relative;overflow:hidden;
}

.road{
position:absolute;bottom:40px;left:0;right:0;height:80px;
background:#020617;
box-shadow:0 -14px 40px rgba(0,0,0,.8) inset;
}
.lane{
position:absolute;left:0;right:0;top:50%;
height:4px;transform:translateY(-50%);
background-image:repeating-linear-gradient(to right,
#fff,#fff 28px,transparent 28px,transparent 56px);
opacity:.5;
}

/* FLOATING TOWERS */
.tower{
position:absolute;bottom:140px;width:70px;
background:linear-gradient(#1f2937,#020617);
border-radius:16px 16px 0 0;
animation:float 6s ease-in-out infinite alternate;
opacity:.7;
}
@keyframes float{
0%{transform:translateY(0)}
100%{transform:translateY(-10px)}
}

/* SAEED */
#saeed-wrapper{
position:absolute;bottom:80px;left:18%;
width:180px;z-index:10;
animation:bounce 1.4s infinite ease-in-out;
}
@keyframes bounce{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-6px)}
}
.eye{animation:blink 4s infinite}
@keyframes blink{
0%,92%,100%{transform:scaleY(1)}
95%{transform:scaleY(.1)}
}
#mouth{transition:.2s}

/* PHONE */
#phone{display:none;position:absolute;top:20%;right:8%;width:300px}
#phone.show{display:block;animation:fadeIn .6s forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.phone-inner{
background:#111827;border-radius:20px;padding:16px;
border:1px solid #1f2937;
}
.phone-top{display:flex;justify-content:space-between;margin-bottom:8px}
.phone-circle{font-size:1.4rem}
.msg-in{background:#1e293b;padding:10px;border-radius:12px;margin-bottom:10px}

.choice-row{display:flex;gap:10px;margin-top:10px}
.choice-btn{
flex:1;border:none;padding:10px;border-radius:10px;
font-weight:600;font-size:.9rem;cursor:pointer;transition:.3s;
}
.choice-safe{background:#22c55e;color:#022c22}
.choice-safe:hover{box-shadow:0 0 10px #22c55e}
.choice-risk{background:#fee2e2;color:#7f1d1d}
.choice-risk:hover{box-shadow:0 0 10px #ef4444}

/* OVERLAYS */
.overlay{
position:absolute;inset:0;
background:var(--blur);backdrop-filter:blur(10px);
display:flex;align-items:center;justify-content:center;
z-index:50;
}
.panel{
background:var(--panel);padding:22px;border-radius:20px;
width:min(480px,92vw);text-align:center;
box-shadow:0 0 30px rgba(0,0,0,.5);
animation:pop .4s ease;
}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
</style>
</head>

<body>
<nav>
<a href="index.html">🏠 Home</a>
<a href="chat.html">💬 Chat</a>
<a href="quiz.html">🧠 Cyber Quiz</a>
<a href="scam.html">⚠️ Scam Detector</a>
<a class="active">🎮 Saeed's Game</a>
</nav>

<main>
<div id="game-shell">

<!-- 🎧 INTRO -->
<div class="overlay" id="intro">
<div class="panel">
<h2>🎧 Welcome to Saeed's Story</h2>
<p>Press play to listen before starting.</p>
<audio id="introAudio" preload="auto" src="intro-voice.mp3"></audio>
<button onclick="playIntro()">▶️ Play Audio</button>
<p id="introStatus" style="display:none;margin-top:10px;">🎙 Listening...</p>
</div>
</div>

<!-- LANGUAGE -->
<div class="overlay" id="lang" style="display:none;">
<div class="panel">
<h2>🌍 Choose Language</h2>
<button onclick="setLang('en')" style="margin:8px">English</button>
<button onclick="setLang('ar')" style="margin:8px">العربية</button>
</div>
</div>

<!-- END -->
<div class="overlay" id="end" style="display:none;">
<div class="panel" id="endBox"></div>
</div>

<!-- HUD -->
<div class="hud">
<div class="hearts" id="hearts">❤️❤️❤️</div>
<div class="level-label" id="level">Level 1 · DMs</div>
</div>

<section id="scene">
<!-- background towers -->
<div class="tower" style="left:8%;height:160px"></div>
<div class="tower" style="left:30%;height:200px"></div>
<div class="tower" style="left:55%;height:180px"></div>
<div class="tower" style="left:78%;height:220px"></div>

<div class="road"></div><div class="lane"></div>

<!-- SAEED -->
<div id="saeed-wrapper">
<svg viewBox="0 0 120 220" width="100%">
<circle cx="60" cy="60" r="26" fill="#fde68a"/>
<circle class="eye" cx="50" cy="60" r="3"/>
<circle class="eye" cx="70" cy="60" r="3"/>
<path id="mouth" d="M50 76 Q60 82 70 76" stroke="#b91c1c" stroke-width="3" fill="none"/>
<rect x="40" y="94" width="40" height="90" rx="18" fill="#fff"/>
</svg>
</div>

<!-- PHONE -->
<div id="phone">
<div class="phone-inner">
<div class="phone-top"><span id="icon">📱</span> <span id="title">DM</span></div>
<div id="msg" class="msg-in"></div>
<div class="choice-row">
<button class="choice-btn choice-safe" id="safe"></button>
<button class="choice-btn choice-risk" id="risk"></button>
</div>
<p id="tip" style="margin-top:6px;font-size:.8rem;color:#f87171"></p>
</div>
</div>

</section>
</div>
</main>

<script>
// 🎧 INTRO FIX (iPhone safe)
function playIntro(){
const audio=document.getElementById("introAudio");
document.getElementById("introStatus").style.display="block";
audio.play().then(()=>{
audio.onended=()=>{document.getElementById("intro").style.display="none";
document.getElementById("lang").style.display="flex";}
}).catch(()=>alert("Tap the screen then press play again."));
}

// 🌍 LANGUAGE + GAME
let lang="en",idx=0,hearts=3;
const scenarios=[
{t:{en:"DM",ar:"رسالة"},m:{en:"Send me a private pic?",ar:"ارسل صورة خاصة!"},s:{en:"Block & Report",ar:"حظر و تبليغ"},r:{en:"Send it",ar:"أرسل"},bad:{en:"Never send photos to strangers.",ar:"لا ترسل صور للغرباء."}},
{t:{en:"Bank Email",ar:"بنك"},m:{en:"Click to unlock account",ar:"اضغط لفتح الحساب"},s:{en:"Use official app",ar:"استخدم التطبيق"},r:{en:"Click link",ar:"اضغط"},bad:{en:"Banks don't use random links.",ar:"البنوك لا ترسل روابط."}},
// ➕ add rest easily later...
];

function setLang(l){lang=l;document.getElementById("lang").style.display="none";start();}
function mouth(h){document.getElementById("mouth").setAttribute("d",h?"M50 76 Q60 82 70 76":"M50 78 Q60 72 70 78");}
function start(){idx=0;hearts=3;update();document.getElementById("phone").classList.add("show");}
function update(){
const s=scenarios[idx];
document.getElementById("level").textContent=`Level ${idx+1}`;
document.getElementById("title").textContent=s.t[lang];
document.getElementById("msg").textContent=s.m[lang];
document.getElementById("safe").textContent=s.s[lang];
document.getElementById("risk").textContent=s.r[lang];
document.getElementById("tip").textContent="";
document.getElementById("hearts").textContent="❤️".repeat(hearts)+"🖤".repeat(3-hearts);
}

document.getElementById("safe").onclick=()=>{
mouth(true);idx++;
idx>=scenarios.length?end(true):update();
};
document.getElementById("risk").onclick=()=>{
mouth(false);hearts--;update();
document.getElementById("tip").textContent=scenarios[idx].bad[lang];
if(hearts<=0)end(false);
};

function end(win){
document.getElementById("end").style.display="flex";
document.getElementById("endBox").innerHTML=win
?`<h2>🎉 ${lang==="en"?"You kept Saeed safe!":"حميت سعيد!"}</h2><button onclick="location.reload()">Restart</button>`
:`<h2>💔 ${lang==="en"?"Game Over":"انتهت اللعبة"}</h2><button onclick="location.reload()">Try Again</button>`;
}
</script>
</body>
</html>
