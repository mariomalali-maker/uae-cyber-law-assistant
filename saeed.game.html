<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Saeed's Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#020617;
  color:white;margin:0;
  font-family:Arial, sans-serif;
  overflow:hidden;
}
nav{background:#0f172a;padding:12px 22px;display:flex;gap:18px;}
nav a{color:white;text-decoration:none;font-size:15px;}
nav a:hover{opacity:0.7;}
.lang-btn{margin-left:auto;background:#22d3ee;padding:6px 12px;border-radius:8px;cursor:pointer;}

#game-area{
  width:100vw;height:100vh;
  background:#07111d url('https://i.imgur.com/j6b10h6.png') center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;position:relative;
}

/* Saeed */
#saeed{
  width:90px;height:160px;background:white;border-radius:22px;
  position:absolute;left:18%;bottom:20%;
  display:flex;align-items:center;justify-content:center;
}
#face{width:42px;height:42px;background:white;border-radius:50%;border:3px solid #000;
      display:flex;flex-direction:column;align-items:center;justify-content:center;}
.eye{width:8px;height:8px;background:black;border-radius:50%;margin:2px;}
.mouth{width:14px;height:4px;background:black;border-radius:2px;}
#hearts{position:absolute;top:70px;left:50%;transform:translateX(-50%);font-size:24px;}

/* phone */
#phone{
  width:350px;background:#0f172a;border-radius:18px;
  padding:16px;position:absolute;right:18%;bottom:18%;
}
#msg{background:rgba(255,255,255,0.08);padding:14px;border-radius:12px;min-height:80px;}
.btn{width:100%;margin-top:8px;padding:10px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;}
.correct{background:#22c55e;color:white;}
.wrong{background:#ef4444;color:white;}

/* INTRO */
#intro-screen{
  position:fixed;inset:0;background:rgba(0,0,0,0.8);
  backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;z-index:999;
}
.card{background:#112031;padding:36px;border-radius:18px;width:420px;text-align:center;}
#play-intro,#start-game{width:100%;margin-top:12px;padding:12px;font-size:16px;border-radius:8px;border:none;}
#play-intro{background:#22c55e;}
#start-game{background:#0ea5e9;opacity:0.4;cursor:not-allowed;color:white;}
#lang-toggle{background:#475569;color:white;border:none;padding:6px 12px;margin-top:10px;border-radius:8px;cursor:pointer;}
</style>
</head>

<body>

<nav>
  <a href="index.html">🏠 Home</a>
  <a href="chat.html">💬 Chat</a>
  <a href="history.html">📄 History</a>
  <a href="quiz.html">🎯 Cyber Quiz</a>
  <a href="scam.html">⚠️ Scam Detector</a>
  <span class="lang-btn" id="nav-lang">EN</span>
</nav>

<div id="game-area">
<div id="hearts">❤️❤️❤️</div>

<div id="saeed">
  <div id="face">
    <div style="display:flex;gap:6px;"><div class="eye"></div><div class="eye"></div></div>
    <div class="mouth"></div>
  </div>
</div>

<div id="phone">
  <div id="msg">---</div>
  <button id="opt1" class="btn"></button>
  <button id="opt2" class="btn"></button>
</div>
</div>

<!-- INTRO -->
<div id="intro-screen">
  <div class="card">
    <h2 id="intro-title">Meet Saeed 🧒🏻</h2>
    <p id="intro-desc">He doesn’t know much about online safety yet.<br>Listen to the intro first.</p>
    <button id="play-intro">▶️ Play introduction</button>
    <button id="start-game" disabled>✔️ Start the game</button>
    <button id="lang-toggle">EN / AR</button>
    <audio id="introAudio" src="intro-voice.mp3"></audio>
  </div>
</div>

<script>
/* 🌍 LANGUAGE DATA */
let lang="en";
const text = {
  en:{
    introTitle:"Meet Saeed 🧒🏻",
    introDesc:"He doesn’t know much about online safety yet.\nListen to the intro before starting.",
    play:"▶️ Play introduction",
    start:"✔️ Start the game",
  },
  ar:{
    introTitle:"تعرف على سعيد 🧒🏻",
    introDesc:"ما يعرف وايد عن الأمان الإلكتروني.\nاسمع المقدمة أول.",
    play:"▶️ تشغيل المقدمة",
    start:"✔️ ابدأ اللعبة",
  }
};

function applyLang(){
  document.getElementById("intro-title").innerText=text[lang].introTitle;
  document.getElementById("intro-desc").innerText=text[lang].introDesc;
  document.getElementById("play-intro").innerText=text[lang].play;
  document.getElementById("start-game").innerText=text[lang].start;
  document.getElementById("nav-lang").textContent=lang.toUpperCase();
}
document.getElementById("lang-toggle").onclick=()=>{
  lang = lang==="en"?"ar":"en";
  applyLang();
};
applyLang();

/* 🎧 INTRO AUDIO CONTROL */
const audio=document.getElementById("introAudio");
document.getElementById("play-intro").onclick=()=>{ audio.play(); };
audio.onended=()=>{
  let btn=document.getElementById("start-game");
  btn.disabled=false;
  btn.style.opacity=1;
  btn.style.cursor="pointer";
};
document.getElementById("start-game").onclick=()=>{
  if(this.disabled)return;
  document.getElementById("intro-screen").style.display="none";
};

/* 🎮 GAME QUESTIONS (10) */
let i=0;
let hearts=3;

const Q = [
{en:"Someone asks for a private picture?",ar:"شخص يطلب صورة خاصة؟",o1:"Block & report",o2:"Send photo",correct:1},
{en:"You won a prize! Send Emirates ID.",ar:"ربحت جائزة! ارسل الهوية الإماراتية.",o1:"Ignore, report",o2:"Send ID",correct:1},
{en:"Stranger sends link to reset Instagram.",ar:"رابط غريب لتغيير كلمة سر انستغرام.",o1:"Ignore & reset manually",o2:"Click link",correct:1},
{en:"Friend sends 'OMG is this you?' link",ar:"صديق يرسل رابط 'شوف هذا انت؟'",o1:"Ask friend first",o2:"Click fast",correct:1},
{en:"Unknown shop requests bank card pics",ar:"محل مجهول يطلب صورة بطاقتك البنكية",o1:"Report shop",o2:"Send photos",correct:1},
{en:"Get password for free WiFi via app?",ar:"تطبيق يعطي كلمة مرور انترنت مجانا",o1:"Avoid, risky",o2:"Download",correct:1},
{en:"Email from 'Apple' but bad domain",ar:"ايميل من 'ابل' لكن الدومين غريب",o1:"Mark phishing",o2:"Login there",correct:1},
{en:"DM: Buy followers instantly!",ar:"رسالة: نقدر نزيد متابعينك فوراً!",o1:"Report spam",o2:"Give login",correct:1},
{en:"Someone screenshotted your story",ar:"شخص صور الستوري عندك",o1:"Public story is ok",o2:"Send private pic",correct:1},
{en:"Casino app asks for Emirates ID selfie",ar:"تطبيق قمار يطلب صورة الهوية",o1:"Deny & report",o2:"Send selfie",correct:1},
];

function load(){
  if(i>=Q.length){
    document.getElementById("msg").innerHTML = (lang==="en"?"🎉 You finished!":"🎉 خلصت اللعبة!");
    document.getElementById("opt1").style.display="none";
    document.getElementById("opt2").style.display="none";
    return;
  }
  let q=Q[i];
  document.getElementById("msg").innerText = lang==="en"?q.en:q.ar;
  document.getElementById("opt1").innerText=q.o1;
  document.getElementById("opt2").innerText=q.o2;
}
load();

function pick(x){
  if(x===Q[i].correct){
    document.getElementById("saeed").style.bottom="22%";
  }else{
    hearts--;
    document.getElementById("hearts").innerText="❤️".repeat(hearts);
    if(hearts<=0){ alert("Game Over"); location.reload(); }
  }
  i++; load();
}
document.getElementById("opt1").onclick=()=>pick(1);
document.getElementById("opt2").onclick=()=>pick(2);
</script>

</body>
</html>
