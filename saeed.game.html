<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saeed's Cyber Safety Game</title>

<style>
/* --------- SAME DESIGN YOU SENT (NO CHANGES TO STYLE) --------- */
*{box-sizing:border-box;}
:root{--bg:#020617;--accent:#22c55e;--accent-soft:rgba(34,197,94,0.12);--danger:#ef4444;--text:#e5e7eb;--muted:#9ca3af;}
body{margin:0;font-family:system-ui, sans-serif;background:radial-gradient(circle at top,#020617 0,#020617 55%,#000 100%);color:var(--text);}
nav{display:flex;gap:12px;padding:12px;background:#020617;border-bottom:1px solid rgba(15,23,42,0.9);position:sticky;top:0;z-index:10;}
nav a{color:var(--text);text-decoration:none;padding:6px 10px;border-radius:999px;font-size:.9rem;}
nav a.active{background:var(--accent);color:#022c22;}
main{display:flex;justify-content:center;padding:14px;}
#game-shell{width:100%;max-width:960px;background:rgba(15,23,42,0.95);border-radius:24px;border:1px solid rgba(31,41,55,0.9);position:relative;overflow:hidden;}

/* HUD */
.hud{position:absolute;top:10px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:3;}
#lang-switch{position:absolute;top:10px;right:18px;cursor:pointer;background:#0f172a;padding:4px 8px;border-radius:10px;font-size:.8rem;}
#lang-switch:hover{background:#1e293b;}

#scene{height:520px;position:relative;}
/* (visuals remain same — truncated for brevity) */

/* PHONE */
#phone{position:absolute;right:10%;bottom:110px;width:min(280px,80vw);background:#020617;border-radius:28px;padding:10px;border:3px solid #111827;transform-origin:bottom right;transform:scale(.3) translate(40px,80px);opacity:0;pointer-events:none;}
#phone.show{animation:phone-pop .4s ease-out forwards;pointer-events:auto;}
@keyframes phone-pop{0%{opacity:0;transform:scale(.3)translate(40px,80px);}100%{opacity:1;transform:scale(1);}}

.choice-btn{border:none;border-radius:999px;padding:7px;color:#022c22;font-size:.8rem;}
.choice-safe{background:#22c55e;}
.choice-risk{background:#fee2e2;color:#7f1d1d;}

/* OVERLAYS */
.overlay{position:absolute;inset:0;background:rgba(15,23,42,.9);display:flex;align-items:center;justify-content:center;z-index:6;}
.panel{background:#020617;padding:20px;border-radius:20px;text-align:center;width:90%;max-width:420px;}
button{cursor:pointer;}
.primary{background:var(--accent);color:#022c22;border-radius:999px;padding:10px 12px;}
.ghost{background:transparent;color:white;border:1px solid #1e293b;border-radius:999px;padding:10px;}

</style>
</head>
<body>

<nav>
  <a href="index.html">🏠 Home</a>
  <a href="chat.html">💬 Chat</a>
  <a href="quiz.html">🧠 Cyber Quiz</a>
  <a href="scam.html">⚠️ Scam Detector</a>
  <a href="saeed.game.html" class="active">🎮 Saeed's Game</a>
</nav>

<main>
  <div id="game-shell">

    <div class="hud">
      <div id="hearts">❤️❤️❤️</div>
      <div id="level-label">Level 1 · DMs</div>
      <div id="lang-switch">EN | AR</div>
    </div>

    <section id="scene">
      <!-- ⚠️ EXACT SAME SVG + PHONE YOU SENT (shortened here) -->
      <!-- NOT CHANGED -->
      <div id="saeed-wrapper"> ... YOUR CHARACTER SVG ... </div>
      <div id="phone"> ... PHONE UI ... </div>
    </section>

    <!-- 🌟 INTRO OVERLAY -->
    <div class="overlay" id="intro-overlay">
      <div class="panel">
        <h2 id="intro-title">Meet Saeed 👦🏻</h2>
        <p id="intro-text">He doesn’t know much about online safety yet. Help him learn!</p>
        <br>
        <button class="primary" id="btn-play-intro">▶ Play Introduction (Voice)</button>
        <br><br>
        <button class="ghost" id="btn-start-game">🚀 Start Game</button>
      </div>
    </div>

    <!-- END / CERTIFICATE -->
    <div class="overlay" id="end-overlay" style="display:none;">
      <div class="panel">
        <h2 id="end-title"></h2>
        <p id="end-msg"></p>

        <div id="certificate-box" style="display:none;">
          <input id="cert-name" placeholder="Enter your name" style="padding:8px;border-radius:8px;width:80%;margin:10px 0;">
          <button class="primary" id="download-cert">🎉 Download Certificate</button>
          <br><br>
        </div>

        <button class="ghost" onclick="location.reload()">🔁 Play Again</button>
      </div>
    </div>

  </div>
</main>

<script>
/* ------------------- AUDIO INTRO ------------------- */
const introAudio = new Audio("intro-voice.mp3");
document.getElementById("btn-play-intro").onclick = ()=> introAudio.play();

/* ------------------- LANG SWITCH ------------------- */
let currentLang="en";
document.getElementById("lang-switch").onclick = ()=>{
  currentLang = currentLang==="en" ? "ar" : "en";
  updateLanguageUI();
};

/* ------------------- 10 SCENARIOS (6-12 AGE) ------------------- */
const scenarios = [
 {icon:"📱",type:"dm",msg:{en:"Someone asks for a private photo",ar:"شخص يطلب صورة خاصة"},safe:{en:"Block & Report",ar:"حظر و إبلاغ"},risky:{en:"Send it",ar:"أرسل"},tip:{en:"Never send private pictures.",ar:"لا ترسل صور خاصة ابداً."}},
 {icon:"🎮",msg:{en:"Gamer asks your school and city",ar:"لاعب يسأل عن مدرستك و مدينتك"},safe:{en:"Don't tell",ar:"لا تجاوب"},risky:{en:"Tell them",ar:"قل لهم"},tip:{en:"Don't share location.",ar:"لا تشارك المكان."}},
 {icon:"✉️",msg:{en:"Email: Click to win an iPhone!",ar:"إيميل: اضغط لتربح آيفون!"},safe:{en:"Ignore/delete",ar:"تجاهل/حذف"},risky:{en:"Click link",ar:"اضغط الرابط"},tip:{en:"Scam links steal info.",ar:"روابط احتيال."}},
 {icon:"🤖",msg:{en:"Bot asks for your password",ar:"بوت يطلب كلمة السر"},safe:{en:"Never share it",ar:"لا تشارك"},risky:{en:"Give password",ar:"إعطه"},tip:{en:"Keep passwords secret",ar:"كلمات السر سرية."}},
 {icon:"👤",msg:{en:"Stranger says: Let's meet alone",ar:"غريب يقول: خل نتقابل لوحدنا"},safe:{en:"Tell an adult",ar:"أخبر شخص بالغ"},risky:{en:"Go meet them",ar:"قابلهم"},tip:{en:"Never meet strangers",ar:"لا تقابل غرباء."}},
 {icon:"📷",msg:{en:"They ask for face reveal",ar:"يطلبون كشف وجهك"},safe:{en:"Refuse & block",ar:"ارفض و احظر"},risky:{en:"Send selfie",ar:"ارسل صورة"},tip:{en:"Protect identity",ar:"احمي هويتك."}},
 {icon:"🎥",msg:{en:"Friend shares bullying video",ar:"شخص يرسل فيديو تنمر"},safe:{en:"Report it",ar:"ابلاغ"},risky:{en:"Share it",ar:"انشره"},tip:{en:"Don't spread harm",ar:"لا تنشر الاذية."}},
 {icon:"📲",msg:{en:"Free Robux/V-bucks link",ar:"رابط يعطي عملات مجانية"},safe:{en:"Don't click",ar:"لا تضغط"},risky:{en:"Click it",ar:"اضغط"},tip:{en:"Most are scams",ar:"اغلبها احتيال."}},
 {icon:"🏦",msg:{en:"Bank SMS: Send ID now",ar:"رسالة بنك تطلب الهوية"},safe:{en:"Call bank official",ar:"اتصل بالبنك"},risky:{en:"Send ID",ar:"ارسل الهوية"},tip:{en:"Banks don't ask by SMS",ar:"البنوك ما تطلب كذا."}},
 {icon:"📡",msg:{en:"Public Wi-Fi asks password",ar:"واي فاي عام يطلب كلمات سر"},safe:{en:"Don't enter it",ar:"لا تدخل"},risky:{en:"Enter password",ar:"ادخل"},tip:{en:"Use secure networks",ar:"استخدم شبكات امنه."}},
];

let i=0, hearts=3;

const phone=document.getElementById("phone");
const phoneMsg=document.getElementById("phone-msg");
const btnSafe=document.getElementById("btn-safe");
const btnRisk=document.getElementById("btn-risk");
const tip=document.getElementById("phone-tip");

/* ------------------- GAME START ------------------- */
document.getElementById("btn-start-game").onclick=()=>{
  document.getElementById("intro-overlay").style.display="none";
  load();
};

function load(){
 phone.classList.add("show");
 const s=scenarios[i];
 phoneMsg.textContent = s.msg[currentLang];
 btnSafe.textContent = s.safe[currentLang];
 btnRisk.textContent = s.risky[currentLang];
 tip.textContent="";
}

btnSafe.onclick=()=>{
 tip.textContent="✅";
 if(++i>=scenarios.length) return finish();
 setTimeout(load,800);
};

btnRisk.onclick=()=>{
 hearts--;
 tip.textContent="❌ "+scenarios[i].tip[currentLang];
 document.getElementById("hearts").textContent="❤️".repeat(hearts)+"🖤".repeat(3-hearts);
 if(hearts<=0) return gameOver();
};

/* ------------------- ENDINGS ------------------- */
function finish(){
 document.getElementById("end-overlay").style.display="flex";
 document.getElementById("end-title").textContent =
   currentLang==="en"?"You protected Saeed 🎉":"حميت سعيد 🎉";
 document.getElementById("certificate-box").style.display="block";
}

/* ------------------- GAME OVER ------------------- */
function gameOver(){
 document.getElementById("end-overlay").style.display="flex";
 document.getElementById("end-title").textContent =
   currentLang==="en"?"Game Over ⚠️":"انتهت اللعبة ⚠️";
}

/* ------------------- UPDATE LANGUAGE ------------------- */
function updateLanguageUI(){
 load();
}

/* ------------------- CERTIFICATE DOWNLOAD ------------------- */
document.getElementById("download-cert").onclick=()=>{
 const name=document.getElementById("cert-name").value||"Player";
 const c=document.createElement("canvas"),ctx=c.getContext("2d");
 c.width=800;c.height=600;
 ctx.fillStyle="#022c22";ctx.fillRect(0,0,800,600);
 ctx.fillStyle="white";ctx.font="42px sans-serif";
 ctx.fillText("Cyber Safety Certificate",200,200);
 ctx.font="28px sans-serif";
 ctx.fillText("Awarded to: "+name,250,300);
 const link=document.createElement("a");
 link.download="certificate.png";
 link.href=c.toDataURL();
 link.click();
};

</script>
</body>
</html>
