<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Saeed's Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
 background:#02040A;
 margin:0;
 font-family:Arial, sans-serif;
 color:white;
 overflow:hidden;
}
nav{
 background:rgba(0,0,0,0.35);
 padding:12px 20px;
 display:flex;justify-content:space-between;align-items:center;
 backdrop-filter:blur(10px);
}
nav .lang-switch button{
 background:none;border:none;font-weight:bold;color:white;font-size:16px;cursor:pointer;
}

/* INTRO */
#introScreen{
 position:fixed;inset:0;background:rgba(0,0,0,0.85);
 backdrop-filter:blur(8px);
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 z-index:1000;text-align:center;
}
#introScreen img{width:120px;margin-bottom:20px;}
.intro-btn{
 background:#1ea33f;color:white;border:none;padding:10px 20px;
 border-radius:8px;margin:10px auto;font-weight:bold;cursor:pointer;
}
#startBtn{background:#3b82f6;display:none;}

/* GAME AREA */
#gameContainer{
 width:90%;margin:auto;margin-top:100px;
 background:linear-gradient(#0B1A2A,#08121C);
 border-radius:20px;padding:20px;position:relative;display:none;
}
#hearts{text-align:center;font-size:28px;margin-bottom:10px;}

/* Saeed */
#saeed{
 width:80px;height:160px;background:white;
 border-radius:25px;
 position:absolute;left:120px;bottom:140px;
 transition:0.3s ease;
}
#saeed::before{
 content:"";background:black;width:50px;height:20px;border-radius:10px;
 position:absolute;top:-10px;left:15px;
}

/* Phone */
#phone{
 width:320px;background:rgba(0,0,0,0.7);
 border:2px solid #222;padding:18px;border-radius:16px;
 position:absolute;right:120px;bottom:110px;
}
#messageText{font-size:15px;margin-bottom:15px;line-height:20px;}
.answer-btn{width:100%;padding:10px;margin-top:10px;border:none;font-weight:bold;border-radius:8px;cursor:pointer;}
.safe{background:#16a34a;color:white;}
.danger{background:#EF4444;color:white;}

</style>
</head>
<body>

<nav>
 <span style="font-size:18px;font-weight:bold;">💚 Saeed’s Game</span>
 <div class="lang-switch"><button id="langEN">EN</button> | <button id="langAR">AR</button></div>
</nav>

<!-- INTRO -->
<div id="introScreen">
 <img src="https://i.imgur.com/Al7jo8o.png">
 <h2 id="introTitle">Meet Saeed</h2>
 <p id="introText">He doesn’t know much about online safety yet. Listen to the intro then help him!</p>
 <button class="intro-btn" onclick="playIntro()">▶ Play Introduction</button>
 <button class="intro-btn" id="startBtn" onclick="startGame()">✔ Start Game</button>
 <audio id="introAudio" src="intro-voice.mp3"></audio>
</div>

<!-- GAME -->
<div id="gameContainer">
 <div id="hearts">❤️❤️❤️</div>

 <div id="saeed"></div>

 <div id="phone">
   <div id="messageText"></div>
   <button class="answer-btn safe" onclick="chooseAnswer(true)"></button>
   <button class="answer-btn danger" onclick="chooseAnswer(false)"></button>
 </div>
</div>

<script>
// INTRO
function playIntro(){
 document.getElementById("introAudio").play();
 document.getElementById("startBtn").style.display="block";
}
function startGame(){
 document.getElementById("introScreen").style.display="none";
 document.getElementById("gameContainer").style.display="block";
}

// QUESTIONS
let lang="en";
let current=0;
let hearts=3;

const questions={
 en:[
  {q:"Someone asked for a private picture.",safe:"Block & report",danger:"Send photo",correct:true},
  {q:"You won iPhone, send Emirates ID.",safe:"Report scam",danger:"Send ID",correct:true},
  {q:"Fix bank account? Click link.",safe:"Ignore & report",danger:"Click link",correct:true},
  {q:"Give your OTP code?",safe:"Never share OTP",danger:"Give it",correct:true},
  {q:"Double money crypto plan!",safe:"Avoid & block",danger:"Send money",correct:true},
  {q:"Your Instagram will be deleted, send pass!",safe:"Official help only",danger:"Send password",correct:true},
  {q:"We send gift, need your address.",safe:"Don't share info",danger:"Share info",correct:true},
  {q:"WhatsApp agent wants code.",safe:"Never share verification code",danger:"Share code",correct:true},
  {q:"Police fine, pay now!",safe:"Check official app",danger:"Pay quickly",correct:true},
  {q:"Open file, it’s your photo!",safe:"Don't download",danger:"Download",correct:true}
 ],
 ar:[
  {q:"شخص طلب صورة خاصة.",safe:"الحظر و الإبلاغ",danger:"إرسال الصورة",correct:true},
  {q:"ربحت ايفون، ارسل الهوية.",safe:"ابلاغ عن احتيال",danger:"إرسال الهوية",correct:true},
  {q:"رابط غريب للبنك.",safe:"تجاهل و ابلاغ",danger:"اضغط الرابط",correct:true},
  {q:"اعطني رمز OTP.",safe:"عدم مشاركة الرموز",danger:"إعطاء الرمز",correct:true},
  {q:"خطة مضاعفة المال!",safe:"تجنب و حظر",danger:"ارسل المال",correct:true},
  {q:"سنحذف حسابك! ارسل كلمة السر!",safe:"المساعدة الرسمية فقط",danger:"إرسال كلمة السر",correct:true},
  {q:"نحتاج عنوانك لهدية.",safe:"لا ترسل معلوماتك",danger:"ارسال العنوان",correct:true},
  {q:"وكيل واتساب يريد رمز.",safe:"لا تشارك رمز التحقق",danger:"ارسال الرمز",correct:true},
  {q:"غرامة شرطة ادفع الآن!",safe:"تحقق من تطبيق رسمي",danger:"الدفع فورًا",correct:true},
  {q:"افتح الملف صورتك!",safe:"لا تحمل شيء غريب",danger:"حمله",correct:true}
 ]
};

// SHOW QUESTION
function showQ(){
 let q = questions[lang][current];
 document.getElementById("messageText").innerText = q.q;
 document.querySelector(".safe").innerText = q.safe;
 document.querySelector(".danger").innerText = q.danger;
}
showQ();

// MOVEMENT ONLY
function chooseAnswer(isSafe){
 let correct = questions[lang][current].correct;

 if(isSafe == correct){
   // MOVE FORWARD
   document.getElementById("saeed").style.left = "150px";
   setTimeout(()=>{document.getElementById("saeed").style.left="120px"},200);
   current++;
 } else {
   // SHAKE
   document.getElementById("saeed").style.left = "110px";
   setTimeout(()=>{document.getElementById("saeed").style.left="120px"},150);
   hearts--;
   document.getElementById("hearts").innerText = "❤️".repeat(hearts);
   if(hearts <= 0){ alert(lang=="en"?"Game Over":"انتهت اللعبة"); location.reload();}
 }

 if(current>=questions[lang].length){
   alert(lang=="en"?"🎉 You finished!":"🎉 أنهيت اللعبة!");
   return;
 }
 setTimeout(()=>{showQ()},250);
}

// LANGUAGE SWITCH
document.getElementById("langEN").onclick=()=>{lang="en";showQ()};
document.getElementById("langAR").onclick=()=>{lang="ar";showQ()};

</script>
</body>
</html>
