<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Saeed's Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#020617;
  margin:0;font-family:Arial, sans-serif;
  overflow:hidden;
  color:white;
}

/* ====== TOP NAV ====== */
nav{
  background:#0f172a;
  padding:12px 22px;
  display:flex; gap:18px;
  font-size:15px;
}
nav a{color:white;text-decoration:none;}
nav a:hover{opacity:0.7;}

.lang-btn{
  margin-left:auto;
  background:#22d3ee;
  padding:6px 12px;
  border-radius:8px;
  cursor:pointer;
}

/* ====== MAIN LAYOUT ====== */
#game-area{
  width:100vw;
  height:100vh;
  background:url('https://i.imgur.com/j6b10h6.png') center/cover no-repeat; /* old bg look */
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

/* ===== SAEED ===== */
#saeed{
  width:90px;
  height:160px;
  background:white;
  border-radius:22px;
  position:absolute;
  left:20%;
  bottom:20%;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:0.4s;
}
#face{
  width:42px;height:42px;
  background:white;border-radius:50%;
  border:3px solid #000;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.eye{width:8px;height:8px;background:black;border-radius:50%;margin:2px;}
.mouth{width:14px;height:4px;background:black;border-radius:3px;}

/* HEARTS */
#hearts{position:absolute;top:16%;left:50%;transform:translateX(-50%);font-size:24px;}

/* ===== PHONE ===== */
#phone{
  width:350px;
  min-height:200px;
  background:#0f172a;
  border-radius:18px;
  padding:16px;
  position:absolute;
  right:22%;
  bottom:18%;
}
#msg{
  background:rgba(255,255,255,0.08);
  padding:14px;
  border-radius:12px;
  text-align:left;
}
.option-btn{
  width:100%;
  margin-top:10px;
  padding:10px;
  border-radius:8px;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
.correct{background:#22c55e;color:white;}
.wrong{background:#dc2626;color:white;}

/* ===== INTRO SCREEN ===== */
#intro-screen{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.72);
  backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;
  z-index:999;
}
.intro-card{
  background:#0d1b2a;
  border-radius:22px;
  padding:38px;
  width:420px;
  text-align:center;
  color:white;
  display:flex;flex-direction:column;gap:14px;
}
#play-intro,#start-game{
  padding:12px;
  border-radius:10px;
  font-weight:bold;
  border:none;
  cursor:pointer;
}
#play-intro{background:#22c55e;color:white;}
#start-game{background:#0ea5e9;color:white;opacity:0.4;cursor:not-allowed;}
#lang-toggle{
  background:#1e293b;
  color:white;padding:6px;
  border:none;border-radius:8px;
  cursor:pointer;margin-top:6px;
}
</style>
</head>

<body>

<nav>
  <a href="index.html">🏠 Home</a>
  <a href="chat.html">💬 Chat</a>
  <a href="history.html">📄 History</a>
  <a href="quiz.html">🎯 Cyber Quiz</a>
  <a href="scam.html">⚠️ Scam Detector</a>
  <a href="saeed.game.html" style="color:#22c55e;">🎮 Saeed's Game</a>
</nav>

<div id="game-area">

<div id="hearts">❤️❤️❤️</div>

<div id="saeed">
  <div id="face">
    <div style="display:flex;gap:6px;">
      <div class="eye"></div><div class="eye"></div>
    </div>
    <div class="mouth"></div>
  </div>
</div>

<div id="phone">
  <div id="msg">---</div>
  <button id="opt1" class="option-btn"></button>
  <button id="opt2" class="option-btn"></button>
</div>

</div>

<!-- ===== INTRO ===== -->
<div id="intro-screen">
  <div class="intro-card">
    <div id="intro-title">Meet Saeed 🧒🏻</div>
    <div id="intro-desc">
      He doesn’t know much about online safety yet.
      Listen to the short intro, then help him stay safe from scams and bad messages.
    </div>

    <button id="play-intro">▶️ Play introduction</button>
    <button id="start-game" disabled>✔️ Yes, let's start the game</button>

    <audio id="introAudio" src="intro-voice.mp3"></audio>

    <button id="lang-toggle">EN / AR</button>
  </div>
</div>

<script>
/* ===================== LANGUAGE ===================== */
let lang="en";
const text={
  en:{
    title:"Meet Saeed 🧒🏻",
    desc:"He doesn’t know much about online safety yet.\nListen to the short intro, then help him stay safe from scams and bad messages.",
    play:"▶️ Play introduction",
    start:" Yes, let's start the game"
  },
  ar:{
    title:"تعرف على سعيد 🧒🏻",
    desc:"ما يعرف وايد عن الأمان الإلكتروني.\nاستمع للمقدمة القصيرة ثم ساعده يتفادى الاحتيال والرسائل الخطيرة.",
    play:"▶️ تشغيل المقدمة",
    start:"✔️ نعم، لنبدأ اللعبة"
  }
};

function applyLang(){
  document.getElementById("intro-title").innerText=text[lang].title;
  document.getElementById("intro-desc").innerText=text[lang].desc;
  document.getElementById("play-intro").innerText=text[lang].play;
  document.getElementById("start-game").innerText=text[lang].start;
}

document.getElementById("lang-toggle").onclick=()=>{
  lang = (lang==="en") ? "ar" : "en";
  applyLang();
};
applyLang();

/* ===================== INTRO LOGIC ===================== */
const intro = document.getElementById("intro-screen");
const audio = document.getElementById("introAudio");
const startBtn= document.getElementById("start-game");

document.getElementById("play-intro").onclick=()=>{
  audio.play();
};
audio.onended=()=>{
  startBtn.disabled=false;
  startBtn.style.opacity=1;
  startBtn.style.cursor="pointer";
};
startBtn.onclick=()=>{
  if(startBtn.disabled)return;
  intro.style.display="none";
};

/* ===================== GAME QUESTIONS ===================== */
let q=0;
const questions=[
  {
    m:"Hey, I found your account. Can you send a private picture?",
    o1:"Block & report this account",
    o2:"Send a picture",
    correct:1
  },
  {
    m:"Congrats! You won an iPhone 16 Pro. Send Emirates ID to claim!",
    o1:"Send my Emirates ID",
    o2:"Refuse & report as scam",
    correct:2
  },
  {
    m:"Someone sent you a suspicious link to reset your password.",
    o1:"Click link",
    o2:"Ignore & change password from official app",
    correct:2
  }
];

function loadQ(){
  document.getElementById("msg").innerText=questions[q].m;
  document.getElementById("opt1").innerText=questions[q].o1;
  document.getElementById("opt2").innerText=questions[q].o2;
}
loadQ();

document.getElementById("opt1").onclick=()=>choose(1);
document.getElementById("opt2").onclick=()=>choose(2);

function choose(x){
  if(x===questions[q].correct){
    document.getElementById("saeed").style.bottom="22%";
  }else{
    document.getElementById("hearts").innerText="❤️❤️";
  }
  q++;
  if(q<questions.length){loadQ();}
  else{document.getElementById("msg").innerText="🎉 YOU FINISHED!"; }
}
</script>

</body>
</html>
