<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saeed’s Cyber Quest</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:system-ui,-apple-system,Segoe UI,sans-serif;
background:radial-gradient(circle at top,#020617,#000);
color:#e5e7eb;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* GAME FRAME */
#game{
width:100%;
max-width:900px;
height:540px;
background:#020617;
border-radius:22px;
box-shadow:0 30px 80px rgba(0,0,0,.8);
position:relative;
overflow:hidden;
border:1px solid #1f2937;
}

/* HUD */
#hud{
position:absolute;
top:12px;left:12px;right:12px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:5;
font-size:.9rem;
}
#hearts{font-size:1.1rem}
#level{
background:#22c55e;
color:#022c22;
padding:4px 10px;
border-radius:999px;
font-weight:600;
}

/* BACKGROUND ANIMATION */
#bg{
position:absolute;
inset:0;
background:linear-gradient(#0f172a,#000);
overflow:hidden;
}
.star{
position:absolute;
width:2px;height:2px;
background:#fff;
opacity:.6;
animation:twinkle 3s infinite alternate;
}
@keyframes twinkle{to{opacity:.2}}

/* GROUND */
#ground{
position:absolute;
bottom:0;left:0;right:0;
height:100px;
background:#020617;
box-shadow:0 -20px 40px rgba(0,0,0,.8) inset;
}

/* SAEED */
#saeed{
position:absolute;
bottom:100px;
left:50%;
transform:translateX(-50%);
width:120px;
transition:.3s;
animation:bounce 1.2s infinite ease-in-out;
}
@keyframes bounce{
50%{transform:translate(-50%,-6px)}
}
.eye{animation:blink 4s infinite}
@keyframes blink{
95%{transform:scaleY(.1)}
}
#mouth{transition:.25s}

/* PHONE CARD */
#card{
position:absolute;
top:90px;
left:50%;
transform:translateX(-50%) scale(.8);
width:320px;
background:#111827;
border-radius:18px;
padding:16px;
border:1px solid #1f2937;
opacity:0;
pointer-events:none;
transition:.4s;
}
#card.show{
opacity:1;
transform:translateX(-50%) scale(1);
pointer-events:auto;
}
#card h3{
font-size:.95rem;
margin-bottom:8px;
}
#message{
background:#1e293b;
padding:10px;
border-radius:12px;
font-size:.9rem;
margin-bottom:12px;
}

/* BUTTONS */
.btns{
display:flex;
gap:10px;
}
button{
flex:1;
padding:10px;
border-radius:12px;
border:none;
font-weight:700;
font-size:.85rem;
cursor:pointer;
transition:.2s;
}
.safe{
background:#22c55e;color:#022c22;
}
.safe:hover{box-shadow:0 0 12px #22c55e}
.risk{
background:#fee2e2;color:#7f1d1d;
}
.risk:hover{box-shadow:0 0 12px #ef4444}

/* OVERLAYS */
.overlay{
position:absolute;
inset:0;
background:rgba(2,6,23,.7);
backdrop-filter:blur(8px);
display:flex;
align-items:center;
justify-content:center;
z-index:10;
}
.panel{
background:#020617;
border-radius:20px;
padding:24px;
width:min(420px,90%);
text-align:center;
box-shadow:0 0 40px rgba(0,0,0,.6);
animation:pop .4s ease;
}
@keyframes pop{
from{transform:scale(.8);opacity:0}
to{transform:scale(1);opacity:1}
}
.panel h2{margin-bottom:10px}
.panel p{font-size:.9rem;margin-bottom:14px;color:#9ca3af}

/* END */
.hidden{display:none}
</style>
</head>

<body>

<div id="game">

<!-- HUD -->
<div id="hud">
<div id="hearts">❤️❤️❤️</div>
<div id="level">Level 1</div>
</div>

<!-- BACKGROUND -->
<div id="bg"></div>
<div id="ground"></div>

<!-- SAEED -->
<div id="saeed">
<svg viewBox="0 0 120 200" width="100%">
<circle cx="60" cy="50" r="26" fill="#fde68a"/>
<circle class="eye" cx="50" cy="50" r="3"/>
<circle class="eye" cx="70" cy="50" r="3"/>
<path id="mouth" d="M48 64 Q60 70 72 64" stroke="#b91c1c" stroke-width="3" fill="none"/>
<rect x="40" y="78" width="40" height="80" rx="18" fill="#fff"/>
</svg>
</div>

<!-- CARD -->
<div id="card">
<h3 id="title">📱 Message</h3>
<div id="message"></div>
<div class="btns">
<button class="safe" id="safeBtn"></button>
<button class="risk" id="riskBtn"></button>
</div>
</div>

<!-- START -->
<div class="overlay" id="start">
<div class="panel">
<h2>🎮 Saeed’s Cyber Quest</h2>
<p>Help Saeed stay safe online.<br>Tap to begin.</p>
<button class="safe" onclick="startGame()">START</button>
</div>
</div>

<!-- END -->
<div class="overlay hidden" id="end">
<div class="panel" id="endText"></div>
</div>

</div>

<script>
/* STARS */
for(let i=0;i<60;i++){
const s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";
s.style.animationDelay=Math.random()*3+"s";
document.getElementById("bg").appendChild(s);
}

/* GAME DATA */
const levels=[
{q:"Someone asks for your password.",safe:"Never share",risk:"Tell them",bad:"Passwords are private"},
{q:"A link says: free Robux!",safe:"Ignore",risk:"Click",bad:"Free prizes are scams"},
{q:"Stranger asks your school name.",safe:"Don’t answer",risk:"Tell",bad:"Location info is dangerous"},
{q:"Email says bank locked account.",safe:"Use bank app",risk:"Click email",bad:"Banks don’t email links"},
{q:"Friend sends weird link.",safe:"Ask first",risk:"Open",bad:"Accounts can be hacked"},
{q:"Public WiFi asks login.",safe:"Use data",risk:"Login",bad:"Fake WiFi steals info"},
{q:"Game chat asks phone number.",safe:"Say no",risk:"Give",bad:"Phone numbers are private"},
{q:"Unknown file download.",safe:"Delete",risk:"Download",bad:"Files can have viruses"}
];

let level=0;
let hearts=3;

/* ELEMENTS */
const card=document.getElementById("card");
const msg=document.getElementById("message");
const safeBtn=document.getElementById("safeBtn");
const riskBtn=document.getElementById("riskBtn");
const mouth=document.getElementById("mouth");

/* START */
function startGame(){
document.getElementById("start").classList.add("hidden");
card.classList.add("show");
load();
}

/* LOAD LEVEL */
function load(){
document.getElementById("level").textContent=`Level ${level+1}`;
msg.textContent=levels[level].q;
safeBtn.textContent=levels[level].safe;
riskBtn.textContent=levels[level].risk;
mouth.setAttribute("d","M48 64 Q60 70 72 64");
document.getElementById("hearts").textContent="❤️".repeat(hearts)+"🖤".repeat(3-hearts);
}

/* CHOICES */
safeBtn.onclick=()=>{
level++;
if(level>=levels.length) return win();
load();
};
riskBtn.onclick=()=>{
hearts--;
mouth.setAttribute("d","M48 68 Q60 60 72 68");
alert("❌ "+levels[level].bad);
if(hearts<=0) return lose();
load();
};

/* ENDINGS */
function win(){
document.getElementById("end").classList.remove("hidden");
document.getElementById("endText").innerHTML="<h2>🎉 You saved Saeed!</h2><p>You’re a cyber hero.</p><button class='safe' onclick='location.reload()'>Play Again</button>";
}
function lose(){
document.getElementById("end").classList.remove("hidden");
document.getElementById("endText").innerHTML="<h2>💔 Game Over</h2><p>Try again and protect Saeed.</p><button class='safe' onclick='location.reload()'>Retry</button>";
}
</script>

</body>
</html>
