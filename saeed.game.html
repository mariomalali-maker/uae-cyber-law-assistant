<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Saeed’s Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
 background:#0a0f1f;
 font-family: Arial, sans-serif;
 margin:0; overflow:hidden; color:white;
}
.game-area{
 width:100vw; height:100vh;
 background:url("https://i.imgur.com/4ioxTql.png") center/cover no-repeat;
 display:flex; justify-content:center; align-items:center;
 position:relative;
}
.saeed{
 width:85px; height:180px; background:white;
 border-radius:40px; position:absolute; left:25%; bottom:16%;
 animation:bounce 1s infinite alternate;
}
.saeed::before{
 content:""; width:100%; height:50px;
 position:absolute; top:-12px; background:white;
 border-radius:50%; border-top:10px solid black;
}
@keyframes bounce{0%{transform:translateY(0);}100%{transform:translateY(-4px);}}

.phone{
 width:330px; background:#101522; padding:20px;
 border-radius:20px; position:absolute; right:18%; bottom:20%;
 box-shadow:0 0 20px rgba(0,0,0,.6);
}
.qtext{
 background:#0c1227; padding:12px; margin-bottom:15px;
 border-radius:10px; font-size:15px;
}
.btn{width:100%;padding:12px;border-radius:10px;border:none;font-weight:bold;margin-top:8px;cursor:pointer;}
.safe{background:#11c776;color:white;}
.danger{background:#ff9f6c;color:black;}

.hearts{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:32px;}
.level{position:absolute;top:20px;right:40px;background:#001d2c;padding:8px 14px;border-radius:20px;}

#intro{
 position:fixed;inset:0;background:#0009;
 display:flex;flex-direction:column;justify-content:center;align-items:center;
 backdrop-filter:blur(7px);z-index:200;
}
.intro-box{background:#0b1222;padding:30px;border-radius:20px;text-align:center;width:300px;}
.lang{position:absolute;top:15px;right:15px;background:#002;padding:8px;border-radius:12px;cursor:pointer;}

</style>
</head>
<body>

<!-- 🔊 INTRO SCREEN -->
<div id="intro">
<div class="lang" onclick="toggleLang()">EN | AR</div>
<div class="intro-box">
<h2 id="intro-title">Meet Saeed 🧑🏻‍🦱</h2>
<p id="intro-text">He doesn’t know much about online safety yet. Play the intro then help him!</p>
<button id="playIntro" class="btn safe" onclick="playIntro()">▶ Play Introduction</button>
<button id="startGame" class="btn danger" disabled onclick="startGame()">Start Game ✔</button>
<audio id="voice" src="intro-voice.mp3"></audio>
</div>
</div>

<!-- 🎮 GAME -->
<div class="game-area">
<div class="hearts" id="hearts">❤️❤️❤️</div>
<div class="level" id="levelBox">Level 1 - DMs</div>

<div class="saeed"></div>

<div class="phone">
<div class="qtext" id="qtext"></div>
<button class="btn safe" id="safeBtn" onclick="answer(true)"></button>
<button class="btn danger" id="dangerBtn" onclick="answer(false)"></button>
</div>
</div>

<script>
/* 🌍 LANGUAGE */
let lang = "en";
function toggleLang(){
 lang = lang === "en" ? "ar" : "en";
 updateText();
}

/* 🎧 INTRO */
function playIntro(){
 const audio=document.getElementById("voice");
 audio.play();
 audio.onended=()=>{document.getElementById("startGame").disabled=false;}
}
function startGame(){
 document.getElementById("intro").style.display="none";
}

/* ❤️ GAME DATA */
let hearts = 3;
let current = 0;

/* 📌 10 QUESTIONS */
const questions = {
 en:[
  {q:"Hey, I found your account. Can you send me a private picture? 🫣", safe:"Block & report this account", danger:"Send them a photo", correct:"safe"},
  {q:"Congrats! You won a prize! Send your Emirates ID to claim.", safe:"Refuse & report", danger:"Send ID", correct:"safe"},
  {q:"Can I log into your account to fix something?", safe:"No, never", danger:"Yes here is my password", correct:"safe"},
  {q:"This bank link looks weird, open it?", safe:"Don't click suspicious links", danger:"Open link", correct:"safe"},
  {q:"Your friend: I forgot my password send me the code I got?", safe:"Don't share verification codes", danger:"Send code", correct:"safe"},
  {q:"Stranger: Share your location now!", safe:"Decline, Block", danger:"Send location", correct:"safe"},
  {q:"Download this app to get free followers.", safe:"Don't download unknown apps", danger:"Download it!", correct:"safe"},
  {q:"Police: Pay a fine now by transfer or go to jail!", safe:"Check official channel first", danger:"Pay immediately", correct:"safe"},
  {q:"Employer: Send personal documents to my WhatsApp", safe:"No, use official email only", danger:"Send directly", correct:"safe"},
  {q:"Free WiFi: Enter phone & ID to connect", safe:"Don't share ID just for WiFi", danger:"Enter info", correct:"safe"}
 ],
 ar:[
  {q:"مرحبا، هل ترسل لي صورة خاصة؟", safe:"الحظر و الإبلاغ", danger:"إرسال الصورة", correct:"safe"},
  {q:"ربحت جائزة! ارسل الهوية الإماراتية الآن", safe:"الرفض و الإبلاغ", danger:"إرسال الهوية", correct:"safe"},
  {q:"اعطني كلمة المرور لإصلح حسابك", safe:"لا, هذا خطير", danger:"حسنًا تفضل", correct:"safe"},
  {q:"افتح هذا الرابط البنكي الغريب", safe:"لا اضغط على الروابط المشبوهة", danger:"افتح الرابط", correct:"safe"},
  {q:"أرسل لي رمز التحقق من فضلك", safe:"عدم مشاركة الرموز", danger:"إرساله", correct:"safe"},
  {q:"شارك موقعك الآن!", safe:"رفض و حظر", danger:"موافق", correct:"safe"},
  {q:"حمّل هذا التطبيق لزيادة المتابعين", safe:"عدم تحميل تطبيقات مجهولة", danger:"تحميل", correct:"safe"},
  {q:"ادفع غرامة الآن عبر التحويل أو الجبس!", safe:"التأكد من القنوات الرسمية", danger:"الدفع فورًا", correct:"safe"},
  {q:"أرسل أوراقك لواتسابي للوظيفة", safe:"الإرسال عبر البريد الرسمي فقط", danger:"إرساله", correct:"safe"},
  {q:"للوصول للوايفاي أدخل الهاتف والهوية", safe:"لا ترسل هويتك للوايفاي", danger:"إدخال البيانات", correct:"safe"}
 ]
};

/* 🧠 UPDATE UI */
function updateText(){
 const q = questions[lang][current];
 document.getElementById("qtext").innerText = q.q;
 document.getElementById("safeBtn").innerText = q.safe;
 document.getElementById("dangerBtn").innerText = q.danger;

 document.getElementById("intro-title").innerText = lang==="en"?"Meet Saeed 🧑🏻‍🦱":"تعرف على سعيد 🧑🏻";
 document.getElementById("intro-text").innerText = lang==="en"?
 "He doesn’t know much about online safety yet. Play the intro then help him!":
 "سعيد لا يعرف الكثير عن الأمان الرقمي، استمع للمقدمة ثم ساعده!";
 document.getElementById("playIntro").innerText = lang==="en"?"▶ Play Introduction":"▶ تشغيل المقدمة";
 document.getElementById("startGame").innerText = lang==="en"?"Start Game ✔":"ابدأ ✔";
 document.getElementById("levelBox").innerText = lang==="en"?"Level 1 - DMs":"المستوى 1 - الرسائل";
}
updateText();

/* 🎯 ANSWERS */
function answer(safeSelected){
 const q = questions[lang][current];
 const correct = (safeSelected && q.correct==="safe");

 if(!correct){
  hearts--;
  document.getElementById("hearts").innerText = "❤️".repeat(hearts);
  if(hearts===0){
   alert(lang==="en"?"Game Over":"انتهت اللعبة");
   location.reload();
   return;
  }
 }

 current++;
 if(current >= questions[lang].length){
  alert(lang==="en"?"🎉 You finished all questions!":"🎉 لقد أنهيت جميع الأسئلة!");
  return;
 }

 updateText();
}
</script>

</body>
</html>
