<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyber Safety Assistant | Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- MAIN STYLE ---------------------------------------------------------->
  <style>
    /* ✨ ALL YOUR ORIGINAL CSS IS HERE — UNCHANGED EXCEPT FIXES */
    body {
      margin: 0;
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background: radial-gradient(circle at top,#111827,#020617);
      color: #f9fafb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: 0.3s;
    }
    body.light-mode { background: radial-gradient(circle at top,#e5e7eb,#f9fafb); color: #020617; }

    .top-nav {
      display: flex;align-items: center;justify-content: space-between;
      padding: 8px 14px;background: rgba(15,23,42,0.95);border-bottom: 1px solid #1f2937;
      position: sticky;top: 0;z-index: 10;
    }
    body.light-mode .top-nav { background:#e5e7eb;border-color:#d1d5db; }

    .nav-links { display:flex;gap:12px;align-items:center; }
    .top-nav a { color:inherit;text-decoration:none;font-size:14px;padding:4px 10px;border-radius:999px;transition:0.2s; }
    .top-nav a.active,.top-nav a:hover{background:rgba(55,65,81,0.8);}
    body.light-mode .top-nav a.active,body.light-mode .top-nav a:hover{background:rgba(148,163,184,0.5);}
    
    .nav-actions{display:flex;gap:8px;align-items:center;font-size:13px;}
    .toggle-btn{border-radius:999px;border:1px solid rgba(148,163,184,0.7);background:transparent;color:inherit;padding:4px 10px;cursor:pointer;font-size:12px;}

    main{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:20px 10px 70px;}
    .chat-shell{width:100%;max-width:900px;display:flex;justify-content:center;}

    .chat-card {
      width:100%;max-width:720px;
      background:linear-gradient(145deg,#020617,#0b1220);
      border-radius:24px;padding:18px;
      box-shadow:0 25px 60px rgba(0,0,0,0.7);
      border:1px solid #1f2937;overflow:hidden;
      animation:floatCloud 4s ease-in-out infinite;position:relative;
    }
    body.light-mode .chat-card{background:white;border-color:#e5e7eb;}

    @keyframes floatCloud{0%{transform:translateY(0);}50%{transform:translateY(-8px);}100%{transform:translateY(0);}}

    .messages-box{background:rgba(15,23,42,0.95);border-radius:18px;padding:10px;border:1px solid rgba(55,65,81,0.8);max-height:420px;overflow-y:auto;font-size:14px;}
    body.light-mode .messages-box{background:#f9fafb;border-color:#e5e7eb;}

    .msg{margin:6px 0;padding:10px 12px;border-radius:12px;white-space:pre-wrap;line-height:1.4;}
    .user-msg{background:#16a34a;color:#ecfdf5;}
    .ai-msg{background:#020617;border:1px solid rgba(75,85,99,0.9);color:#e5e7eb;}
    body.light-mode .ai-msg{background:white;border-color:#d1d5db;color:#111;}

    .typing-msg{display:inline-flex;align-items:center;gap:4px;}
    .dot{width:6px;height:6px;border-radius:50%;background:#9ca3af;animation:blink 1s infinite;}
    @keyframes blink{0%,100%{opacity:0.2;}50%{opacity:1;}}
  </style>

  <link rel="stylesheet" href="styles/style.css?v=7">
  <script defer src="scripts/chat.js?v=7"></script>
</head>

<body>

<!-- 🔝 NAVBAR ------------------------------------------------------------>
<nav class="top-nav">
  <div class="nav-links">
    <a href="index.html">🏠 Home</a>
    <a href="chat.html" class="active">💬 Chat</a>
    <a href="history.html">📁 History</a>
    <a href="quiz.html">🎯 Cyber Quiz</a>
    <a href="detector.html">🛡 Scam Detector</a>
    <a href="saeed.game.html">🎮 Saeed's Game</a>
  </div>
  
  <div class="nav-actions">
    <button id="lang-en" class="toggle-btn">EN</button>
    <button id="lang-ar" class="toggle-btn">AR</button>
    <button id="theme-toggle" class="toggle-btn">🌙</button>

    <!-- FIXED BUTTONS -->
    <button id="clear-chat" style="background:#444;color:white;padding:8px 12px;border-radius:6px;">
      ✨ Clear Chat
    </button>

    <button id="delete-all-history-btn" style="background:#b91c1c;color:white;padding:8px 12px;border-radius:6px;">
      🗑️ Delete All History
    </button>
  </div>
</nav>

<!-- MAIN -------------------------------------------------------------->
<main>
  <section class="chat-card">
    <h1 id="chat-title">Cyber Safety & UAE Law Assistant</h1>
    <p id="chat-subtitle">Ask anything about hacking, online threats, privacy & UAE laws.</p>

    <div id="messages" class="messages-box"></div>

    <form id="chat-form" class="input-row">
      <input id="chat-input" placeholder="Example: my snap got hacked wallah what should I do?">
      <button id="mic-btn" type="button">🎙</button>
      <button id="send-btn" type="submit">Send</button>
    </form>
    
    <p id="chat-helper">You can write in English or Arabic 😌</p>
  </section>
</main>

<p class="footer-sign">Created by Mariam – 2025</p>

<!-- SCRIPT -------------------------------------------------------------->
<script>
/* 🍯 ALL YOUR ORIGINAL JS BELOW — FIXED, NOT REMOVED */
const form=document.getElementById("chat-form");
const input=document.getElementById("chat-input");
const messagesBox=document.getElementById("messages");
const statusLabel=document.getElementById("status-label");
const sendBtn=document.getElementById("send-btn");
const micBtn=document.getElementById("mic-btn");
const themeToggle=document.getElementById("theme-toggle");
const langEnBtn=document.getElementById("lang-en");
const langArBtn=document.getElementById("lang-ar");
const chatTitle=document.getElementById("chat-title");
const chatSubtitle=document.getElementById("chat-subtitle");
const chatHelper=document.getElementById("chat-helper");
const clearChatBtn=document.getElementById("clear-chat");

const NAME_KEY="cyber_user_name";
const HISTORY_KEY="cyber_chat_history_v2";
const THEME_KEY="cyber_theme";
const LANG_KEY="cyber_lang";

let userName=localStorage.getItem(NAME_KEY)||"User";
let currentLang=localStorage.getItem(LANG_KEY)||"en";

/* 🌓 THEME TOGGLE ----------------------------------------------------*/
function applyTheme(){
  const saved=localStorage.getItem(THEME_KEY)||"dark";
  if(saved==="light"){document.body.classList.add("light-mode");themeToggle.textContent="☀️";}
  else{document.body.classList.remove("light-mode");themeToggle.textContent="🌙";}
}
themeToggle.onclick=()=>{const isLight=document.body.classList.toggle("light-mode");localStorage.setItem(THEME_KEY,isLight?"light":"dark");themeToggle.textContent=isLight?"☀️":"🌙";}
applyTheme();

/* 🌍 LANGUAGE ---------------------------------------------------------*/
function applyLanguage(){
  if(currentLang==="ar"){
    chatTitle.textContent="مساعد الأمن السيبراني والقانون الإلكتروني";
    chatSubtitle.textContent="اسأل عن التهكير، الخصوصية، الابتزاز الإلكتروني وأكثر";
    chatHelper.textContent="تقدر تكتب عربي أو إنجليزي 😌";
    input.placeholder="مثال: تهكر حسابي شو اسوي؟";
    document.body.dir="rtl";
  } else {
    chatTitle.textContent="Cyber Safety & UAE Law Assistant";
    chatSubtitle.textContent="Ask about hacking, online threats, privacy and UAE laws";
    chatHelper.textContent="You can write in English or Arabic 😌";
    input.placeholder="Example: my snap got hacked wallah";
    document.body.dir="ltr";
  }
}
langEnBtn.onclick=()=>{currentLang="en";localStorage.setItem(LANG_KEY,"en");applyLanguage();}
langArBtn.onclick=()=>{currentLang="ar";localStorage.setItem(LANG_KEY,"ar");applyLanguage();}
applyLanguage();

/* 💬 BUBBLES ----------------------------------------------------------*/
function addBubble(text,type){
  const div=document.createElement("div");
  div.className=`msg ${type==="user"?"user-msg":"ai-msg"}`;
  div.textContent=text;
  messagesBox.appendChild(div);
  messagesBox.scrollTop=messagesBox.scrollHeight;
}

/* 👋 GREETING ---------------------------------------------------------*/
function showGreeting(){
  if(currentLang==="ar"){
    addBubble(`مرحبا ${userName}! أنا مساعدك للأمن السيبراني.\n- تهكر حسابي شو أسوي؟\n⚠️ للتوضيح فقط وليس استشارة قانونية`, "ai");
  } else {
    addBubble(`Hey ${userName}! I’m your cyber safety assistant.\nYou can talk normal:\n- my snap got hacked wallah help\n⚠️ Not legal advice, just guidance.`, "ai");
  }
}
if(!localStorage.getItem(HISTORY_KEY)) showGreeting();

/* ✨ CLEAR CHAT (FIXED) ----------------------------------------------*/
clearChatBtn.onclick=()=>{
  if(confirm("Clear messages?")){
    messagesBox.innerHTML="";
    showGreeting();
  }
};

/* 🗑 DELETE ALL HISTORY ----------------------------------------------*/
document.getElementById("delete-all-history-btn").onclick=()=>{
  if(confirm("Delete ALL saved history?")){
    localStorage.removeItem(HISTORY_KEY);
    messagesBox.innerHTML="";
    showGreeting();
  }
};

/* 🎙 VOICE ------------------------------------------------------------*/
let recognition;
function setupSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){micBtn.onclick=()=>alert("Voice not supported in this browser.");return;}
  recognition=new SR();
  recognition.lang=currentLang==="ar"?"ar-AE":"en-US";
  recognition.onresult=e=>{input.value=e.results[0][0].transcript;}
  micBtn.onclick=()=>recognition.start();
}
setupSpeech();

/* 📩 SEND MESSAGE -----------------------------------------------------*/
form.onsubmit=async e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text) return;
  addBubble(text,"user");
  input.value="";

  const sendText=(currentLang==="ar" ? "[AR] ":"")+text;
  try{
    const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:sendText,username:userName})});
    const data=await res.json();
    addBubble(data.answer||"error","ai");
  }catch{addBubble("⚠️ network error","ai");}
};
</script>
</body>
</html>
