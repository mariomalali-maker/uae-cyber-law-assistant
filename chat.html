<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cyber Safety Assistant | Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
/* 🌌 BACKGROUND */
body {
  margin: 0;
  background: linear-gradient(135deg,#0f172a,#020617 40%,#0b0f1a);
  font-family: "Inter",system-ui;
  color: #fff;
  display: flex;
  min-height: 100vh;
  flex-direction: column;
  background-attachment: fixed;
}

/* 🔥 NAVBAR */
nav {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 18px;
  backdrop-filter: blur(12px);
  background:rgba(255,255,255,0.05);
  border-bottom:1px solid rgba(255,255,255,0.1);
}
nav a {
  padding:6px 12px;
  border-radius:12px;
  text-decoration:none;
  color:white;
  font-size:14px;
  transition:0.2s;
}
nav a:hover,.active { background:rgba(255,255,255,0.15); }

/* 🌐 LANGUAGE + CLEAR */
nav button {
  background:rgba(255,255,255,0.12);
  border:none;
  color:white;
  padding:6px 10px;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
  transition:0.2s;
}
nav button:hover { background:#22c55e; color:#000; }

/* 🟣 CHAT CONTAINER */
.chat-card {
  max-width:740px;
  margin:auto;
  width:90%;
  margin-top:50px;
  background:rgba(255,255,255,0.08);
  padding:20px;
  border-radius:22px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 32px rgba(0,255,200,0.15);
  border:1px solid rgba(255,255,255,0.2);
  animation:fadeIn 0.6s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(20px);} }

/* ✨ MESSAGE AREA */
#messages {
  max-height:430px;
  overflow-y:auto;
  padding:10px;
  display:flex;
  flex-direction:column;
  gap:10px;
  scrollbar-width:none;
}
#messages::-webkit-scrollbar { display:none; }

/* 💬 BUBBLES */
.msg {
  padding:12px 14px;
  border-radius:14px;
  max-width:80%;
  word-break:break-word;
  line-height:1.45;
  animation:pop 0.25s ease;
}
@keyframes pop { from{transform:scale(0.9);opacity:0;} }

.user-msg {
  align-self:flex-end;
  background:linear-gradient(135deg,#22c55e,#15803d);
  color:#000;
}

.ai-msg {
  align-self:flex-start;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25);
}

/* 🎙️ INPUT BOX */
.input-row {
  display:flex;
  gap:10px;
  margin-top:14px;
}
input {
  flex:1;
  padding:12px;
  border-radius:12px;
  border:none;
  background:#101828;
  color:white;
  font-size:15px;
  outline:none;
}
button#send-btn, #mic-btn {
  padding:12px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#22c55e,#06b6d4);
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

/* 🌙 DARK/LIGHT TOGGLE */
.light {
  background:white;
  color:black;
}
.light .chat-card { background:white;color:black; }
</style>
</head>

<body>

<nav>
  <div>
    <a href="index.html">🏠 Home</a>
    <a class="active">💬 Chat</a>
    <a href="history.html">📁 History</a>
    <a href="quiz.html">🎯 Quiz</a>
    <a href="detector.html">🛡 Detector</a>
  </div>
  <div>
    <button id="lang-en">EN</button>
    <button id="lang-ar">AR</button>
    <button id="clear-chat-btn">✨ Clear</button>
  </div>
</nav>

<div class="chat-card">
  <h2 id="title">Cyber Safety & UAE Law Assistant</h2>
  <p id="subtitle">Ask about hacking, threats, privacy, cyberbullying...</p>

  <div id="messages"></div>

  <form id="chat-form" class="input-row">
    <input id="chat-input" placeholder="Type here...">
    <button id="mic-btn" type="button">🎙</button>
    <button id="send-btn" type="submit">Send</button>
  </form>
</div>

<script>
/* === VARIABLES === */
let lang = localStorage.getItem("lang")||"en";
let name = localStorage.getItem("cyber_user_name")||"User";
const messages = document.getElementById("messages");

/* === GREETING === */
function greet(){
  messages.innerHTML = "";
  add("ai",
    lang==="ar"
    ? `مرحباً ${name} 👋✨\nكيف أقدر أساعدك اليوم؟`
    : `Hey ${name}! 👋✨\nHow can I help you today?`
  );
}

/* === BUBBLE === */
function add(role,text){
  let div=document.createElement("div");
  div.className="msg "+(role==="user"?"user-msg":"ai-msg");
  div.textContent=text;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

/* === SEND === */
document.getElementById("chat-form").onsubmit = async(e)=>{
  e.preventDefault();
  let text=document.getElementById("chat-input").value.trim();
  if(!text)return;
  add("user",text);
  document.getElementById("chat-input").value="";

  let res=await fetch("/api/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text,language:lang,username:name})
  });
  let data=await res.json();
  add("ai",data?.answer||"⚠️ Error");
};

/* === LANGUAGE === */
document.getElementById("lang-en").onclick=()=>{lang="en";localStorage.setItem("lang","en");greet();}
document.getElementById("lang-ar").onclick=()=>{lang="ar";localStorage.setItem("lang","ar");greet();}

/* === CLEAR === */
document.getElementById("clear-chat-btn").onclick=()=>{
  if(confirm("Clear chat?")) greet();
};

/* === MIC === */
document.getElementById("mic-btn").onclick=()=>{
  const R = window.SpeechRecognition||webkitSpeechRecognition;
  if(!R)return alert("Not supported");
  const rec=new R();
  rec.lang=lang==="ar"?"ar-AE":"en-US";
  rec.onresult=e=>document.getElementById("chat-input").value=e.results[0][0].transcript;
  rec.start();
};

greet();
</script>
<script src="chat.js?v=15"></script>
</body>
</html>
