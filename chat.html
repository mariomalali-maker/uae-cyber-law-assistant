<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>

<title>Saeed Cyber Survival</title>

<style>
body{
 background:#0a0f1f;
 font-family:Segoe UI, sans-serif;
 color:white;
}

/* FLOATING BOX */
#gameBox{
 position:fixed;
 inset:0;
 margin:auto;
 max-width:900px;
 height:640px;
 background:#111827;
 border-radius:24px;
 border:1px solid #1f2937;
 box-shadow:0 20px 80px rgba(0,0,0,.6);
 overflow:hidden;
}

/* SCENE */
#scene{
 position:relative;
 height:520px;
}

/* SAEED AVATAR */
#saeed{
 position:absolute;
 left:10%;
 bottom:0;
 width:240px;
}

/* CLOTHES MENU */
#closet{
 position:absolute;
 right:3%;
 top:80px;
 width:320px;
 background:#020617;
 padding:12px;
 border-radius:18px;
}

/* PHONE BUBBLES */
#phone{
 position:absolute;
 right:6%;
 bottom:20px;
 width:340px;
}

/* BUTTONS FIXED */
.choiceBtn{
 width:100%;
 margin-top:8px;
 padding:10px;
 border:0;
 border-radius:12px;
 font-weight:700;
 cursor:pointer;
}

/* DANGER BAR */
#danger{
 width:200px;
}

.bar{
 height:8px;
 background:#1e293b;
 border-radius:999px;
 overflow:hidden;
}

.bar>div{
 height:100%;
 width:0%;
 background:linear-gradient(to right,#22c55e,#f59e0b,#ef4444);
 transition:.4s;
}

/* MINI LEADER BOARD */
#miniBoard{
 position:absolute;
 left:14px;
 top:74px;
 width:260px;
 background:#020617;
 border-radius:16px;
 padding:10px;
}

/* RESPONSIVE */
@media(max-width:760px){
 #gameBox{width:100%;height:100vh}
 #closet{right:50%;top:320px;transform:translateX(50%)}
 #phone{right:50%;transform:translateX(50%)}
}

</style>
</head>

<body>

<div id="gameBox">

<!-- HUD -->
<div id="hud" style="padding:12px;background:#020617">
 <span id="level">Level 1</span> |
 <span id="score">Score: 0</span> |
 <span id="hearts">❤❤❤</span>
</div>

<!-- AVATAR CLOTHES -->
<div id="closet">
 <h3>Avatar Clothes</h3>

 <select id="clothSelect">
  <option>Hoodie</option>
  <option>Police Style</option>
  <option>Gamer Shirt</option>
 </select>

 <button class="choiceBtn" onclick="applyClothes()">Apply</button>
</div>

<!-- MINI BOARD -->
<div id="miniBoard">
 <h4>Top Players</h4>
 <div id="topList"></div>
</div>

<section id="scene">

<!-- SAEED HUMAN LOOKING -->
<div id="saeed">
<svg viewBox="0 0 220 320">

 <!-- body -->
 <rect x="76" y="140" width="68" height="120" rx="28" fill="#f9fafb"/>

 <!-- head -->
 <circle cx="110" cy="94" r="50" fill="#eab308"/>

 <!-- hair -->
 <path d="M70 84 Q110 40 150 84 Z" fill="#0b1220"/>

 <!-- eyes -->
 <circle cx="92" cy="110" r="6" fill="#0b1220"/>
 <circle cx="128" cy="110" r="6" fill="#0b1220"/>

 <!-- brows -->
 <path id="browL" d="M82 92 Q92 86 102 92" stroke="#0b1220" stroke-width="6" stroke-linecap="round" opacity=".15"/>
 <path id="browR" d="M118 92 Q128 86 138 92" stroke="#0b1220" stroke-width="6" stroke-linecap="round" opacity=".15"/>

 <!-- cheeks -->
 <g id="cheeks" opacity=".18">
   <ellipse cx="78" cy="128" rx="10" ry="6" fill="#fb7185"/>
   <ellipse cx="142" cy="128" rx="10" ry="6" fill="#fb7185"/>
 </g>

 <!-- mouth emotions -->
 <path id="mouth" d="M56 132 Q100 164 144 132" stroke="#b91c1c" stroke-width="6" fill="none"/>

 <!-- shadow -->
 <ellipse cx="110" cy="300" rx="46" ry="12" fill="rgba(0,0,0,.45)"/>

</svg>
</div>

<!-- PHONE UI -->
<div id="phone">
 <div class="bubble" id="qTxt"></div>

 <button id="safeBtn" class="choiceBtn"> </button>
 <button id="riskBtn" class="choiceBtn"> </button>

 <div id="danger" class="bar"><div id="dangerFill"></div></div>
</div>

</section>

<!-- INTRO STORY -->
<div class="overlay" id="introOverlay">
<div class="panel" style="text-align:center">
 <h2>Meet Saeed</h2>
 <p>
 This is Saeed.  
 He enjoys playing online and chatting with friends,  
 but cyber scams and hackers try to trick him.  
 The player must guide Saeed through **8 levels**  
 and choose actions that keep him safe while earning score.
 </p>

 <button class="bigBtn" onclick="startGame()">Start Game</button>
</div>
</div>

<!-- LANGUAGE -->
<div class="overlay" id="langOverlay" style="display:none">
 <button onclick="setLang('en')">English</button>
 <button onclick="setLang('ar')">العربية</button>
</div>

<!-- END -->
<div class="overlay" id="endOverlay" style="display:none"></div>

</div>

<script>

/* CERTIFICATE */
function certificate(name, pts){
 return `
 <h2>You Won</h2>
 <p>${name} – ${pts} pts</p>
 <button onclick="location.reload()">Play Again</button>`;
}

/* LEADER BOARD SAVE */
function saveBoard(n, s){
 let b = JSON.parse(localStorage.board || "[]");
 b.push({n,s});
 localStorage.board = JSON.stringify(b);
}

/* FACE ANIMATIONS */
function reactFace(state){
 const face = document.getElementById("saeed");
 if(state==="shocked"){
   mouth(false);
 }
 if(state==="happy"){
   mouth(true);
 }
}

/* BUTTON BUG FIX – LISTENERS */
document.getElementById("safeBtn").addEventListener("click", ()=>choose(true));
document.getElementById("riskBtn").addEventListener("click", ()=>choose(false));

let level=0, score=0, hearts=3, danger=0;
let lang="en";
let SCENES=[];

function setLang(l){lang=l;}

function startGame(){
 gameStarted=true;
 render();
}

/* GAME DATA 8 LEVELS */
SCENES=[
{
 q:{en:"DM asks for OTP",ar:"رسالة تطلب OTP"},
 safe:{txt:{en:"رفض + حظر",ar:"refuse"},emo:"happy",delta:{hearts:0,danger:-10}},
 risk:{txt:{en:"اعطي OTP",ar:"give"},emo:"worried",delta:{hearts:-1,danger:+20}},
},

{
 q:{en:"Email click bank",ar:"رابط بنك"},
 safe:{txt:{en:"تطبيق رسمي",ar:"app"},emo:"happy",delta:{danger:-8}},
 risk:{txt:{en:"اضغط الرابط",ar:"click"},emo:"shocked",delta:{hearts:-1,danger:+16}},
},

{
 q:{en:"Download prize",ar:"تحميل"},
 safe:{txt:{en:"احذف",ar:"delete"},emo:"happy",delta:{danger:-6}},
 risk:{txt:{en:"حمّل",ar:"download"},emo:"worried",delta:{hearts:-1,danger:+18}},
},

{
 q:{en:"Share age",ar:"شارك عمرك"},
 safe:{txt:{en:"لا تشارك",ar:"no"},emo:"happy",delta:{danger:-5}},
 risk:{txt:{en:"شارك",ar:"share"},emo:"worried",delta:{danger:+14}},
},

{
 q:{en:"Meet alone?",ar:"تقابل وحدك"},
 safe:{txt:{en:"خبر الشرطة",ar:"tell adult"},emo:"happy",delta:{danger:-20}},
 risk:{txt:{en:"روح",ar:"go"},emo:"shocked",delta:{hearts:-1,danger:+40}},
},

{
 q:{en:"Public Wi-Fi login?",ar:"واي فاي"},
 safe:{txt:{en:"بيانات الهاتف",ar:"4G"},emo:"happy",delta:{danger:-5}},
 risk:{txt:{en:"سجّل دخول",ar:"login"},emo:"worried",delta:{danger:+22}},
},

{
 q:{en:"Friend sends random link",ar:"رابط غريب"},
 safe:{txt:{en:"اسألهم",ar:"ask"},emo:"happy",delta:{danger:-6}},
 risk:{txt:{en:"اضغط",ar:"click"},emo:"shocked",delta:{hearts:-1,danger:+14}},
},

{
 q:{en:"Threat rumors incoming",ar:"شائعات"},
 safe:{txt:{en:"صور + تبليغ",ar:"evidence"},emo:"happy",delta:{danger:-10}},
 risk:{txt:{en:"رد بعصبية",ar:"angry"},emo:"shocked",delta:{hearts:-1,danger:+16}},
}
];

function choose(isSafe){
 const s = SCENES[level];
 if(isSafe){
   reactFace("happy");
   score+=12;
   level++;
 }else{
   reactFace("shocked");
   hearts--;
   danger+=20;
   level++;
 }

 render();
}

/* RENDER UTIL */
function render(){
 if(!gameStarted) return;

 document.getElementById("qTxt").textContent = SCENES[level].q[lang];

 document.getElementById("safeBtn").textContent = SCENES[level].safe.txt[lang];
 document.getElementById("riskBtn").textContent = SCENES[level].risk.txt[lang];

 updateHud();

 if(hearts<=0 || danger>=100){
   document.getElementById("endOverlay").innerHTML =
   certificate("Player", score);
   saveBoard("Player", score);
 }
}

function updateHud(){
 document.getElementById("score").textContent = "Score "+score;
 document.getElementById("level").textContent = "Level "+(level+1);

 document.getElementById("hearts").textContent =
 "❤".repeat(hearts)+"🖤".repeat(3-hearts);

 danger = clamp(danger,0,100);
 document.getElementById("dangerFill").style.width = danger+"%";
 document.getElementById("dangerPct").textContent = danger+"%";
}

/* MINI BOARD */
function miniBoard(){
 let b = JSON.parse(localStorage.board || "[]");
 b.sort((a,b)=>b.s-a.s);
 document.getElementById("topList").innerHTML =
 b.slice(0,5).map(x=>`${x.n} – ${x.s}`).join("<br/>");
}
miniBoard();

</script>

</body>
</html>
