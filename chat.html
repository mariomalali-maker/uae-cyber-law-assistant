<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cyber Safety Chat</title>

<style>
body{
  margin:0;
  font-family:system-ui,sans-serif;
  background:#050816;
  color:white;
}
nav{
  display:flex;
  gap:16px;
  padding:14px 20px;
  background:#0f1629;
  border-bottom:1px solid rgba(255,255,255,.12);
  overflow-x:auto;
}
nav a{
  color:white;
  text-decoration:none;
  font-size:.9rem;
  padding:6px 10px;
  border-radius:8px;
}
nav a:hover{
  background:#1f2937;
}
nav .active{
  background:#22c55e;
  color:#000;
}

#container{
  max-width:780px;
  margin:30px auto;
  background:#0d1322;
  padding:22px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.1);
}

.messages{
  height:430px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.msg{
  max-width:78%;
  padding:10px 14px;
  border-radius:12px;
  font-size:.95rem;
  animation:pop .25s ease;
  line-height:1.35;
}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97);}to{opacity:1;transform:none;}}

.user{background:#22c55e;color:black;margin-left:auto;}
.bot{background:#111827;border:1px solid rgba(255,255,255,.15)}

.input-box{
  display:flex;
  gap:8px;
  padding:10px;
  background:#0f172a;
  border-radius:12px;
  margin-top:14px;
}
.input-box input{
  flex:1;
  background:transparent;
  border:none;
  padding:10px;
  color:white;
  outline:none;
}
.input-box button{
  border:none;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}
.send{background:#22c55e;color:black;}
.mic,.speak{background:#1e293b;color:white;}

</style>
</head>

<body>

<nav>
  <a href="index.html">🏠 Home</a>
  <a class="active" href="chat.html">💬 Chat</a>
  <a href="quiz.html">🧠 Cyber Quiz</a>
  <a href="scam.html">🛑 Scam Detector</a>
  <a href="settings.html">⚙️ Settings</a>
  <a href="saeed.game.html">🎮 Saeed's Game</a>

  <button id="en">EN</button><button id="ar">AR</button>
</nav>

<div id="container">
  <h2>Cyber Safety & UAE Law Assistant</h2>
  <p style="opacity:.7">Ask anything related to hacking, blackmail, privacy or UAE cyber laws.</p>

  <div class="messages" id="messages"></div>

  <div class="input-box">
    <input type="text" id="input" placeholder="Example: my insta got hacked wallah help" />
    <button class="mic" id="mic">🎤</button>
    <button class="speak" id="speak">🔊</button>
    <button class="send" id="send">Send</button>
  </div>
</div>

<script>
// LANGUAGE
let lang = "en";
document.getElementById("en").onclick = ()=> lang="en";
document.getElementById("ar").onclick = ()=> lang="ar";

// ADD MESSAGE
function add(text,type){
  let d=document.createElement("div");
  d.className="msg "+type;
  d.textContent=text;
  document.getElementById("messages").appendChild(d);
  d.scrollIntoView({behavior:"smooth",block:"end"});
}

// SEND
async function send(){
  const input=document.getElementById("input");
  const t=input.value.trim();
  if(!t)return;
  add(t,"user");
  input.value="";

  const res = await fetch("/api/chat",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({message:t,language:lang})
  });
  const data = await res.json();
  add(data.reply,"bot");
}
document.getElementById("send").onclick = send;
document.getElementById("input").onkeydown = e=>{
  if(e.key==="Enter") send();
};

// 🎤 Voice Input
document.getElementById("mic").onclick = ()=>{
  if(!("webkitSpeechRecognition" in window)) return alert("not supported");
  let rec=new webkitSpeechRecognition();
  rec.lang=lang==="ar"?"ar":"en-US";
  rec.start();
  rec.onresult = e=> document.getElementById("input").value = e.results[0][0].transcript;
};

// 🔊 Speak Reply
document.getElementById("speak").onclick = ()=>{
  let last=[...document.querySelectorAll(".bot")].pop();
  if(!last)return;
  let s=new SpeechSynthesisUtterance(last.textContent);
  s.lang=lang==="ar"?"ar":"en-US";
  speechSynthesis.speak(s);
};
</script>
</body>
</html>
