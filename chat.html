<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Cyber Safety Assistant | Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>

/* 🌌 BACKGROUND */
body {
  margin:0;
  font-family:"Inter",system-ui;
  background:linear-gradient(135deg,#0c0f19,#111827 40%,#020617);
  color:white;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* 🔥 NAVBAR */
nav {
  display:flex;
  justify-content:space-between;
  padding:10px 16px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,0.15);
}
nav a {
  color:white;
  text-decoration:none;
  padding:6px 10px;
  border-radius:10px;
  transition:0.2s;
}
nav a:hover, nav a.active {
  background:rgba(255,255,255,0.2);
}
nav button {
  background:rgba(255,255,255,0.1);
  border:none;
  color:white;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

/* 💬 CHAT CONTAINER */
.chat-card {
  width:90%;
  max-width:800px;
  margin:auto;
  margin-top:40px;
  background:rgba(255,255,255,0.08);
  border-radius:24px;
  padding:22px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 30px rgba(0,255,200,0.15);
  animation:fade 0.6s ease;
}
@keyframes fade {from{opacity:0;transform:translateY(20px);}}

/* 🟢 iPHONE BUBBLES */
#messages{
  display:flex;
  flex-direction:column;
  gap:10px;
  height:420px;
  overflow-y:auto;
  padding:12px;
}
.msg {
  max-width:80%;
  padding:12px 14px;
  border-radius:18px;
  font-size:15px;
  line-height:1.45;
  animation:pop 0.25s ease;
}
@keyframes pop{from{transform:scale(.8);opacity:0;}}

/* USER MESSAGE – GREEN (like iMessage) */
.user-msg {
  background:#1df970;
  align-self:flex-end;
  color:#000;
  border-bottom-right-radius:6px;
}

/* AI MESSAGE – GRAY iPhone style */
.ai-msg {
  background:#e5e5ea;
  color:black;
  align-self:flex-start;
  border-bottom-left-radius:6px;
}

/* TYPEWRITER CURSOR */
.typewriter {
  border-right:3px solid #22c55e;
  white-space:pre-line;
  overflow:hidden;
  animation: blink .8s infinite;
}
@keyframes blink{0%,100%{border-color:transparent;}50%{border-color:#22c55e;}}

/* INPUT AREA */
.input-row{
  display:flex;
  gap:10px;
  margin-top:12px;
}
input{
  flex:1;
  background:#0d1117;
  border:none;
  padding:12px;
  border-radius:14px;
  color:white;
  outline:none;
}
button{
  padding:12px;
  border:none;
  border-radius:14px;
  cursor:pointer;
  font-weight:bold;
}
#send-btn{background:#1df970;}
#mic-btn{background:#06b6d4;}

</style>
</head>


<body>

<nav>
  <div>
   <a href="index.html">🏠 Home</a>
<a href="chat.html">💬 Chat</a>
<a href="history.html">📁 History</a>
<a href="quiz.html">🧠 Cyber Quiz</a>
<a href="scam.html">⚠️ Scam Detector</a>
<a href="saeed.game.html" class="active">🎮 Saeed's Game</a>
    
  </div>
  <div>
    <button id="lang-en">EN</button>
    <button id="lang-ar">AR</button>
    <button id="clear-chat">✨ Clear</button>
  </div>
</nav>

<section class="chat-card">
  <h2 id="title" style="margin:0 0 8px;">Cyber Safety & UAE Law Assistant</h2>
  <p id="subtitle">Ask about hacking, online threats & reporting.</p>

  <div id="messages"></div>

  <form id="chat-form" class="input-row">
    <input id="chat-input" placeholder="Type here...">
    <button id="mic-btn" type="button">🎙</button>
    <button id="send-btn" type="submit">Send</button>
  </form>
</section>




<script>
/* ===================== */
/* VARIABLES */
/* ===================== */
let lang = localStorage.getItem("lang")||"en";
let username = localStorage.getItem("cyber_user_name")||"Guest";
const box = document.getElementById("messages");

/* ===================== */
/* ADD BUBBLE */
/* ===================== */
function add(role,text){
  const d=document.createElement("div");
  d.className="msg "+(role==="user"?"user-msg":"ai-msg");
  d.textContent=text;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
}

/* ===================== */
/* TYPEWRITER INTRO */
/* ===================== */
function typewriter(text){
  let i=0;
  const speed=28;
  const div=document.createElement("div");
  div.className="msg ai-msg typewriter";
  box.appendChild(div);

  function write(){
    if(i<text.length){
      div.textContent=text.slice(0,i+1);
      i++;
      box.scrollTop=box.scrollHeight;
      setTimeout(write,speed);
    } else {
      div.classList.remove("typewriter");
    }
  }
  write();
}

/* ===================== */
/* GREETING MESSAGE */
/* ===================== */
function greet(){
  box.innerHTML="";
  let message = lang==="ar"
  ? `مرحباً ${username} 👋✨
أنا مساعدك للقانون الإلكتروني والأمن السيبراني في الإمارات 🇦🇪
تقدر تسأل عن:
• تهكير، ابتزاز، تهديد، سرقة حساب
• رسائل مشبوهة / نصابين
• وين أبلغ؟ وكيف أجمع دليل؟

اكتب رسالتك تحت 👇`
  : `Hey ${username}! 👋✨
I'm your UAE Cyber Safety Assistant 🇦🇪
Ask me about:
• hacked accounts & blackmail
• scam messages / suspicious links
• how to report in UAE & gather proof

Type below 👇`;

  typewriter(message);
}
greet();

/* ===================== */
/* SEND TO BACKEND */
/* ===================== */
document.getElementById("chat-form").onsubmit=async(e)=>{
  e.preventDefault();
  const text=document.getElementById("chat-input").value.trim();
  if(!text)return;
  add("user",text);
  document.getElementById("chat-input").value="";

  const response=await fetch("/api/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:text,language:lang,username})
  });
  const data=await response.json();
  add("ai",data?.answer||"⚠️ Error");
};

/* ===================== */
/* CLEAR CHAT */
/* ===================== */
document.getElementById("clear-chat").onclick=()=>{
  if(confirm("Clear chat?")) greet();
};

/* ===================== */
/* LANGUAGE SWITCH */
/* ===================== */
document.getElementById("lang-en").onclick=()=>{lang="en";localStorage.setItem("lang","en");greet();}
document.getElementById("lang-ar").onclick=()=>{lang="ar";localStorage.setItem("lang","ar");greet();}

/* ===================== */
/* SPEECH INPUT */
/* ===================== */
document.getElementById("mic-btn").onclick=()=>{
  const R = window.SpeechRecognition||webkitSpeechRecognition;
  if(!R)return alert("🎙 Not supported here");
  const rec=new R();
  rec.lang = lang==="ar"?"ar-AE":"en-US";
  rec.onresult=e=>document.getElementById("chat-input").value=e.results[0][0].transcript;
  rec.start();
};
</script>
<script src="chat.js?v=16"></script>
</body>
</html>
