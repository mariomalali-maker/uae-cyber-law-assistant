<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyber Safety Assistant | Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
/* --------------------- STYLES (unchanged) --------------------- */
body{margin:0;font-family:system-ui;-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#111827,#020617);color:#f9fafb;min-height:100vh;display:flex;flex-direction:column;}
.top-nav{display:flex;justify-content:space-between;padding:8px 14px;background:#0f172a;border-bottom:1px solid #1f2937}
.nav-links{display:flex;gap:12px}
.nav-links a{color:white;text-decoration:none;padding:5px 10px;border-radius:8px}
.nav-links a.active,.nav-links a:hover{background:#1e293b}
.chat-shell{max-width:900px;width:100%;margin:auto;padding:20px}
.chat-card{background:#0b1220;border-radius:20px;padding:20px;border:1px solid #1f2937;max-width:720px;margin:auto}
#messages{background:#111827;border-radius:12px;height:420px;overflow-y:auto;padding:10px;border:1px solid #1f2937}
.msg{padding:10px;border-radius:8px;margin:5px 0;white-space:pre-wrap;line-height:1.4}
.user-msg{background:#16a34a;color:white}
.ai-msg{background:#020617;border:1px solid #334155}
.input-row{display:flex;gap:8px;margin-top:10px}
#chat-input{flex:1;padding:10px;border-radius:999px;border:none;background:#020617;color:white}
button{cursor:pointer}
</style>
</head>


<body>

<nav class="top-nav">
<div class="nav-links">
<a href="index.html">🏠 Home</a>
<a href="chat.html" class="active">💬 Chat</a>
<a href="history.html">📁 History</a>
<a href="quiz.html">🎯 Cyber Quiz</a>
<a href="detector.html">🛡 Scam Detector</a>
</div>

<div>
<button id="lang-en">EN</button>
<button id="lang-ar">AR</button>
<button id="clear-chat-btn">✨ Clear</button>
</div>
</nav>



<div class="chat-shell">
<section class="chat-card">

<h3 id="title">Cyber Safety & UAE Law Assistant</h3>
<p id="subtitle">Ask about hacking, threats, privacy, bullying…</p>

<div id="messages"></div>

<form id="chat-form" class="input-row">
<input id="chat-input" placeholder="my snap got hacked wallah help?">
<button id="send-btn">Send</button>
</form>

</section>
</div>


<!-- ---------------------- JAVASCRIPT ---------------------- -->
<script>
const messages = document.getElementById("messages");
const form = document.getElementById("chat-form");
const input = document.getElementById("chat-input");
const clearBtn = document.getElementById("clear-chat-btn");
const enBtn = document.getElementById("lang-en");
const arBtn = document.getElementById("lang-ar");
let lang = localStorage.getItem("lang") || "en";

function bubble(text,type){
  const div=document.createElement("div");
  div.className="msg "+(type==="user"?"user-msg":"ai-msg");
  div.textContent=text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

/* 🌍 LANGUAGE TEXT */
function applyLang(){
 if(lang==="ar"){
   document.getElementById("title").textContent="مساعد الأمن السيبراني والقانون الإماراتي";
   document.getElementById("subtitle").textContent="اسأل عن التهكير، الابتزاز، الخصوصية، التنمر الإلكتروني...";
   input.placeholder="تهكر حسابي شو أسوي؟";
 } else {
   document.getElementById("title").textContent="Cyber Safety & UAE Law Assistant";
   document.getElementById("subtitle").textContent="Ask about hacking, threats, privacy, cyberbullying…";
   input.placeholder="my snap got hacked wallah help?";
 }
}
applyLang();

/* 👋 GREETING */
function greet(){
 messages.innerHTML="";
 if(lang==="ar"){
   bubble("مرحباً! كيف أقدر أساعدك؟ 😌","ai");
 } else {
   bubble("Hey! How can I help you today? 😌","ai");
 }
}
greet();

/* ✉️ SEND TO API */
form.onsubmit = async(e)=>{
 e.preventDefault();
 const text = input.value.trim();
 if(!text) return;

 bubble(text,"user");
 input.value="";

 const send = lang==="ar" ? "[AR] "+text : text;

 const res = await fetch("/api/chat",{
   method:"POST",
   headers:{ "Content-Type":"application/json" },
   body:JSON.stringify({message:send})
 });
 const data = await res.json();
 bubble(data.answer || "⚠️ error","ai");
};

/* 🧽 CLEAR */
clearBtn.onclick = ()=>{ greet(); };

/* 🔁 LANGUAGE SWITCH */
enBtn.onclick = ()=>{ lang="en"; localStorage.setItem("lang","en"); applyLang(); greet(); };
arBtn.onclick = ()=>{ lang="ar"; localStorage.setItem("lang","ar"); applyLang(); greet(); };

</script>
<script src="chat.js?v=14"></script>

</body>
</html>
