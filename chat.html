<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Safety & Cyber Law Helper</title>
<link rel="stylesheet" href="styles/style.css">
</head>

<body class="chat-body">

<!-- Navigation -->
<nav class="top-nav">
  <a href="index.html">🏠 Home</a>
  <a href="chat.html" class="active">💬 Chat</a>
  <a href="history.html">📁 History</a>
  <a href="quiz.html">🎯 Cyber Quiz</a>
</nav>

<h2>🔐 Online Safety & Cyber Law Helper</h2>
<p style="opacity:0.8;">Smart answers for online safety, hacking issues & digital laws</p>

<div class="chat-box floating">
  <div id="messages" class="messages-area"></div>

  <form id="chat-form" class="input-area">
    <input id="chat-input" type="text" placeholder="Write anything… (example: My Snapchat got hacked)" autocomplete="off" />
    <button type="submit">Send</button>
  </form>
</div>

<p id="status-label" style="margin-top:10px; opacity:0.7;">Online</p>
<p class="footer">Created by Mariam – 2025</p>

<script>
  const form = document.getElementById("chat-form");
  const input = document.getElementById("chat-input");
  const messagesBox = document.getElementById("messages");
  const statusLabel = document.getElementById("status-label");
  const userName = localStorage.getItem("cyber_user_name") || "User";

  function addBubble(text, type) {
    const div = document.createElement("div");
    div.className = type === "user" ? "msg user-msg" : "msg ai-msg";
    div.textContent = text;
    messagesBox.appendChild(div);
    messagesBox.scrollTop = messagesBox.scrollHeight;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addBubble(text, "user");
    input.value = "";
    statusLabel.textContent = "⏳ Thinking...";

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, username: userName })
      });

      const data = await res.json();

      if (data.answer) {
        addBubble(data.answer, "ai");
        statusLabel.textContent = "Online";
      } else if (data.error) {
        addBubble("⚠️ AI error: " + data.error, "ai");
        statusLabel.textContent = "Error";
      } else {
        addBubble("⚠️ Unexpected AI response", "ai");
        statusLabel.textContent = "Error";
      }
    } catch {
      addBubble("⚠️ Network error, try again.", "ai");
      statusLabel.textContent = "Error";
    }
  });
</script>

</body>
</html>
